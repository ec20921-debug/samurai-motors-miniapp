<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Samurai 現場アプリ v2（試作）</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Samurai">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   Samurai Motors 現場アプリ v2（試作・サンプルデータのみ・通信なし）

   設計の軸（カンボジア現場ファースト）
   1. 画面は「次に何をするか」を1つだけ示す。フォームを埋めさせない
   2. クメール語のみを主表示（日本語併記で文字を小さくしない）。管理者は言語切替で全画面を日本語に
   3. 親指1本・屋外の日差し・手袋: 主ボタンは画面下・高さ64px以上・高コントラスト
   4. 文字より絵: 写真は1枚ずつ「見本の絵→撮る→次」、傷は車の図をタップ、点検はアイコン
   5. 記録は作業の副産物として自動で残る（サービス別の時間・傷・支払い・流入経路）
   6. 地下駐車場でも止まらない: 端末に保存→電波が戻れば送る
   ═══════════════════════════════════════════════════════════════ */
:root {
  --bg:#f2f4f7; --card:#fff; --band:#e6eaf0; --line:#cfd6df;
  --text:#141922; --sub:#4d5765; --faint:#98a2b3;
  --gold:#8a6a1f; --gold-bg:#f6efdc;
  --blue:#1d4ed8; --blue-bg:#e8eefc;
  --green:#15803d; --green-bg:#e6f4ea;
  --red:#b42318; --red-bg:#fbeae7;
  --amber:#8a5a00; --amber-bg:#fdf3df;
  --r:14px;
  --tab-h:66px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans Khmer','Noto Sans JP',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.45;padding-top:env(safe-area-inset-top,0px)}
body[data-lang="ja"]{font-family:'Noto Sans JP','Noto Sans Khmer',system-ui,sans-serif;font-size:16px}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:disabled{cursor:default}
input,select,textarea{font-family:inherit;font-size:18px;color:var(--text)}
.num{font-family:'Noto Sans JP',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.latin{font-family:'Noto Sans JP',system-ui,sans-serif;letter-spacing:.02em}
[hidden]{display:none !important}

/* ── 試作用の帯 ── */
.mock{background:#fff7e0;border-bottom:1px dashed var(--amber);color:var(--amber);font-family:'Noto Sans JP',sans-serif;font-size:12px;font-weight:600;padding:6px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mock b{margin-right:auto}
.mock button{font-size:11px;border:1px solid var(--amber);background:#fff;color:var(--amber);border-radius:6px;padding:3px 8px}
.mock button.on{background:var(--amber);color:#fff}

/* ── ヘッダー ── */
.head{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px;min-height:58px}
.head img{width:36px;height:36px;border-radius:9px}
.head .brand{font-family:'Noto Sans JP',sans-serif;font-size:10px;letter-spacing:.18em;font-weight:700;color:var(--gold)}
.head .ttl{font-size:17px;font-weight:700;line-height:1.25}
.head .sub{font-size:12px;color:var(--sub)}
.head .sp{flex:1;min-width:0}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;min-height:38px;display:inline-flex;align-items:center;gap:6px;background:#fff}
.pill.q{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;background:#fff;font-size:20px}
.stepdots{display:flex;gap:5px}
.stepdots i{width:10px;height:10px;border-radius:50%;background:#d3d9e2}
.stepdots i.done{background:var(--green)} .stepdots i.now{background:var(--blue);transform:scale(1.25)}

main{max-width:520px;width:100%;min-width:0;margin:0 auto;padding:12px 12px calc(var(--tab-h) + 20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
main.flow{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}

/* ── 共通部品 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.band{background:var(--band);padding:9px 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.band .r{margin-left:auto;font-weight:700;color:var(--sub);font-size:13px}
.body{padding:14px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.body>*,.row2>*,.row3>*,.cam>*,.svc>*,.acts>*{min-width:0}
.note{font-size:13px;color:var(--sub);line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--band);color:var(--text);white-space:nowrap;font-family:'Noto Sans JP',sans-serif}
.chip.menu{background:var(--blue-bg);color:var(--blue)}
.chip.demo{background:var(--gold-bg);color:var(--gold)}
.chip.ok{background:var(--green-bg);color:var(--green)}
.chip.warn{background:var(--amber-bg);color:var(--amber)}
.chip.shop{background:#eee9f8;color:#5b3fa6}
.chips{display:flex;flex-wrap:wrap;gap:5px}

.btn{width:100%;min-height:64px;border-radius:14px;padding:10px 16px;font-size:19px;font-weight:700;color:#fff;background:var(--blue);display:grid;place-items:center;gap:0;line-height:1.25;transition:transform .1s,filter .1s}
.btn small{font-size:12px;font-weight:600;opacity:.9}
.btn:active{transform:scale(.985);filter:brightness(.93)}
.btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.gold{background:var(--gold)}
.btn.ghost{background:#fff;color:var(--text);border:2px solid var(--line)}
.btn.sm{min-height:50px;font-size:16px;border-radius:12px}
.btn:disabled{background:#b9c0ca;color:#fff;border-color:#b9c0ca}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* 選択ボタン（大きい・絵つき） */
.opt{position:relative;border:2px solid var(--line);border-radius:14px;background:#fff;min-height:64px;padding:10px 12px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;font-weight:700;font-size:17px;line-height:1.25}
.opt .ic{font-size:26px;width:36px;text-align:center;flex:none}
.opt small{display:block;font-size:12px;font-weight:500;color:var(--sub)}
.opt.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
.opt.on.g{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.opt.on.r{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.opt.on.gold{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.opt .tick{margin-left:auto;font-size:20px}
.opt.center{justify-content:center;text-align:center;flex-direction:column;gap:4px;padding:12px 8px}
.opt.center .ic{width:auto}

/* ── 今日: 打刻ストリップ ── */
.punch{display:flex;align-items:center;gap:12px;padding:12px 14px}
.punch .clock{font-size:34px;font-weight:700;line-height:1}
.punch .st{font-size:13px;font-weight:700;margin-top:4px;display:inline-flex;gap:6px;align-items:center}
.punch .st i{width:9px;height:9px;border-radius:50%;background:#98a2b3;display:inline-block}
.punch .st.work i{background:var(--green)}
.punch button{margin-left:auto;min-height:60px;min-width:128px;border-radius:14px;color:#fff;font-weight:700;font-size:18px;padding:6px 14px;display:grid;place-items:center;line-height:1.2}
.punch button.in{background:var(--green)} .punch button.out{background:var(--red)} .punch button:disabled{background:#b9c0ca}

/* ── 今日: 次の予定（ヒーロー） ── */
.next{border:2px solid var(--blue);}
.next .body{gap:10px}
.next .when{display:flex;align-items:baseline;gap:10px}
.next .when .t{font-size:44px;font-weight:700;line-height:1}
.next .when .in{font-size:14px;color:var(--sub);font-weight:600}
.next .name{font-size:22px;font-weight:700;line-height:1.2}
.next .meta{display:grid;gap:3px;font-size:15px;color:var(--sub)}
.next .meta b{color:var(--text)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.act{border:2px solid var(--line);border-radius:12px;min-height:60px;display:grid;place-items:center;gap:1px;font-size:13px;font-weight:700;background:#fff;color:var(--text)}
.act .ic{font-size:22px;line-height:1}
.act.go{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}

/* ── 今日: タイムライン ── */
.tl{display:grid}
.tl-item{display:grid;grid-template-columns:56px 18px minmax(0,1fr);gap:0 10px;align-items:stretch;min-height:64px;text-align:left;width:100%;padding:0;background:none}
.tl-item .t{font-size:16px;font-weight:700;padding-top:12px;text-align:right}
.tl-item .ln{position:relative}
.tl-item .ln::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:#d3d9e2}
.tl-item:first-child .ln::before{top:18px} .tl-item:last-child .ln::before{bottom:calc(100% - 18px)}
.tl-item .ln i{position:absolute;left:3px;top:14px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #98a2b3}
.tl-item.now .ln i{border-color:var(--blue);background:var(--blue)}
.tl-item.done .ln i{border-color:var(--green);background:var(--green)}
.tl-item .c{border-bottom:1px solid #e7ebf1;padding:10px 4px 10px 0;display:grid;gap:3px}
.tl-item:last-child .c{border-bottom:0}
.tl-item .n{font-size:16px;font-weight:700}
.tl-item.done .n{color:var(--sub);text-decoration:line-through}
.tl-item .s{font-size:13px;color:var(--sub)}

/* ── 作業フロー ── */
.jobhead{display:grid;gap:6px;padding:12px 14px}
.jobhead .n{font-size:20px;font-weight:700}
.jobhead .g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:14px}
.jobhead .g small{display:block;font-size:11px;color:var(--sub);font-family:'Noto Sans JP',sans-serif;font-weight:600}
.jobhead .g b{font-size:15px}

/* 点検 */
.chk{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e7ebf1}
.chk:last-child{border-bottom:0}
.chk .l{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700}
.chk .l .ic{font-size:26px;width:36px;text-align:center}
.chk .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;min-width:140px}
.chk .seg button{min-height:48px;border:2px solid var(--line);border-radius:10px;font-weight:700;font-size:15px;background:#fff;color:var(--sub)}
.chk .seg button.ok.on{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.chk .seg button.ng.on{border-color:var(--red);background:var(--red-bg);color:var(--red)}

/* 傷マップ */
.dmap{position:relative;width:100%;aspect-ratio:2/1;background:#f7f9fb;border:2px dashed #b8c2cf;border-radius:12px;overflow:hidden}
.dmap svg{position:absolute;inset:0;width:100%;height:100%}
.dmap .mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);font-family:'Noto Sans JP',sans-serif}
.dmg-list{display:grid;gap:8px}
.dmg{display:grid;grid-template-columns:30px 72px minmax(0,1fr);gap:10px;align-items:center}
.dmg .no{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;display:grid;place-items:center;font-family:'Noto Sans JP',sans-serif}
.dmg .ph{position:relative;width:72px;height:54px;border-radius:8px;overflow:hidden;border:2px dashed #b8c2cf;background:#f7f9fb;display:grid;place-items:center;font-size:22px}
.dmg .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dmg .ph input{position:absolute;inset:0;opacity:0}
.dmg input.memo{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:16px}

/* ガイド撮影（1枚ずつ） */
.cam{display:grid;gap:10px}
.cam .frame{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#1a1f28;display:grid;place-items:center}
.cam .frame svg{width:72%;height:auto;color:#fff;opacity:.9}
.cam .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame .lbl{position:absolute;left:12px;bottom:10px;color:#fff;font-weight:700;font-size:20px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.cam .frame .cnt{position:absolute;right:12px;top:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;font-family:'Noto Sans JP',sans-serif}
.cam .frame .req{position:absolute;left:12px;top:10px;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;background:var(--red);color:#fff}
.cam .frame .req.opt{background:rgba(255,255,255,.85);color:var(--sub)}
.cam .shoot{position:relative;min-height:72px;border-radius:14px;background:var(--blue);color:#fff;font-size:20px;font-weight:700;display:grid;place-items:center}
.cam .shoot input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.thumbs button{flex:none;width:64px;height:48px;border-radius:8px;overflow:hidden;border:2px solid var(--line);background:#f7f9fb;position:relative;display:grid;place-items:center;font-size:11px;color:var(--sub);font-weight:700}
.thumbs button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumbs button.now{border-color:var(--blue)} .thumbs button.has{border-color:var(--green)}
.thumbs button .k{position:absolute;right:2px;bottom:1px;background:var(--green);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:grid;place-items:center}

/* 作業中 */
.timer{text-align:center;padding:14px}
.timer .v{font-size:50px;font-weight:700;color:var(--green);line-height:1.05}
.timer .l{font-size:13px;color:var(--sub)}
.svc{display:grid;gap:8px}
.svc .s{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:66px;text-align:left;width:100%;background:#fff}
.svc .s .n{font-weight:700;font-size:17px;line-height:1.2}
.svc .s .n small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.svc .s .t{font-size:18px;font-weight:700;color:var(--sub)}
.svc .s.now{border-color:var(--green);background:var(--green-bg)} .svc .s.now .t{color:var(--green)}
.svc .s.done{border-color:var(--green)} .svc .s.done .t{color:var(--green)}
.svc .s.skip{opacity:.55}

/* 締め */
.big-amt{display:flex;align-items:center;gap:8px}
.big-amt input{flex:1;width:1px;min-width:0;min-height:64px;font-size:34px;font-weight:700;text-align:right;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;font-family:'Noto Sans JP',sans-serif}
.big-amt span{font-size:30px;font-weight:700}
.done-screen{text-align:center;padding:26px 14px;display:grid;gap:10px;justify-items:center}
.done-screen .ic{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:46px;display:grid;place-items:center}
.done-screen .h{font-size:22px;font-weight:700}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:15px;text-align:left;width:100%}
.kv b{text-align:right}

/* 下の操作バー（作業中） */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(20,25,34,.07);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:520px;margin:0 auto;display:grid;gap:8px}
.bar .prog{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--sub);font-family:'Noto Sans JP',sans-serif}
.bar .prog .b{flex:1;height:6px;border-radius:3px;background:#d9dfe7;overflow:hidden}
.bar .prog .b i{display:block;height:100%;background:var(--green);transition:width .2s}
.bar .two{display:grid;grid-template-columns:auto 1fr;gap:8px}

/* ── 下タブ ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(4,1fr)}
.tab{height:var(--tab-h);display:grid;place-items:center;align-content:center;gap:2px;color:#6b7686;position:relative;font-size:12px;font-weight:700;line-height:1.15}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--blue)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
.tab .dot{position:absolute;top:9px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;font-family:'Noto Sans JP',sans-serif;padding:0 5px}

/* ── 営業 ── */
.shop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #e7ebf1}
.shop:last-child{border-bottom:0}
.shop .n{font-size:16px;font-weight:700}
.shop .d{font-size:13px;color:var(--sub)}
.shop .a{display:flex;gap:6px}
.shop .a button{min-width:48px;min-height:48px;border:2px solid var(--line);border-radius:12px;display:grid;place-items:center;font-size:20px;background:#fff}
.shop .a button.main{border-color:var(--blue);background:var(--blue-bg);font-size:14px;font-weight:700;padding:0 12px;color:var(--blue)}
.react{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.react .opt{min-height:70px}
.react .opt .code{font-family:'Noto Sans JP',sans-serif;font-size:22px;font-weight:700;width:30px}
.voice{display:flex;align-items:center;gap:10px}
.voice button{flex:none;width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;font-size:26px;display:grid;place-items:center}
.voice button.rec{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(180,35,24,.45)}50%{box-shadow:0 0 0 12px rgba(180,35,24,0)}}
.voice .v{flex:1;font-size:14px;color:var(--sub)}
.voice .v b{display:block;color:var(--text);font-size:16px}

/* ── 経費 ── */
.receipt{position:relative;aspect-ratio:16/9;border-radius:14px;border:2px dashed #b8c2cf;background:#f7f9fb;display:grid;place-items:center;align-content:center;gap:6px;color:var(--sub);font-weight:700;overflow:hidden}
.receipt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.receipt input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.receipt .ic{font-size:40px;line-height:1}
.receipt.has{border-style:solid;border-color:var(--green)}
.exp-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #e7ebf1;font-size:15px}
.exp-row:last-child{border-bottom:0}
.exp-row b{font-size:17px}

/* ── その他 ── */
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:14px;text-align:left;min-height:62px;border-bottom:1px solid #e7ebf1;background:#fff}
.lrow:last-child{border-bottom:0}
.lrow .ic{width:38px;height:38px;border-radius:10px;background:var(--band);display:grid;place-items:center;font-size:20px;flex:none}
.lrow .t{font-size:16px;font-weight:700}

var toastTimer;
function toast(msg, kind) { var el = $('toast'); el.textContent = msg; el.className = 'toast show ' + (kind || ''); clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.className = 'toast'; }, 2600); }
function itemById(id) { return S.items.filter(function (i) { return i.id === id; })[0]; }
function menuLabel(code) { return MENU[code] ? MENU[code].name : code; }
function fakePhoto(label, hue) {
  var c = document.createElement('canvas'); c.width = 480; c.height = 360; var g = c.getContext('2d');
  g.fillStyle = 'hsl(' + hue + ',30%,58%)'; g.fillRect(0, 0, 480, 360);
  g.fillStyle = 'rgba(255,255,255,.92)'; g.font = 'bold 40px sans-serif'; g.textAlign = 'center'; g.fillText(label, 240, 195);
  return c.toDataURL('image/jpeg', .7);
}
function readShrunk(file, cb) {
  var fr = new FileReader();
  fr.onload = function () {
    var im = new Image();
    im.onload = function () {
      var max = 1000, sc = Math.min(1, max / Math.max(im.width, im.height));
      var c = document.createElement('canvas'); c.width = Math.round(im.width * sc); c.height = Math.round(im.height * sc);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); cb(c.toDataURL('image/jpeg', .8));
    };
    im.onerror = function () { cb(fr.result); }; im.src = fr.result;
  };
  fr.readAsDataURL(file);
}

function shotsFor(job, phase) {
  var s = [
    { id: phase + '_F', g: 'front', tk: 'side_front', req: true },
    { id: phase + '_B', g: 'rear',  tk: 'side_rear',  req: true },
    { id: phase + '_L', g: 'left',  tk: 'side_left',  req: true },
    { id: phase + '_R', g: 'right', tk: 'side_right', req: true }
  ];
  if (job.menu.some(function (c) { return c.indexOf('GLASS') === 0; })) s.push({ id: phase + '_G', g: 'glass', tk: 'part_windshield', req: true });
  if (job.menu.indexOf('HEADLIGHT') >= 0) { s.push({ id: phase + '_HL', g: 'hlL', tk: 'part_hl_left', req: true }); s.push({ id: phase + '_HR', g: 'hlR', tk: 'part_hl_right', req: true }); }
  if (phase === 'before') { s.push({ id: 'before_IF', g: 'seatF', tk: 'part_seat_front', req: false }); s.push({ id: 'before_IR', g: 'seatR', tk: 'part_seat_rear', req: false }); }
  return s;
}

function openItem(id) {
  var i = itemById(id);
  if (i.status === 'done') { toast('✅ ' + t('jobs_done')); return; }
  if (i.kind === 'visit') { S.cur = { shopId: i.shopId, itemId: i.id, react: '', demo: '', voice: 0 }; S.view = 'visit'; render(); return; }
  S.cur = { job: i, step: 'check', checks: {}, dmg: [], photos: {}, shotIdx: 0, svc: {}, active: null, startAt: null, endAt: null, pay: i.kind === 'demo' ? 'free' : '', amount: i.kind === 'demo' ? 0 : priceOf(i), src: i.src || '', linked: !!i.chatId };
  i.menu.forEach(function (c) { S.cur.svc[c] = { sec: 0, done: false, skip: false }; });
  S.view = 'job'; render(); window.scrollTo(0, 0);

    html += '<div class="card"><div class="band">💰 ' + t('pay_title') + '</div><div class="body">' +
      '<div class="big-amt"><input type="number" inputmode="decimal" id="amt" value="' + c.amount + '"><span>$</span></div>' +
      '<div class="row2">' + [['cash', '💵', 'pay_cash', 'g'], ['aba', '📱', 'pay_aba', 'g'], ['shop', '🏪', 'pay_shop', 'gold'], ['free', '🎁', 'pay_free', 'gold'], ['later', '⏳', 'pay_later', 'r']].map(function (p) {
        return '<button type="button" class="opt ' + (c.pay === p[0] ? 'on ' + p[3] : '') + '" data-pay="' + p[0] + '"><span class="ic">' + p[1] + '</span><span class="latin">' + t(p[2]) + '</span>' + (c.pay === p[0] ? '<span class="tick">✓</span>' : '') + '</button>';

function bindJob() {
  var c = S.cur;
  document.querySelectorAll('[data-chk]').forEach(function (b) { b.onclick = function () { c.checks[b.getAttribute('data-chk')] = b.getAttribute('data-v'); renderJob(); }; });
  var dm = $('dmap'); if (dm) dm.onclick = function (e) {
    var r = dm.getBoundingClientRect(); var x = Math.round((e.clientX - r.left) / r.width * 100), y = Math.round((e.clientY - r.top) / r.height * 100);
    if (x < 8 || x > 92 || y < 8 || y > 92) return; c.dmg.push({ x: x, y: y, img: '', memo: '' }); renderJob();
  };
  document.querySelectorAll('[data-dmgph]').forEach(function (inp) { inp.onchange = function () { if (!inp.files[0]) return; readShrunk(inp.files[0], function (u) { c.dmg[+inp.getAttribute('data-dmgph')].img = u; renderJob(); }); }; });
  document.querySelectorAll('[data-dmgmemo]').forEach(function (inp) { inp.oninput = function () { c.dmg[+inp.getAttribute('data-dmgmemo')].memo = inp.value; }; });
  var dn = $('dmgNone'); if (dn) dn.onclick = function () { if (!c.dmg.length) { c.noDamage = true; toast('✓ ' + t('damage_none'), 'ok'); goStep('before'); } else toast('👆 ' + t('damage_tap')); };

  var sh = $('shoot'); if (sh) sh.onchange = function () { if (!sh.files[0]) return; var shots = shotsFor(c.job, c.step); readShrunk(sh.files[0], function (u) { c.photos[shots[c.shotIdx].id] = u; renderJob(); }); };
  var rt = $('retake'); if (rt) rt.onclick = function () { var shots = shotsFor(c.job, c.step); delete c.photos[shots[c.shotIdx].id]; renderJob(); };
  var ok = $('okNext'); if (ok) ok.onclick = function () { advanceShot(); };
  var sk = $('skipShot'); if (sk) sk.onclick = function () { advanceShot(); };
  document.querySelectorAll('[data-shot]').forEach(function (b) { b.onclick = function () { c.shotIdx = +b.getAttribute('data-shot'); renderJob(); }; });

  document.querySelectorAll('[data-svc]').forEach(function (b) { b.onclick = function () {
    var k = b.getAttribute('data-svc');
    if (c.active === k) { c.svc[k].done = true; c.active = null; }   // もう一度押す = このサービス完了
    else { if (c.active) c.svc[c.active].done = true; c.active = k; c.svc[k].done = false; }
    renderJob();
  }; });
  var as = $('addSvc'); if (as) as.onclick = function () {
    var cands = Object.keys(MENU).filter(function (k) { return !c.svc[k] && k !== 'GLASS_ALL'; });
    if (!cands.length) return; var k = cands[0]; c.svc[k] = { sec: 0, done: false, skip: false }; c.job.menu.push(k); toast('＋ ' + menuLabel(k)); renderJob();
  };
  document.querySelectorAll('[data-tog]').forEach(function (b) { b.onclick = function () { var k = b.getAttribute('data-tog'); c.svc[k].skip = !c.svc[k].skip; renderJob(); }; });
  document.querySelectorAll('[data-pay]').forEach(function (b) { b.onclick = function () { c.pay = b.getAttribute('data-pay'); if (c.pay === 'free') c.amount = 0; else if (!c.amount) c.amount = priceOf(c.job); renderJob(); }; });
  document.querySelectorAll('[data-src]').forEach(function (b) { b.onclick = function () { c.src = b.getAttribute('data-src'); renderJob(); }; });
  var am = $('amt'); if (am) am.oninput = function () { c.amount = parseFloat(am.value) || 0; };
  var lq = $('linkQr'); if (lq) lq.onclick = function () { c.linked = true; toast('📲 QR → Telegram ✓', 'ok'); renderJob(); };
  var jv = $('jobVoice'); if (jv) jv.onclick = function () { voiceDemo(jv); };

  if (c.step === 'work') {
    timerId = setInterval(function () {
      if (c.active) c.svc[c.active].sec++;
      var total = Object.keys(c.svc).reduce(function (a, k) { return a + c.svc[k].sec; }, 0);
      var tv = $('tv'); if (tv) tv.textContent = hms(total);
      if (c.active) { var el = document.querySelector('[data-tv="' + c.active + '"]'); if (el) el.textContent = '▶ ' + hms(c.svc[c.active].sec); }
    }, 1000);
  }
}

function advanceShot() {
  var c = S.cur, shots = shotsFor(c.job, c.step);
  var next = -1;
  for (var i = c.shotIdx + 1; i < shots.length; i++) { if (!c.photos[shots[i].id]) { next = i; break; } }
  if (next < 0) for (var k = 0; k < shots.length; k++) { if (shots[k].req && !c.photos[shots[k].id]) { next = k; break; } }
  if (next < 0) next = Math.min(c.shotIdx + 1, shots.length - 1);
  c.shotIdx = next; renderJob(); window.scrollTo(0, 0);
}

function goStep(s) { S.cur.step = s; S.cur.shotIdx = 0; renderJob(); window.scrollTo(0, 0); }

function renderBar() {
  var c = S.cur, bar = $('bar'), html = '', j = c.job;
  var shots, req, got;
  if (c.step === 'check') {
    var ok = Object.keys(c.checks).length === 5 && (c.dmg.length || c.noDamage);
    html = '<div class="prog"><span class="num">' + Object.keys(c.checks).length + '/5</span><span class="b"><i style="width:' + (Object.keys(c.checks).length * 20) + '%"></i></span><span>🩹 <span class="num">' + c.dmg.length + '</span></span></div>' +
      '<button type="button" class="btn" id="next" ' + (Object.keys(c.checks).length === 5 ? '' : 'disabled') + '>' + t('btn_next') + ' › <small>' + t('photo_before') + '</small></button>';
  } else if (c.step === 'before') {
    shots = shotsFor(j, 'before'); req = shots.filter(function (s) { return s.req; }); got = req.filter(function (s) { return c.photos[s.id]; }).length;
    html = '<div class="prog"><span>📷</span><span class="b"><i style="width:' + Math.round(got / req.length * 100) + '%"></i></span><span class="num">' + got + '/' + req.length + '</span></div>' +
      '<button type="button" class="btn green" id="next" ' + (got < req.length ? 'disabled' : '') + '>▶ ' + t('btn_start') + (got < req.length ? ' <small class="num">' + (req.length - got) + ' 📷</small>' : '') + '</button>';
  } else if (c.step === 'work') {
    var allDone = Object.keys(c.svc).every(function (k) { return c.svc[k].sec > 0 || c.svc[k].skip; });
    html = '<button type="button" class="btn red" id="next" ' + (allDone ? '' : 'disabled') + '>■ ' + t('btn_finish') + '</button>';
  } else if (c.step === 'after') {
    shots = shotsFor(j, 'after'); req = shots.filter(function (s) { return s.req; }); got = req.filter(function (s) { return c.photos[s.id]; }).length;
    html = '<div class="prog"><span>📷</span><span class="b"><i style="width:' + Math.round(got / req.length * 100) + '%"></i></span><span class="num">' + got + '/' + req.length + '</span></div>' +
      '<button type="button" class="btn" id="next" ' + (got < req.length ? 'disabled' : '') + '>' + t('btn_next') + ' › <small>' + t('pay_title') + '</small></button>';
  } else if (c.step === 'close') {
    html = '<button type="button" class="btn green" id="next" ' + (c.pay ? '' : 'disabled') + '>💾 ' + t('btn_save') + '</button>';
  } else {
    html = '<button type="button" class="btn" id="next">‹ ' + t('tab_today') + '</button>';
  }
  bar.innerHTML = '<div class="in">' + html + '</div>';
  bar.hidden = false;
  $('next').onclick = function () {
    if (c.step === 'check') goStep('before');
    else if (c.step === 'before') { c.startAt = new Date(); c.active = j.menu[0]; send(); goStep('work'); }
    else if (c.step === 'work') { if (c.active) { c.svc[c.active].done = true; c.active = null; } c.endAt = new Date(); goStep('after'); }
    else if (c.step === 'after') goStep('close');
    else if (c.step === 'close') { j.status = 'done'; j.paid = c.pay !== 'later' && c.pay !== 'free'; j.amount = c.amount; j.src = c.src; send(); goStep('done'); }
    else { S.view = 'home'; S.cur = null; render(); }
  };
}

  $('main').innerHTML = html;
  document.querySelectorAll('[data-more]').forEach(function (b) { b.onclick = function () { toast(t(b.getAttribute('data-more')) + '（試作では未実装）'); }; });
  document.querySelectorAll('[data-lang]').forEach(function (b) { b.onclick = function () { LANG = b.getAttribute('data-lang'); document.body.setAttribute('data-lang', LANG); render(); }; });
}

// ═══════════════════════════════════════════════════════════════
//  描画の入口
// ═══════════════════════════════════════════════════════════════
function render() {
  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.getAttribute('data-t')); });
  document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === S.tab)); });
  var inFlow = S.view === 'job' || S.view === 'visit';
  $('tabs').hidden = inFlow; $('bar').hidden = !inFlow; $('main').className = inFlow ? 'flow' : '';
  if (timerId && S.view !== 'job') { clearInterval(timerId); timerId = null; }
  renderHead();
  if (S.view === 'job') renderJob();
  else if (S.view === 'visit') renderVisit();
  else if (S.tab === 'today') renderToday();
  else if (S.tab === 'shops') renderShops();
  else if (S.tab === 'expense') renderExpense();
  else renderMore();
  $('shopDot').hidden = !S.shops.some(function (s) { return s.demo === 'today' && !s.visitedToday; });
}
document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { S.tab = b.getAttribute('data-tab'); S.view = 'home'; render(); window.scrollTo(0, 0); }; });
setInterval(function () { var c = $('clock'); if (c) c.textContent = hhmm(ppNow()); }, 1000);

// ── 試作用の帯 ──
$('mFill').onclick = function () {
  if (S.view !== 'job') { toast('予約を開いてから押してください'); return; }
  var c = S.cur;
  if (c.step === 'check') { ['engine', 'lights', 'windows', 'wipers', 'ac'].forEach(function (k) { c.checks[k] = 'ok'; }); if (!c.dmg.length) { c.dmg.push({ x: 68, y: 22, img: fakePhoto('🩹', 10), memo: 'small scratch' }); } renderJob(); return; }
  if (c.step === 'before' || c.step === 'after') { shotsFor(c.job, c.step).forEach(function (s, i) { if (s.req && !c.photos[s.id]) c.photos[s.id] = fakePhoto(t(s.tk), (i * 47) % 360); }); renderJob(); return; }
  if (c.step === 'work') { Object.keys(c.svc).forEach(function (k, i) { if (!c.svc[k].sec) c.svc[k].sec = 60 * (25 + i * 10); c.svc[k].done = true; }); c.active = null; renderJob(); return; }
};
$('mOffline').onclick = function () { S.offline = !S.offline; this.classList.toggle('on', S.offline); if (!S.offline && S.queue) { toast('📤 ' + S.queue + ' → ' + t('sent'), 'ok'); S.queue = 0; } render(); };
$('mEvening').onclick = function () { S.evening = !S.evening; this.classList.toggle('on', S.evening); render(); };
$('mReset').onclick = function () { S = freshState(); receiptImg = null; render(); window.scrollTo(0, 0); };

render();
</script>
</body>
</html>
