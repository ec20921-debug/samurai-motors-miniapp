<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAMURAI SCOUT / ហាងដៃគូ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="tg-auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root {
  --bg: #0f0f0f;
  --card: #1a1a1a;
  --border: #2a2a2a;
  --gold: #c9a84c;
  --text: #e8e8e8;
  --text-dim: #888;
  --green: #2E7D32;
  --blue: #1565C0;
  --amber: #F57C00;
  --red: #c62828;
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans Khmer','Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px 16px 40px;
}
.wrap { max-width: 480px; margin: 0 auto; }

.title {
  text-align:center;
  font-size: 18px; font-weight: 700;
  margin-bottom: 4px;
  background: linear-gradient(135deg, var(--gold), #e8d5a3);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  text-align:center; font-size: 12px; color: var(--text-dim);
  margin-bottom: 12px;
}
.who {
  text-align:center;
  font-size:13px; color: var(--text);
  padding: 0 0 12px;
}
.who strong { color: var(--gold); }

/* ── タブ切替（一覧 / 地図） ── */
.tab-row { display:flex; gap:8px; margin-bottom:12px; }
.tab-btn {
  flex:1;
  padding: 10px;
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: 10px;
  color: var(--text-dim);
  font-size: 13px; font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
.tab-btn.active { border-color: var(--gold); color: var(--gold); }

.new-btn {
  width: 100%;
  padding: 16px;
  border: none; border-radius: var(--radius);
  font-size: 16px; font-weight: 700;
  color: #1a1a1a;
  background: linear-gradient(135deg, var(--gold), #e8d5a3);
  cursor: pointer;
  font-family: inherit;
  margin-bottom: 14px;
  transition: transform 0.15s;
}
.new-btn:active { transform: scale(0.98); }

.list-label {
  font-size:11px; font-weight:600; color:var(--text-dim);
  text-transform:uppercase; letter-spacing:1px;
  padding: 4px 0 8px;
}

/* ── 店カード ── */
.shop-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.15s;
}
.shop-card:active { transform: scale(0.98); border-color: var(--gold); }
.shop-head { display:flex; align-items:center; gap:8px; }
.shop-name { flex:1; font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.shop-meta { font-size:12px; color:var(--text-dim); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.badge {
  flex-shrink:0;
  font-size:12px; font-weight:700;
  padding: 2px 10px; border-radius: 8px;
  color:#fff;
}
.badge.rA { background: var(--green); }
.badge.rB { background: var(--blue); }
.badge.rC { background: var(--amber); }
.badge.rD { background: var(--red); }
.badge.rNone { background: var(--border); color: var(--text-dim); }
.badge.partner { background: var(--gold); color: #1a1a1a; }
.empty {
  text-align:center; color:var(--text-dim); font-size:13px;
  padding: 30px 0; line-height: 1.6;
}

/* ── マップ ── */
#mapWrap { display:none; }
#map {
  width: 100%;
  height: calc(100vh - 250px);
  min-height: 320px;
  border-radius: var(--radius);
  border: 1.5px solid var(--border);
  background: var(--card);
}
.leaflet-popup-content-wrapper { background: var(--card); color: var(--text); border-radius: 10px; }
.leaflet-popup-tip { background: var(--card); }
.leaflet-popup-content { margin: 10px 14px; font-family: inherit; font-size: 13px; }
.popup-open-btn {
  display:block; width:100%;
  margin-top: 8px;
  padding: 8px;
  border:none; border-radius:8px;
  background: var(--gold); color:#1a1a1a;
  font-weight:700; font-size:13px;
  font-family: inherit;
  cursor:pointer;
}
.map-hint { font-size:11px; color:var(--text-dim); text-align:center; margin-top:8px; }

/* ── 2026-10-20 訪問支援: 検索・近い順・現在地・前回メモ ── */
.find-row { display:flex; gap:8px; margin-bottom:10px; }
.find-row input { flex:1; min-width:0; background:var(--card); border:1.5px solid var(--border); border-radius:12px;
  color:var(--text); padding:10px 12px; font-size:14px; font-family:inherit; }
.near-btn { flex:none; border:1.5px solid var(--border); background:var(--card); color:var(--text); border-radius:12px;
  padding:0 12px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; }
.near-btn.on { border-color:var(--gold); color:var(--gold); }
.shop-last { font-size:12.5px; color:#cfc6b0; margin-top:6px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden; }
.shop-last b { color:var(--gold); font-weight:700; }
.dist { flex-shrink:0; font-size:12px; font-weight:700; color:var(--gold); }
.map-tools { position:relative; }
.here-btn { position:absolute; right:10px; top:10px; z-index:500; border:none; border-radius:10px; padding:9px 12px;
  background:var(--gold); color:#1a1a1a; font-weight:700; font-size:13px; font-family:inherit; cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.4); }
.pin { width:30px; height:30px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:2px solid #fff;
  box-shadow:0 3px 8px rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; }
.pin span { transform:rotate(45deg); color:#fff; font-weight:700; font-size:13px; font-family:'Noto Sans JP',sans-serif; }
.me-dot { width:18px; height:18px; border-radius:50%; background:#2f80ff; border:3px solid #fff; box-shadow:0 0 0 6px rgba(47,128,255,.25); }
.popup-last { margin-top:6px; padding-top:6px; border-top:1px solid var(--border); font-size:12.5px; line-height:1.5; max-width:230px; }
.popup-btns { display:flex; gap:6px; }
.popup-btns .popup-open-btn { flex:1; }
.popup-open-btn.alt { background:#2a2a2a; color:var(--gold); border:1px solid var(--gold); }

/* ── 商談計算（ヒアリング） ── */
.hear-btn { display:block; width:100%; margin:0 0 14px; padding:13px; border:1.5px solid var(--gold); border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(201,168,76,.22),rgba(201,168,76,.06)); color:var(--gold); font-weight:700; font-size:15px;
  font-family:inherit; cursor:pointer; }
.hres { position:sticky; top:0; z-index:5; background:linear-gradient(160deg,#2a2412,#15130d 70%); border:1.5px solid var(--gold);
  border-radius:16px; padding:12px 14px; margin-bottom:12px; }
.hres .l { font-size:12.5px; color:#e8d5a3; font-weight:700; }
.hres .big { font-size:46px; font-weight:700; color:#fff; line-height:1.1; font-variant-numeric:tabular-nums; }
.hres .big small { font-size:16px; color:var(--gold); margin-left:4px; }
.hres .cells { display:flex; gap:6px; margin-top:8px; }
.hres .cells div { flex:1; min-width:0; background:rgba(0,0,0,.3); border-radius:10px; padding:6px 8px; }
.hres .cells span { display:block; font-size:10.5px; color:var(--text-dim); line-height:1.35; }
.hres .cells b { font-size:17px; font-variant-numeric:tabular-nums; }
.hres .n { font-size:11px; color:var(--text-dim); margin-top:6px; line-height:1.45; }
.hmode { display:flex; gap:6px; margin-bottom:12px; }
.hmode button { flex:1; padding:10px 6px; border:1.5px solid var(--border); background:var(--card); color:var(--text-dim);
  border-radius:12px; font-weight:700; font-size:13px; font-family:inherit; line-height:1.35; cursor:pointer; }
.hmode button.sel { border-color:var(--gold); color:#1a1a1a; background:var(--gold); }
.hrow { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border); }
.hrow:first-child { border-top:0; }
.hrow label { flex:1; min-width:0; font-size:13.5px; line-height:1.4; }
.hrow label small { display:block; font-size:11px; color:var(--text-dim); }
.hstep { flex:none; display:flex; align-items:center; background:#222; border:1.5px solid var(--border); border-radius:12px; overflow:hidden; }
.hstep button { width:40px; height:42px; border:0; background:none; color:var(--gold); font-size:22px; cursor:pointer; font-family:inherit; }
.hstep input { width:58px; height:42px; border:0; background:none; color:var(--text); text-align:center; font-size:20px; font-weight:700;
  font-family:inherit; -moz-appearance:textfield; }
.hstep input::-webkit-outer-spin-button,.hstep input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
.hcard { background:var(--card); border:1.5px solid var(--border); border-radius:var(--radius); padding:4px 12px; margin-bottom:12px; }
.hcard h4 { font-size:12.5px; color:var(--gold); margin:10px 0 2px; }
.hchips { display:flex; flex-wrap:wrap; gap:6px; padding:2px 0 10px; }
.hchip { border:1.5px solid var(--border); background:#222; color:var(--text); border-radius:999px; padding:5px 10px; font-size:12px;
  font-weight:700; font-family:inherit; cursor:pointer; }
.hchip.sel { border-color:var(--gold); background:rgba(201,168,76,.18); }
.hsum { display:grid; grid-template-columns:1fr auto; gap:4px 10px; padding:4px 0 10px; font-size:13px; align-items:baseline; }
.hsum b { text-align:right; font-size:16px; font-variant-numeric:tabular-nums; }
.hsum .strike { color:var(--text-dim); text-decoration:line-through; }
.hsum .hi { color:var(--gold); font-size:20px; }
.hear-item { background:var(--card); border:1.5px solid var(--border); border-radius:12px; padding:10px 12px; margin-bottom:8px; font-size:12.5px; line-height:1.55; }
.hear-item .hh { display:flex; gap:8px; align-items:baseline; }
.hear-item .hh .d { flex:1; color:var(--text-dim); }
.hear-item .hh .m { color:var(--gold); font-weight:700; font-size:16px; }
.hmode button { font-size:12px; }
.hparked { display:flex; justify-content:space-between; align-items:baseline; padding:8px 0 10px; border-top:1px solid var(--border); font-size:13px; }
.hparked b { color:var(--gold); font-size:20px; }
.hrow.off label { color:var(--text-dim); }
.hrow .offnote { flex:none; font-size:11px; color:var(--text-dim); max-width:46%; text-align:right; line-height:1.4; }
.pot { flex-shrink:0; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; border:1px solid var(--gold); color:var(--gold); }
.pot.S { background:var(--gold); color:#1a1a1a; }

/* ── 2026-10-20 一本化: 未訪問の店（白いピン）・絞り込み・フォロー ── */
.badge.unv { background:#f2f2f2; color:#333; }
.filter-row { display:flex; gap:6px; margin-bottom:10px; }
.filter-row button { flex:1; padding:8px 4px; border:1.5px solid var(--border); background:var(--card); color:var(--text-dim);
  border-radius:10px; font-size:12px; font-weight:700; font-family:inherit; cursor:pointer; line-height:1.3; }
.filter-row button.on { border-color:var(--gold); color:var(--gold); }
.pin.unv { background:#fff !important; border-color:#555; }
.pin.unv span { color:#333; font-size:11px; }
.unv-toggle { position:absolute; left:10px; bottom:24px; z-index:500; border:1.5px solid #555; border-radius:10px; padding:8px 10px;
  background:#fff; color:#222; font-weight:700; font-size:12px; font-family:inherit; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.4); }
.unv-toggle.off { background:#2a2a2a; color:#aaa; border-color:#444; }
.follow-box { background:var(--card); border:1.5px solid var(--amber); border-radius:var(--radius); padding:10px 12px; margin-bottom:12px; }
.follow-box .fh { font-size:13px; font-weight:700; color:var(--amber); margin-bottom:6px; }
.follow-item { display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--border); cursor:pointer; }
.follow-item:first-of-type { border-top:0; }
.follow-item .fb { flex-shrink:0; font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px; color:#fff; background:var(--amber); }
.follow-item .fb.late { background:var(--red); }
.follow-item .ft { flex:1; min-width:0; font-size:13px; line-height:1.45; }
.follow-item .ft b { display:block; font-size:14px; }
.follow-none { font-size:12px; color:var(--text-dim); }
.due-row { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
.due-row button { border:1.5px solid var(--border); background:#222; color:var(--text); border-radius:999px; padding:5px 11px; font-size:12px;
  font-weight:700; font-family:inherit; cursor:pointer; }
.due-row input { background:var(--card); border:1.5px solid var(--border); color:var(--text); border-radius:10px; padding:6px 8px;
  font-family:inherit; font-size:13px; color-scheme:dark; }
.vnext { font-size:12px; color:var(--amber); margin-top:4px; }
.shop-src { font-size:12px; color:var(--text-dim); margin:-4px 0 12px; line-height:1.5; }

/* ── 2026-10-20 ヒアリングメモ（何件でも） ── */
.notes-hint { font-size:12px; color:var(--text-dim); line-height:1.5; margin:-2px 0 8px; }
.tip-row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.tip-row button { border:1.5px dashed var(--border); background:transparent; color:var(--text); border-radius:999px; padding:4px 10px;
  font-size:12px; font-family:inherit; cursor:pointer; }
.note-input { width:100%; min-height:56px; background:var(--card); border:1.5px solid var(--border); border-radius:12px; color:var(--text);
  padding:10px 12px; font-size:14px; font-family:inherit; resize:vertical; margin-bottom:8px; }
.note-add-row { display:flex; gap:8px; }
.note-add-row .note-input { flex:1; margin-bottom:0; }
.note-add-btn { flex:none; border:none; border-radius:12px; padding:0 16px; background:var(--gold); color:#1a1a1a; font-weight:700;
  font-size:14px; font-family:inherit; cursor:pointer; }
.note-more { border:1.5px dashed var(--gold); background:transparent; color:var(--gold); border-radius:12px; padding:8px 12px;
  font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; width:100%; }
.note-item { background:var(--card); border:1.5px solid var(--border); border-radius:12px; padding:9px 12px; margin-top:8px; font-size:13.5px; line-height:1.55; }
.note-item .nm { font-size:11px; color:var(--text-dim); margin-bottom:2px; }

/* ── 2026-10-20 オフライン対策: 未送信の帯・前回の情報の帯 ── */
.off-bar { display:flex; align-items:center; gap:8px; background:#3a2a10; border:1.5px solid var(--amber); border-radius:12px;
  padding:8px 10px; margin-bottom:10px; font-size:12.5px; line-height:1.45; }
.off-bar span { flex:1; min-width:0; white-space:pre-line; }
.off-bar button { flex:none; border:none; border-radius:9px; padding:7px 10px; background:var(--amber); color:#1a1a1a; font-weight:700;
  font-size:12px; font-family:inherit; cursor:pointer; }
.off-bar.cache { background:#1f2733; border-color:#4a6a9a; }
.off-bar.fail { background:#3a1414; border-color:var(--red); }
.pend { font-size:10.5px; font-weight:700; color:#1a1a1a; background:var(--amber); border-radius:5px; padding:1px 6px; margin-left:6px; }
.toast { white-space:pre-line; }

/* ── フォーム共通 ── */
.back-btn {
  background:none; border:none; color:var(--text-dim);
  font-size:14px; font-family:inherit; cursor:pointer;
  padding: 4px 0 14px;
}
.form-title { font-size:16px; font-weight:700; margin-bottom:12px; }
.form-note { font-size:12px; color:var(--text-dim); margin-bottom:12px; line-height:1.5; }
.field { margin-bottom: 14px; }
.field label {
  display:block; font-size:12px; color:var(--text-dim);
  margin-bottom:6px;
}
.field label .req { color: var(--red); font-weight:700; }
.field input, .field textarea {
  width:100%;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  font-family: inherit;
  padding: 12px;
}
.field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
.field textarea { min-height: 90px; resize: vertical; }

.gps-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--text-dim);
  text-align: center;
  min-height: 38px;
}
.gps-box.ok   { color: #4caf50; }
.gps-box.warn { color: #ffc107; }
.gps-box.err  { color: #ff7043; }
.gps-box a { color: inherit; }
/* 原因の切り分け用（日本側で不具合報告を受けたときに状態が分かるように） */
.gps-diag {
  margin-top: 4px;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}
.gps-retry {
  width:100%;
  margin-top:8px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 13px; font-family: inherit;
  padding: 10px;
  cursor:pointer;
}
.gps-retry:active { border-color: var(--gold); }

/* ── 既存店サジェスト ── */
.suggest-box { margin-top:8px; }
.suggest-label { font-size:11px; color:var(--text-dim); margin-bottom:6px; }
.suggest-chip {
  display:block; width:100%;
  text-align:left;
  background: var(--card);
  border: 1.5px dashed var(--gold);
  border-radius: 10px;
  color: var(--text);
  font-size: 13px; font-family: inherit;
  padding: 10px 12px;
  margin-bottom: 6px;
  cursor: pointer;
}
.selected-shop {
  display:flex; align-items:center; gap:8px;
  background: rgba(201,168,76,0.12);
  border: 1.5px solid var(--gold);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  margin-bottom: 6px;
}
.selected-shop .name { flex:1; font-weight:700; }
.selected-shop .unselect {
  background:none; border:none; color:var(--text-dim);
  font-size:16px; cursor:pointer; font-family:inherit;
}

/* ── 反応 A-D（クメール語＋日本語併記） ── */
.react-grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
.react-btn {
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  padding: 10px 8px;
  cursor: pointer;
  text-align:left;
  transition: border-color 0.15s, background 0.15s;
  display:flex; align-items:center; gap:8px;
}
.react-btn .letter {
  flex-shrink:0;
  width:22px; height:22px; line-height:22px;
  border-radius:6px; text-align:center;
  font-weight:700; font-size:13px;
  background: var(--border); color: var(--text);
}
.react-btn .rtext { display:flex; flex-direction:column; min-width:0; }
.react-btn .rkm { font-size:12px; font-weight:600; line-height:1.3; }
.react-btn .rjp { font-size:10px; color:var(--text-dim); line-height:1.3; }
.react-btn.rA.sel { border-color: var(--green); background: rgba(46,125,50,0.18); }
.react-btn.rB.sel { border-color: var(--blue);  background: rgba(21,101,192,0.18); }
.react-btn.rC.sel { border-color: var(--amber); background: rgba(245,124,0,0.18); }
.react-btn.rD.sel { border-color: var(--red);   background: rgba(198,40,40,0.18); }
.react-btn.rA.sel .letter { background: var(--green); color:#fff; }
.react-btn.rB.sel .letter { background: var(--blue);  color:#fff; }
.react-btn.rC.sel .letter { background: var(--amber); color:#fff; }
.react-btn.rD.sel .letter { background: var(--red);   color:#fff; }

/* ── ステータス 3値（店詳細） ── */
.status-grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; }
.status-btn {
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  padding: 10px 4px;
  cursor: pointer;
  text-align:center;
}
.status-btn .skm { display:block; font-size:12px; font-weight:600; }
.status-btn .sjp { display:block; font-size:10px; color:var(--text-dim); }
.status-btn.s0.sel { border-color: var(--blue);  background: rgba(21,101,192,0.18); }
.status-btn.s1.sel { border-color: var(--gold);  background: rgba(201,168,76,0.18); }
.status-btn.s2.sel { border-color: var(--text-dim); background: rgba(136,136,136,0.15); }

/* ── コミッション ── */
.grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
.grid3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; }
.choice-btn {
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  padding: 10px 4px;
  cursor: pointer;
  text-align:center;
}
.choice-btn .ckm { display:block; font-size:12px; font-weight:600; }
.choice-btn .cjp { display:block; font-size:10px; color:var(--text-dim); }
.choice-btn.sel       { border-color: var(--gold);  background: rgba(201,168,76,0.15); }
.choice-btn.sel-green { border-color: var(--green); background: rgba(46,125,50,0.18); }
.choice-btn.sel-red   { border-color: var(--red);   background: rgba(198,40,40,0.18); }
.amount-preview { font-size:15px; font-weight:700; color:var(--gold); padding:6px 0 0; }
#cIntro { font-size:13px; font-weight:600; color:var(--text-dim); }
.unpaid-bar {
  background: rgba(198,40,40,0.10);
  border: 1.5px solid var(--red);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.6;
  margin-bottom: 8px;
}
.cm-item {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
}
.cm-item:active { border-color: var(--gold); }
.cm-head { display:flex; align-items:center; gap:8px; }
.cm-date { flex:1; font-size:12px; color:var(--text-dim); }
.cm-calc { font-size:13px; margin-top:4px; }
.cm-calc .amt { font-weight:700; color:var(--gold); }
.badge.paid   { background: var(--green); }
.badge.unpaid { background: var(--red); }
input[type="date"] { color-scheme: dark; }

.save-btn {
  width: 100%;
  padding: 16px;
  border: none; border-radius: var(--radius);
  font-size: 16px; font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #00695C, #00897B);
  cursor: pointer;
  font-family: inherit;
  margin-top: 6px;
  transition: transform 0.15s, opacity 0.2s;
}
.save-btn:active { transform: scale(0.98); }
.save-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── 店詳細: 訪問タイムライン ── */
.section-head {
  display:flex; align-items:center; justify-content:space-between;
  margin: 20px 0 8px;
}
.section-head .h {
  font-size:12px; font-weight:600; color:var(--text-dim);
  text-transform:uppercase; letter-spacing:1px;
}
.add-visit-btn {
  border: 1.5px solid var(--gold);
  background: rgba(201,168,76,0.12);
  border-radius: 10px;
  color: var(--gold);
  font-size: 12px; font-weight:700;
  font-family: inherit;
  padding: 8px 12px;
  cursor: pointer;
}
.visit-item {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
}
.visit-item:active { border-color: var(--gold); }
.visit-item .vhead { display:flex; align-items:center; gap:8px; }
.visit-item .vdate { flex:1; font-size:12px; color:var(--text-dim); }
.visit-item .vmemo {
  font-size:13px; margin-top:6px; white-space:pre-wrap; word-break:break-word;
}

.hint {
  font-size: 11px; color: var(--text-dim);
  text-align: center; margin-top: 12px; line-height: 1.5;
}
.toast {
  position: fixed; left: 50%; bottom: 30px;
  transform: translateX(-50%) translateY(100px);
  background: var(--card); color: var(--text);
  padding: 12px 20px; border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 13px; max-width: 90%;
  transition: transform 0.3s;
  z-index: 9999;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.err { border-color: var(--red); }
.toast.ok  { border-color: #00897B; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div class="title">🧭 SAMURAI SCOUT</div>
  <div class="subtitle">ហាងដៃគូ / 車屋・施設まわりのアプリ（営業ログ）</div>

  <div class="who" id="whoLine">…</div>

  <div class="off-bar hidden" id="offBar"><span id="offBarText"></span><button type="button" id="btnOffSend"></button></div>
  <div class="off-bar fail hidden" id="failBar"><span id="failBarText"></span></div>
  <div class="off-bar cache hidden" id="cacheBar"><span id="cacheBarText"></span></div>

  <!-- ═══════ ホーム（店一覧 ⇆ 地図） ═══════ -->

    <div class="tab-row">
      <button class="tab-btn active" id="tabList">📋 បញ្ជី / 一覧</button>

    <button class="new-btn" id="btnNew">➕ កត់ត្រាថ្មី / 新規訪問</button>

    <div class="find-row">
      <input type="search" id="shopSearch" autocomplete="off">
      <button type="button" class="near-btn" id="btnNear"></button>
      <button type="button" class="near-btn" id="btnPot">⭐</button>
    </div>

    <div class="follow-box hidden" id="followBox">
      <div class="fh" id="followHead"></div>
      <div id="followList"></div>
    </div>

    <div class="filter-row" id="filterRow">
      <button type="button" data-f="all" class="on"></button>
      <button type="button" data-f="visited"></button>
      <button type="button" data-f="unvisited"></button>
    </div>

    <div id="listWrap">
      <div class="list-label" id="listLabel">បញ្ជីហាង / 店一覧</div>
      <div id="listBody">
        <div class="empty" id="listEmpty">…</div>
      </div>
    </div>

    <div id="mapWrap">
      <div class="map-tools"><div id="map"></div><button type="button" class="here-btn" id="btnHere"></button><button type="button" class="unv-toggle" id="btnUnv"></button></div>
      <div class="map-hint" id="mapHint">—</div>
    </div>
  </div>

  <!-- ═══════ 店詳細（情報編集＋訪問タイムライン） ═══════ -->
  <div id="viewShop" class="hidden">
    <button class="back-btn" id="btnShopBack">← ត្រឡប់ / 戻る</button>
    <div class="form-title" id="shopTitle">ព័ត៌មានហាង / 店の情報</div>
    <div class="shop-src hidden" id="shopSrc"></div>
    <button type="button" class="hear-btn" id="btnHear"></button>

    <div class="field">
      <label>ឈ្មោះហាង / 店名 <span class="req">*</span></label>
      <input type="text" id="sShop" maxlength="100">
    </div>
    <div class="field">
      <label>ប្រភេទហាង / 業種（複数選択可）</label>
      <div class="grid2" id="sTypeGrid"></div>
    </div>
    <div class="field">
      <label>ឈ្មោះម្ចាស់ហាង / オーナー名</label>
      <input type="text" id="sOwner" maxlength="100">
    </div>
    <div class="field">
      <label>លេខទូរស័ព្ទ / 電話番号</label>
      <input type="tel" id="sPhone" maxlength="30" inputmode="tel">
    </div>
    <div class="field">
      <label>🔗 Facebook <span id="sFbLink"></span></label>
      <input type="url" id="sFb" maxlength="300" placeholder="https://facebook.com/..." inputmode="url">
    </div>
    <div class="field">
      <label>ស្ថានភាព / ステータス</label>
      <div class="status-grid" id="statusGrid">
        <button type="button" class="status-btn s0" data-s="営業中"><span class="skm">កំពុងចរចា</span><span class="sjp">営業中</span></button>
        <button type="button" class="status-btn s1" data-s="提携済"><span class="skm">ជាដៃគូ</span><span class="sjp">提携済</span></button>
        <button type="button" class="status-btn s2" data-s="見送り"><span class="skm">បោះបង់</span><span class="sjp">見送り</span></button>
      </div>
    </div>
    <div class="field">
      <label>📍 GPS</label>
      <div class="gps-box" id="shopGpsBox">—</div>
    </div>
    <div class="field">
      <label>កំណត់ចំណាំ / 店メモ</label>
      <textarea id="sMemo" maxlength="2000"></textarea>
    </div>
    <button class="save-btn" id="btnShopSave">💾 រក្សាទុក / 保存</button>

    <div class="section-head">
      <span class="h" id="notesHead"></span>
    </div>
    <div class="notes-hint" id="notesHint"></div>
    <div class="tip-row" data-tips="sNoteText"></div>
    <div class="note-add-row">
      <textarea class="note-input" id="sNoteText" maxlength="1000"></textarea>
      <button type="button" class="note-add-btn" id="btnNoteAdd"></button>
    </div>
    <div id="noteList"></div>

    <div class="section-head">
      <span class="h" id="historyHead">ប្រវត្តិការចុះជួប / 訪問履歴</span>
      <button class="add-visit-btn" id="btnAddVisit">➕ បន្ថែមការចុះជួប / 追記</button>
    </div>
    <div id="visitList"></div>

    <div class="section-head">
      <span class="h" id="hearHead"></span>
    </div>
    <div id="hearList"></div>

    <div class="section-head">
      <span class="h" id="commissionHead">💰 កម្រៃជើងសារ / コミッション</span>
      <button class="add-visit-btn" id="btnAddCommission">➕ កត់ត្រា / 記帳</button>
    </div>
    <div class="unpaid-bar hidden" id="unpaidBar"></div>
    <div id="commissionList"></div>
  </div>

  <!-- ═══════ 訪問フォーム（新規 / 追記 / 編集 共用） ═══════ -->
  <div id="viewForm" class="hidden">
    <button class="back-btn" id="btnFormBack">← ត្រឡប់ / 戻る</button>
    <div class="form-title" id="formTitle">➕ កត់ត្រាថ្មី / 新規訪問</div>
    <div class="form-note hidden" id="formNote"></div>

    <div class="field" id="gpsField">
      <label>📡 GPS</label>
      <div class="gps-box" id="gpsBox">—</div>
      <button class="gps-retry" id="btnGpsRetry" type="button">📍 យកទីតាំង / GPSを取得</button>
      <!-- 許可されていないときだけ出す。openSettings は「ユーザー操作への応答」でしか
           呼べない仕様（Bot API 8.0）のため、必ずボタン経由にする -->
      <button class="gps-retry hidden" id="btnGpsSettings" type="button">⚙️ <span id="gpsSettingsLabel"></span></button>
    </div>

    <div class="field" id="shopNameField">
      <label>ឈ្មោះហាង / 店名 <span class="req">*</span></label>
      <input type="text" id="fShop" maxlength="100" placeholder="ឧ. ABC Auto" autocomplete="off">
      <div class="suggest-box" id="suggestBox"></div>
    </div>

    <div class="field" id="typeField">
      <label>ប្រភេទហាង / 業種（複数選択可）</label>
      <div class="grid2" id="fTypeGrid"></div>
    </div>

    <div class="field" id="ownerField">
      <label>ឈ្មោះម្ចាស់ហាង / オーナー名</label>
      <input type="text" id="fOwner" maxlength="100">
    </div>

    <div class="field" id="phoneField">
      <label>លេខទូរស័ព្ទ / 電話番号</label>
      <input type="tel" id="fPhone" maxlength="30" inputmode="tel">
    </div>

    <div class="field" id="fbField">
      <label>🔗 Facebook</label>
      <input type="url" id="fFb" maxlength="300" placeholder="https://facebook.com/..." inputmode="url">
    </div>

    <div class="field">
      <label>ការឆ្លើយតប / 反応</label>
      <div class="react-grid">
        <button type="button" class="react-btn rA" data-r="A"><span class="letter">A</span><span class="rtext"><span class="rkm">កំណត់ការសាកល្បង</span><span class="rjp">デモ決定</span></span></button>
        <button type="button" class="react-btn rB" data-r="B"><span class="letter">B</span><span class="rtext"><span class="rkm">ចាប់អារម្មណ៍</span><span class="rjp">興味あり</span></span></button>
        <button type="button" class="react-btn rC" data-r="C"><span class="letter">C</span><span class="rtext"><span class="rkm">រង់ចាំសម្រេច</span><span class="rjp">保留</span></span></button>
        <button type="button" class="react-btn rD" data-r="D"><span class="letter">D</span><span class="rtext"><span class="rkm">បដិសេធ</span><span class="rjp">断り</span></span></button>
      </div>
    </div>

    <div class="field">
      <label>កំណត់ចំណាំ / メモ</label>
      <textarea id="fMemo" maxlength="2000" placeholder="អាចបំពេញពេលក្រោយបាន"></textarea>

      <label id="lblFormNotes"></label>
      <div class="notes-hint" id="formNotesHint"></div>
      <div class="tip-row" data-tips="formNotes"></div>
      <div id="formNotes"></div>
      <button type="button" class="note-more" id="btnNoteMore"></button>

    <div class="field">
      <label id="lblNext"></label>
      <input type="text" id="fNext" maxlength="300">

        <button type="button" data-due="3" id="due3"></button>
        <button type="button" data-due="7" id="due7"></button>

  <!-- ═══════ 商談計算（ヒアリング）— 2026-10-20 ═══════ -->

      <label id="hearNoteLabel"></label>
      <textarea id="hearNote" maxlength="2000"></textarea>
    </div>

    <div class="hint" id="hearHint"></div>
  </div>

    <button class="back-btn" id="btnCmBack">← ត្រឡប់ / 戻る</button>
    <div class="form-title" id="cmTitle">💰 កត់ត្រាកម្រៃជើងសារ / コミッション記帳</div>

        <button type="button" class="choice-btn col-btn" data-c="店"><span class="ckm">🏪 ហាងទទួលលុយពីភ្ញៀវ</span><span class="cjp">店が受け取った（ふつうはこれ）</span></button>
        <button type="button" class="choice-btn col-btn" data-c="当社"><span class="ckm">🏢 យើងទទួលលុយពីភ្ញៀវ</span><span class="cjp">うちが受け取った</span></button>

      <div class="amount-preview" id="cSettle"></div>
    </div>
    <div class="field">
      <label>ស្ថានភាព / 支払ステータス</label>

        <button type="button" class="choice-btn pay-btn" data-p="未払い"><span class="ckm">មិនទាន់បង់</span><span class="cjp">未払い</span></button>
        <button type="button" class="choice-btn pay-btn" data-p="支払済み"><span class="ckm">បានបង់រួច</span><span class="cjp">支払済み</span></button>
      </div>
    </div>
    <div id="payFields" class="hidden">
      <div class="field">
        <label>របៀបបង់ប្រាក់ / 支払方法</label>

          <button type="button" class="choice-btn pm-btn" data-m="ABA"><span class="ckm">ABA</span><span class="cjp">ABA</span></button>
          <button type="button" class="choice-btn pm-btn" data-m="現金"><span class="ckm">សាច់ប្រាក់</span><span class="cjp">現金</span></button>
          <button type="button" class="choice-btn pm-btn" data-m="その他"><span class="ckm">ផ្សេងៗ</span><span class="cjp">その他</span></button>
        </div>
      </div>
      <div class="field">
        <label>ថ្ងៃបង់ប្រាក់ / 支払日</label>
        <input type="date" id="cPayDate">
      </div>
    </div>
    <div class="field">
      <label>កំណត់ចំណាំ / メモ</label>
      <textarea id="cMemo" maxlength="2000"></textarea>
    </div>

    <button class="save-btn" id="btnCmSave">💾 រក្សាទុក / 保存</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
//  文言（クメール語は Panha 校閲済みテーブル準拠・日本語併記）
// ═══════════════════════════════════════════
var STR = {
  gpsGetting:  'កំពុងស្វែងរកទីតាំង… / GPS取得中…',
  gpsOk:       'ទីតាំង OK',

// v7 booking.html と同一方式: POST + text/plain。応答は text で受けて JSON.parse
// （認可切れ等の HTML 応答を切り分けるため。home-internal.html と同方式）
function api(payload) {
  payload.chatId = currentChatId;
  // 電波が弱い所で固まらないよう 20 秒で打ち切る（書き込みは clientId 付きなので、届いていても送り直しで二重にならない）
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function() { ctrl.abort(); }, 20000) : null;
  return fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload),
    signal: ctrl ? ctrl.signal : undefined
  }).then(function(r) { if (timer) clearTimeout(timer); return r.text(); })
    .then(function(txt) {
      try { return JSON.parse(txt); }
      catch (e) { return { ok: false, transient: true, error: '非JSON応答（先頭300文字）: ' + txt.substring(0, 300) }; }
    });
}

// 読み取り専用の呼び出しだけ、一時的な失敗（非JSON応答・通信エラー）を最大3回まで自動で再試行する
// （1.5s→3s）。STAFF_NOT_FOUND など業務上のエラーは再試行しない。書き込み系は二重登録を防ぐため使わない
// ※ 2026-09-29: 店一覧で GAS が Google のエラーページを返す一時失敗が発生（ChangeLog 同日）
function apiRead(payload, attempt) {
  attempt = attempt || 1;
  return api(payload)
    .catch(function() { return { ok: false, transient: true, error: STR.netError }; })
    .then(function(d) {
      // 遅延時に POST が GET に化けて ping 応答（ok:true・service あり・中身なし）が返ることがある
      // → 成功扱いにすると一覧が空で表示されるので、一時失敗として読み直す
      if (d && d.ok && d.service) d = { ok: false, transient: true, error: STR.netError };
      if (d && d.ok) return d;
      if (!d || !d.transient || attempt >= 3) return d;
      return new Promise(function(res) { setTimeout(res, attempt * 1500); })
        .then(function() { return apiRead(payload, attempt + 1); });
    });
}

// whoami を最大3回リトライ（1.5s→3s バックオフ）。
// ※ 2026-07-28: 一時的なサーバーエラーでも「スタッフ未登録」と出る誤表示の是正
//   （勤怠アプリで実発生。「未登録」は ok:true で staff なし確定のときだけ表示する）
function fetchWho(attempt) {
  return api({ action: 'whoami' })
    .then(function(d) {
      if (d && d.ok) return d;                      // 成功（staff の有無はここで確定）
      throw new Error(d && d.error ? d.error : 'SERVER_ERROR');
    })
    .catch(function(err) {
      if (attempt >= 3) throw err;
      return new Promise(function(res) { setTimeout(res, attempt * 1500); })
        .then(function() { return fetchWho(attempt + 1); });
    });
}

// ═══════════════════════════════════════════
//  オフライン対策（2026-10-20）
//  - 書き込み（訪問・メモ・商談計算）は、電波が無ければスマホの「未送信の箱」に入れ、戻ったら自動で送る
//  - 送り直しても二重にならないよう、1件ごとに clientId を付ける（GAS 側で同じ番号は1回だけ書く）
//  - 店一覧・店の画面は、最後に見た内容をスマホに残し、電波が無い時はそれを出す
//  ※ スマホの保存場所（localStorage）が使えない端末では、従来どおり「通信エラー」になるだけ
// ═══════════════════════════════════════════
var OUTBOX_KEY = 'sl_outbox_v1', FAILED_KEY = 'sl_outbox_failed_v1', SHOPS_KEY = 'sl_shops_v1', DETAIL_KEY = 'sl_detail_v1';
function lsGet(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function newClientId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function outbox() { return lsGet(OUTBOX_KEY, []); }

// 送れたら結果を返す。電波が無い・応答が壊れていたら箱に入れて { ok:true, queued:true } を返す
function sendOrQueue(payload) {
  payload.clientId = payload.clientId || newClientId();
  return api(payload)
    .catch(function() { return { ok: false, transient: true }; })
    .then(function(d) {
      if (d && d.ok) return d;
      if (!d || d.transient) {
        var box = outbox();
        box.push({ payload: payload, ts: Date.now() });
        if (!lsSet(OUTBOX_KEY, box)) return { ok: false, error: STR.netError }; // 保存できない端末
        renderOffBars();
        return { ok: true, queued: true };
      }
      return d; // 業務上のエラー（店が無い 等）はそのまま
    });
}

var flushing = false;
function flushOutbox(manual) {
  if (flushing || !GAS_URL) return Promise.resolve();
  if (!outbox().length) { if (manual) renderOffBars(); return Promise.resolve(); }
  flushing = true;
  var sent = 0;
  var step = function() {
    var cur = outbox();
    if (!cur.length) return Promise.resolve();
    var item = cur[0];
    return api(item.payload)
      .catch(function() { return { ok: false, transient: true }; })
      .then(function(d) {
        if (!d || (!d.ok && d.transient)) return; // まだ電波が無い → 次の機会に
        var rest = outbox().slice(1);
        if (!d.ok) { // サーバーが受け付けない記録は別の箱へ（消さずに残す）
          var failed = lsGet(FAILED_KEY, []);
          failed.push({ payload: item.payload, error: d.error || '', ts: Date.now() });
          lsSet(FAILED_KEY, failed);
        } else {
          sent++;
        }
        lsSet(OUTBOX_KEY, rest);
        return step();
      });
  };
  return step().then(function() {
    flushing = false;
    renderOffBars();
    if (sent) {
      toast(STR.offSent, 'ok');
      if (document.getElementById('viewHome').className === '') loadShops();
    }
  });
}

function renderOffBars() {
  var n = outbox().length, f = lsGet(FAILED_KEY, []).length;
  document.getElementById('offBar').className = 'off-bar' + (n ? '' : ' hidden');
  document.getElementById('offBarText').textContent = '📶 ' + STR.offPending.replace(/\{n\}/g, n);
  document.getElementById('failBar').className = 'off-bar fail' + (f ? '' : ' hidden');
  document.getElementById('failBarText').textContent = '⚠️ ' + STR.offFailed + ' (' + f + ')';
}

    (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ')';

function saveDetailCache(shopId, d) {
  var all = lsGet(DETAIL_KEY, {});
  all[shopId] = { at: Date.now(), d: d };
  var ids = Object.keys(all).sort(function(a, b) { return all[b].at - all[a].at; });
  ids.slice(60).forEach(function(id) { delete all[id]; });
  if (!lsSet(DETAIL_KEY, all)) { lsSet(DETAIL_KEY, {}); }
}

function loadShops() {
  var empty = document.getElementById('listEmpty');
  if (empty) empty.textContent = STR.loading;
  if (navigator.onLine === false) { // 圏外が分かっている時は、何度も読み直さず控えをすぐ出す
    var c0 = lsGet(SHOPS_KEY, null);
    if (c0 && c0.shops) {
      shopsCache = c0.shops; menuPrices = c0.prices || [];
      showCacheBar(c0.at); renderShopList(); refreshMapMarkers();
      return Promise.resolve();
    }
  }
  return apiRead({ action: 'saleslog_shops' })
    .then(function(d) {
      if (!d.ok) {
        // 電波が無い時は、最後に見た店一覧を出す
        var c = (!d || d.transient) ? lsGet(SHOPS_KEY, null) : null;
        if (c && c.shops) {
          shopsCache = c.shops; menuPrices = c.prices || [];
          showCacheBar(c.at); renderShopList(); refreshMapMarkers();
          return;
        }
        renderListError('⚠️ ' + (d.error || STR.netError));
        return;
      }
      shopsCache = d.shops || [];
      menuPrices = d.prices || [];
      lsSet(SHOPS_KEY, { at: Date.now(), shops: shopsCache, prices: menuPrices });
      showCacheBar(null);
      renderShopList();
      refreshMapMarkers();
    })
    .catch(function() { renderListError('⚠️ ' + STR.netError); });
}

// ホームの「今日やるフォロー」: 直近の訪問で決めた期日が今日以前の店（期限切れが先）
function renderFollow() {
  var box = document.getElementById('followBox');
  var today = ppTodayStr();
  var due = shopsCache.filter(function(s) { return s.nextDue && s.nextDue <= today; })
    .sort(function(a, b) { return a.nextDue.localeCompare(b.nextDue); });
  if (!shopsCache.length) { box.className = 'follow-box hidden'; return; }
  box.className = 'follow-box';
  document.getElementById('followHead').textContent = STR.followHead + (due.length ? ' · ' + due.length : '');
  var list = document.getElementById('followList');
  if (!due.length) { list.innerHTML = '<div class="follow-none">' + esc(STR.followNone) + '</div>'; return; }
  list.innerHTML = '';
  due.forEach(function(s) {
    var late = s.nextDue < today;
    var item = document.createElement('div');
    item.className = 'follow-item';
    item.innerHTML = '<span class="fb' + (late ? ' late' : '') + '">' + esc((late ? STR.overdue : STR.dueToday).split(' / ')[0]) +
      '<br>' + esc(s.nextDue.substring(5)) + '</span><div class="ft"><b>' + esc(s.shopName) + '</b>' + esc(s.nextAction || '') + '</div>';
    item.addEventListener('click', function() { openShop(s.shopId); });
    list.appendChild(item);
  });
}

function renderShopList() {
  var body = document.getElementById('listBody');
  body.innerHTML = '';
  if (!shopsCache.length) {
    renderListError(STR.emptyList);
    return;
  }
  var q = (document.getElementById('shopSearch').value || '').trim().toLowerCase();
  renderFollow();
  var rows = shopsCache.filter(function(s) {
    if (listFilter === 'visited' && isUnvisited(s)) return false;
    if (listFilter === 'unvisited' && !isUnvisited(s)) return false;
    return !q || (s.shopName + ' ' + (s.phone || '') + ' ' + (s.ownerName || '') + ' ' + (s.address || '')).toLowerCase().indexOf(q) >= 0;
  });
  if (potMode) {
    var rank = { S: 0, A: 1, B: 2, C: 3 };
    rows = rows.slice().sort(function(a, b) {
      var ra = rank[a.potential] === undefined ? 9 : rank[a.potential], rb = rank[b.potential] === undefined ? 9 : rank[b.potential];
      return ra - rb || (Number(b.potentialMine) || 0) - (Number(a.potentialMine) || 0);
    });
  } else if (nearMode && hereGps) {
    rows = rows.map(function(s) {
      return { s: s, d: (s.lat === null || s.lng === null) ? Infinity : distMeters(hereGps.lat, hereGps.lng, s.lat, s.lng) };
    }).sort(function(a, b) { return a.d - b.d; }).map(function(x) { return x.s; });
  }
  if (!rows.length) { renderListError(STR.noMatch); return; }
  rows.forEach(function(s) {
    var card = document.createElement('div');
    card.className = 'shop-card';
    var meta = [];
    meta.push('🔁 ' + s.visitCount);
    if (s.lastVisit) meta.push('📅 ' + s.lastVisit);
    if (s.phone)     meta.push('☎ ' + s.phone);
    if (s.facebook)  meta.push('🔗FB');
    if (s.lat === null || s.lng === null) meta.push(STR.noLocation);
    if (isUnvisited(s)) {
      meta = [];
      if (s.tier) meta.push('Tier ' + s.tier);
      if (s.address) meta.push(s.address);
      if (s.phone) meta.push('☎ ' + s.phone);
      if (s.lat === null || s.lng === null) meta.push(STR.noLocation);
    }
    var typesLine = (s.shopTypes && s.shopTypes.length)

// ═══════════════════════════════════════════
//  マップ（Leaflet + OpenStreetMap）
// ═══════════════════════════════════════════
// タイルは OSM 標準。ポリシー上の帰属表示必須・遮断時は下記 URL を
// Esri 等に 1 行差し替えで切替可能な設計
var TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
var TILE_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
var PP_CENTER = [11.556374, 104.928207]; // プノンペン中心

var REACTION_COLORS = { A: '#2E7D32', B: '#1565C0', C: '#F57C00', D: '#c62828' };

function ensureMap() {
  if (map) return;
  if (typeof L === 'undefined') {
    document.getElementById('mapHint').textContent = '⚠️ ' + STR.netError;
    return;
  }
  map = L.map('map', { minZoom: 11, maxZoom: 19 }).setView(PP_CENTER, 13);
  L.tileLayer(TILE_URL, { attribution: TILE_ATTR, maxZoom: 19 }).addTo(map);
  refreshMapMarkers();
}

function refreshMapMarkers() {
  if (!map) return;
  mapMarkers.forEach(function(m) { map.removeLayer(m); });
  mapMarkers = [];

  var located = shopsCache.filter(function(s) {
    return s.lat !== null && s.lng !== null && (showUnvisited || !isUnvisited(s));
  });
  document.getElementById('mapHint').textContent =
    located.length ? ('📍 ' + located.length) : STR.mapEmpty;
  if (!located.length) return;

  var bounds = [];
  located.forEach(function(s) {
    var color = s.status === '提携済' ? '#c9a84c' : (REACTION_COLORS[s.lastReaction] || '#888');
    var unv = isUnvisited(s);
    var letter = unv ? (s.tier || '○') : (s.status === '提携済' ? '★' : (s.lastReaction || '·'));
    var marker = L.marker([s.lat, s.lng], {
      icon: L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -28],
        html: '<div class="pin' + (unv ? ' unv' : '') + '" style="background:' + color + '"><span>' + esc(letter) + '</span></div>' }),
      zIndexOffset: unv ? -100 : 0
    }).addTo(map);

    var div = document.createElement('div');
    div.innerHTML =
      '<b>' + esc(s.shopName) + '</b><br>' +
      ((s.shopTypes && s.shopTypes.length) ? '🔧 ' + esc(s.shopTypes.join(' / ')) + '<br>' : '') +
      esc((s.lastReaction || '—') + ' · 🔁 ' + s.visitCount + (s.lastVisit ? ' · ' + s.lastVisit : '')) +
      (hereGps ? ' · ' + esc(fmtDist(distMeters(hereGps.lat, hereGps.lng, s.lat, s.lng))) : '') +
      (s.potential ? ' · ⭐' + esc(s.potential) + (s.potentialMine !== null ? ' (' + esc(hMoney(s.potentialMine)) + '$/月)' : '') : '') +
      (s.lastMemo ? '<div class="popup-last"><b>' + esc(STR.lastLabel) + '</b><br>' + esc(s.lastMemo) + '</div>' : '') +
      (unv ? '<div class="popup-last">' + esc(STR.unvisited) + (s.tier ? ' · Tier ' + esc(s.tier) : '') + (s.address ? '<br>' + esc(s.address) : '') + '</div>' : '') +
      (s.nextAction || s.nextDue ? '<div class="popup-last">⏰ ' + esc((s.nextDue ? s.nextDue + ' ' : '') + (s.nextAction || '')) + '</div>' : '');
    var btns = document.createElement('div');
    btns.className = 'popup-btns';
    var btn = document.createElement('button');
    btn.className = 'popup-open-btn';
    btn.textContent = STR.open;
    btn.addEventListener('click', function() { openShop(s.shopId); });
    var btn2 = document.createElement('button');
    btn2.className = 'popup-open-btn alt';
    btn2.textContent = '🧮';
    btn2.setAttribute('aria-label', STR.hearTitle);
    btn2.addEventListener('click', function() { openShop(s.shopId, true); });
    btns.appendChild(btn); btns.appendChild(btn2);
    div.appendChild(btns);
    marker.bindPopup(div);

    mapMarkers.push(marker);
    bounds.push([s.lat, s.lng]);
  });
  if (hereGps) {
    map.setView([hereGps.lat, hereGps.lng], 16);   // 現場では「自分の周り」を最初に見せる
  } else if (bounds.length === 1) {
    map.setView(bounds[0], 15);
  } else {
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
  }
}

// ── 現在地（一覧の近い順・地図の青い点）。訪問フォームの GPS 表示には触らない ──
function fmtDist(m) {
  if (!isFinite(m)) return '';
  return m < 1000 ? Math.round(m / 10) * 10 + 'm' : (m / 1000).toFixed(1) + 'km';
}
function locateHere(cb) {
  var done = false;
  var finish = function(lat, lng) {
    if (done) return; done = true;
    hereGps = { lat: Number(lat.toFixed(6)), lng: Number(lng.toFixed(6)) };
    showMeOnMap();
    cb(true);
  };
  var fallback = function() {
    if (done) return;
    if (!navigator.geolocation) { done = true; cb(false); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos) { finish(pos.coords.latitude, pos.coords.longitude); },
      function() { if (!done) { done = true; cb(false); } },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  };
  var lm = locationManager();
  if (lm && lm.isInited && lm.isLocationAvailable) {
    var t = setTimeout(fallback, 10000);
    try {
      lm.getLocation(function(data) {
        clearTimeout(t);
        if (data && typeof data.latitude === 'number') finish(data.latitude, data.longitude);
        else fallback();
      });
    } catch (e) { clearTimeout(t); fallback(); }
  } else {
    fallback();
  }
}
function showMeOnMap() {
  if (!map || !hereGps) return;
  if (meMarker) map.removeLayer(meMarker);
  meMarker = L.marker([hereGps.lat, hereGps.lng], {
    icon: L.divIcon({ className: '', iconSize: [18, 18], iconAnchor: [9, 9], html: '<div class="me-dot"></div>' }),
    zIndexOffset: 1000, interactive: false
  }).addTo(map);
}
function hereThen(after) {
  toast(STR.gpsGetting);
  locateHere(function(ok) {
    if (!ok) { toast('⚠️ ' + STR.hereFail, 'err'); return; }
    after();
  });
}

function switchTab(tab) {
  var isMap = tab === 'map';
  document.getElementById('tabList').className = 'tab-btn' + (isMap ? '' : ' active');
  document.getElementById('tabMap').className  = 'tab-btn' + (isMap ? ' active' : '');
  document.getElementById('listWrap').style.display = isMap ? 'none' : '';
  document.getElementById('mapWrap').style.display  = isMap ? 'block' : 'none';
  // 地図では「今日のフォロー」と一覧の絞り込みを隠して地図を広く（フォローは一覧タブで見る）
  document.getElementById('filterRow').style.display = isMap ? 'none' : '';
  document.getElementById('followBox').style.display = isMap ? 'none' : '';
  if (isMap) {
    ensureMap();
    if (map) setTimeout(function() { map.invalidateSize(); }, 100);
    if (!hereGps) locateHere(function(ok) { if (ok && map) { map.setView([hereGps.lat, hereGps.lng], 16); renderShopList(); } });
  }
}

// プノンペン時間の今日 (yyyy-MM-dd)
function ppTodayStr() {
  var now = new Date();
  var pp = new Date(now.getTime() + (7 * 60 + now.getTimezoneOffset()) * 60000);
  return pp.getFullYear() + '-' + String(pp.getMonth() + 1).padStart(2, '0') + '-' +
         String(pp.getDate()).padStart(2, '0');
}

function openShop(shopId, toHearing) {
  showView('shop');
  document.getElementById('visitList').innerHTML = '<div class="empty">' + esc(STR.loading) + '</div>';
  document.getElementById('commissionList').innerHTML = '<div class="empty">' + esc(STR.loading) + '</div>';
  document.getElementById('unpaidBar').className = 'unpaid-bar hidden';
  apiRead({ action: 'saleslog_shop_detail', shopId: shopId })
    .then(function(d) {
      if (!d.ok) {
        var c = (!d || d.transient) ? loadDetailCache(shopId) : null;
        if (!c) { toast('⚠️ ' + (d.error || STR.netError), 'err'); showView('home'); return; }
        d = c.d; showCacheBar(c.at);
      } else {
        saveDetailCache(shopId, d);
        showCacheBar(null);
      }
      currentShop = d.shop;
      currentVisits = d.visits || [];
      currentHearings = d.hearings || [];
      currentNotes = d.notes || [];
      renderShopDetail();
      renderHearings();
      renderNotes();
      loadCommissions(shopId);
      if (toHearing) openHearing();
    })
    .catch(function() { toast('⚠️ ' + STR.netError, 'err'); showView('home'); });
}

var commissionCache = [];
var cmMode = 'new';
var cmEditingId = null;
var cmEditingEntry = null;
var cmCollector = '店'; // 集金者。既定=店集金（2026-07-26 Daisuke 裁可・店の請求に込みが基本）
var cmPayStatus = '未払い';
var cmPayMethod = '';

function loadCommissions(shopId) {
  return api({ action: 'commission_list', shopId: shopId })
    .then(function(d) {
      if (!d.ok) {
        document.getElementById('commissionList').innerHTML =
          '<div class="empty">⚠️ ' + esc(d.error || STR.netError) + '</div>';

      }

      renderCommissions(d);
    })
    .catch(function() {

function renderCommissions(d) {
  var bar = document.getElementById('unpaidBar');
  var parts = [];
  if (d.unpaidToShop > 0)   parts.push('💸 ' + esc(STR.dirToShop) + ': <b>$' + d.unpaidToShop.toFixed(2) + '</b>');
  if (d.unpaidFromShop > 0) parts.push('💵 ' + esc(STR.dirFromShop) + ': <b>$' + d.unpaidFromShop.toFixed(2) + '</b>');
  if (parts.length) {
    bar.className = 'unpaid-bar';
    bar.innerHTML = '⚠️ ' + esc(STR.unpaid) + '<br>' + parts.join('<br>');
  } else {
    bar.className = 'unpaid-bar hidden';
  }

  var list = document.getElementById('commissionList');
  list.innerHTML = '';
  if (!commissionCache.length) {
    list.innerHTML = '<div class="empty">' + esc(STR.cmEmpty) + '</div>';
    return;
  }
  commissionCache.forEach(function(c) {
    var item = document.createElement('div');
    item.className = 'cm-item';
    var paid = c.payStatus === '支払済み';
    // 精算額の表示: 店集金→店がうちに払う分(当社受取額) / 当社集金→うちが店に払う分(コミッション額)
    var isOurs = c.collector === '当社';
    var settleIcon = isOurs ? '🏢→🏪' : '🏪→🏢';
    var settleAmt = isOurs ? c.amount : (c.ourAmount || (c.revenue - c.amount));
    item.innerHTML =
      '<div class="cm-head">' +
        '<span class="cm-date">' + esc(c.serviceDate + (c.serviceDesc ? ' · ' + c.serviceDesc : '')) + '</span>' +
        '<span class="badge ' + (paid ? 'paid' : 'unpaid') + '">' + esc(paid ? '✓' : '!') + '</span>' +
      '</div>' +
      '<div class="cm-calc">' + settleIcon + ' <span class="amt">$' + esc(settleAmt.toFixed(2)) + '</span>' +
        ' <span style="color:var(--text-dim)">($' + esc(c.revenue.toFixed(2)) + ' · ' + esc(String(c.rate)) + '%)' +
        (paid && c.payMethod ? ' ' + esc(c.payMethod) : '') + '</span>' +
      '</div>' +
      (c.memo ? '<div class="vmemo">' + esc(c.memo) + '</div>' : '');
    item.addEventListener('click', function() { openCommissionForm('edit', c); });
    list.appendChild(item);
  });
}

// 店マスターの紹介料条件（API で空欄補完済み。取れない時だけ 30%・店集金を予備値に）
function shopDefaultRate() {
  var r = currentShop ? Number(currentShop.commissionRate) : NaN;
  return (isFinite(r) && r >= 0 && r <= 100) ? r : 30;
}
function shopDefaultCollector() {
  return (currentShop && currentShop.defaultCollector === '当社') ? '当社' : '店';
}

// 紹介者報酬の行。新規=店マスターの条件（施工日が期限内のみ）/ 編集=記帳時に写し取った値
function cmIntroTerms() {
  if (cmMode === 'edit') {
    var e = cmEditingEntry;
    return (e && e.introducerName && e.introducerRate > 0) ? { name: e.introducerName, rate: e.introducerRate } : null;
  }
  var s = currentShop;
  if (!s || !s.introducerName || !(s.introducerRate > 0)) return null;
  var d = document.getElementById('cDate').value;
  if (s.introducerUntil && d && d > s.introducerUntil) return null;
  return { name: s.introducerName, rate: s.introducerRate };
}

function openCommissionForm(mode, entry) {
  cmMode = mode;
  cmEditingId = entry ? entry.commissionId : null;
  cmEditingEntry = entry || null;
  document.getElementById('cmTitle').textContent = mode === 'edit' ? STR.cmEditTitle : STR.cmNewTitle;
  document.getElementById('cmShopLine').textContent = '🏪 ' + (currentShop ? currentShop.shopName : '');
  document.getElementById('cDate').value    = entry ? entry.serviceDate : ppTodayStr();
  document.getElementById('cDesc').value    = entry ? entry.serviceDesc : '';
  document.getElementById('cRevenue').value = entry ? entry.revenue : '';
  document.getElementById('cRate').value    = entry ? entry.rate : shopDefaultRate();
  document.getElementById('cMemo').value    = entry ? entry.memo : '';
  document.getElementById('cPayDate').value = (entry && entry.payDate) ? entry.payDate : ppTodayStr();
  setCmPayStatus(entry ? entry.payStatus : '未払い');
  setCmPayMethod(entry ? entry.payMethod : '');
  setCmCollector(entry ? (entry.collector || '店') : shopDefaultCollector()); // updateCmAmount も内部で呼ばれる
  showView('commission');
}

function updateCmAmount() {
  // ⚠️ CommissionManager.gs の commissionAmountCents_ と同一ロジック（変更時は両方同期必須）
  //   先にセント整数化してから演算（0.5セント境界の浮動小数点誤差対策）
  var revenue = Number(document.getElementById('cRevenue').value);
  var rate = Number(document.getElementById('cRate').value);
  var commission = 0, our = 0;
  if (isFinite(revenue) && isFinite(rate)) {
    var rc = Math.round(revenue * 100);
    var cc = Math.round(rc * rate / 100);
    commission = cc / 100;
    our = (rc - cc) / 100;
  }
  document.getElementById('cAmount').textContent = '= $' + commission.toFixed(2);
  // 紹介者報酬（本部→紹介者。店との精算額には影響しない）
  var introEl = document.getElementById('cIntro');
  var intro = cmIntroTerms();
  if (intro) {
    var ic = isFinite(revenue) ? Math.round(Math.round(revenue * 100) * intro.rate / 100) / 100 : 0;
    introEl.textContent = '🤝 ' + STR.introLabel + ': ' + intro.name + ' ' + intro.rate + '% = $' + ic.toFixed(2) +
                          '（' + STR.introNote + '）';
    introEl.className = 'amount-preview';
  } else {
    introEl.className = 'amount-preview hidden';
  }
  // 集金者の選択に応じて「実際に動くお金」を表示
  var settle = document.getElementById('cSettle');
  if (cmCollector === '当社') {
    settle.textContent = '🏢→🏪 ' + STR.dirToShop + ': $' + commission.toFixed(2);
  } else {
    settle.textContent = '🏪→🏢 ' + STR.dirFromShop + ': $' + our.toFixed(2);
  }
}

function setCmCollector(c) {
  cmCollector = c === '当社' ? '当社' : '店';
  var btns = document.querySelectorAll('.col-btn');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    b.className = 'choice-btn col-btn' + (b.getAttribute('data-c') === cmCollector ? ' sel' : '');
  }
  updateCmAmount();
}

function setCmPayStatus(st) {
  cmPayStatus = st === '支払済み' ? '支払済み' : '未払い';
  var btns = document.querySelectorAll('.pay-btn');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    var on = b.getAttribute('data-p') === cmPayStatus;
    b.className = 'choice-btn pay-btn' + (on ? (cmPayStatus === '支払済み' ? ' sel-green' : ' sel-red') : '');
  }
  document.getElementById('payFields').className = cmPayStatus === '支払済み' ? '' : 'hidden';
  // ABA 送金がほぼ100%のため既定選択に（2026-07-25 Daisuke。変更はワンタップで可能）
  if (cmPayStatus === '支払済み' && !cmPayMethod) setCmPayMethod('ABA');
}

function setCmPayMethod(m) {
  cmPayMethod = ['現金', 'ABA', 'その他'].indexOf(m) >= 0 ? m : '';
  var btns = document.querySelectorAll('.pm-btn');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    b.className = 'choice-btn pm-btn' + (b.getAttribute('data-m') === cmPayMethod ? ' sel-green' : '');
  }
}

function saveCommission() {
  var revenue = Number(document.getElementById('cRevenue').value);
  if (!isFinite(revenue) || revenue <= 0) { toast(STR.needAmount, 'err'); return; }
  if (!currentShop) { toast('⚠️ ' + STR.netError, 'err'); return; }

  // rate はバックエンドの補正（範囲外→店の率）と同じ値を送る（プレビューと保存値のズレ防止）
  var rate = Number(document.getElementById('cRate').value);
  if (!isFinite(rate) || rate < 0 || rate > 100) rate = cmMode === 'edit' && cmEditingEntry ? cmEditingEntry.rate : shopDefaultRate();

  var payload = {
    action:      cmMode === 'edit' ? 'commission_update' : 'commission_create',
    serviceDate: document.getElementById('cDate').value,
    serviceDesc: document.getElementById('cDesc').value.trim(),
    revenue:     revenue,
    rate:        rate,
    collector:   cmCollector,
    payStatus:   cmPayStatus,
    payMethod:   cmPayMethod,
    payDate:     document.getElementById('cPayDate').value,
    memo:        document.getElementById('cMemo').value
  };
  if (cmMode === 'edit') payload.commissionId = cmEditingId;
  else payload.shopId = currentShop.shopId;

  var btn = document.getElementById('btnCmSave');
  btn.disabled = true;
  var origLabel = btn.textContent;
  btn.textContent = STR.saving;

  api(payload)
    .then(function(d) {
      btn.disabled = false;
      btn.textContent = origLabel;
      if (!d.ok) { toast('⚠️ ' + (d.error || STR.netError), 'err'); return; }
      toast(STR.cmSaved, 'ok');
      openShop(currentShop.shopId);
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = origLabel;
      toast('⚠️ ' + STR.netError, 'err');
    });
}

function renderShopDetail() {
  var s = currentShop;
  var src = document.getElementById('shopSrc');
  var srcParts = [];
  if (isUnvisited(s)) srcParts.push(STR.unvisited);
  if (s.source) srcParts.push(STR.fromList + (s.tier ? ' · Tier ' + s.tier : ''));
  if (s.address) srcParts.push(STR.address + ': ' + s.address);
  src.className = 'shop-src' + (srcParts.length ? '' : ' hidden');
  src.textContent = srcParts.join(' ／ ');
  document.getElementById('sShop').value  = s.shopName;
  document.getElementById('sOwner').value = s.ownerName;
  document.getElementById('sPhone').value = s.phone;
  document.getElementById('sFb').value    = s.facebook || '';
  // http で始まる値のみ開くリンクを出す（ページ名だけの記録も許容するため）

  var grid = document.getElementById(gridId);
  grid.innerHTML = '';

    if (known.indexOf(v) < 0) items.push({ v: v, km: v, jp: '旧ラベル' });

function clearSuggest() {
  document.getElementById('suggestBox').innerHTML = '';
}

function distMeters(lat1, lng1, lat2, lng2) {
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLng/2) * Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function updateSuggest() {
  if (formMode !== 'new') return;
  var q = document.getElementById('fShop').value.trim().toLowerCase();
  var box = document.getElementById('suggestBox');
  box.innerHTML = '';

  var hits = [];
  shopsCache.forEach(function(s) {
    var nameHit = q.length >= 2 && s.shopName.toLowerCase().indexOf(q) >= 0;
    var gpsHit = currentGps && s.lat !== null && s.lng !== null &&
                 distMeters(currentGps.lat, currentGps.lng, s.lat, s.lng) <= 200;
    if (nameHit || gpsHit) hits.push({ shop: s, gpsHit: gpsHit && !nameHit });
  });
  if (!hits.length) return;

  var label = document.createElement('div');
  label.className = 'suggest-label';
  label.textContent = STR.suggestHead;
  box.appendChild(label);

  hits.slice(0, 4).forEach(function(h) {
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'suggest-chip';
    chip.textContent = (h.gpsHit ? '📍 ' : '🏪 ') + h.shop.shopName +
      '（🔁' + h.shop.visitCount + (h.shop.lastVisit ? ' · ' + h.shop.lastVisit : '') + '）';
    chip.addEventListener('click', function() {
      openForm('append', { shopId: h.shop.shopId, shopName: h.shop.shopName });
    });
    box.appendChild(chip);
  });
}

// ═══════════════════════════════════════════
//  GPS
//  一次 = Telegram LocationManager（Bot API 8.0+）／二次 = navigator.geolocation
//
//  ※ 2026-07-28 修正: 旧実装は失敗を一律「取得不可」と出すだけで、
//    ①未許可なのか ②端末の位置情報がオフなのか ③応答が返ってこないのか を
//    切り分けられず、許可し直す導線（openSettings）も無かったため復帰不能だった。
//    あわせて init() の非同期完了を待ってから getLocation を呼んでいたため
//    「ユーザー操作の文脈」が切れ、Telegram の許可ダイアログが出ないケースがあった
//    → 起動時に init を済ませ、タップ内で同期的に getLocation できるようにした。
//    要件 v1 は LocationManager のみだったが、上記でも取れない端末の救済として
//    navigator.geolocation を保険で併用する（勤怠アプリでは従来から実績あり）。
// ═══════════════════════════════════════════
var gpsSeq = 0;           // 遅れて返ったコールバックを捨てるための世代番号
var lmEventBound = false; // locationManagerUpdated の二重登録防止

function tgWebApp() {
  return (window.Telegram && Telegram.WebApp) ? Telegram.WebApp : null;
}

// 使える LocationManager を返す（古い Telegram / 非対応クライアントでは null）
function locationManager() {
  var wa = tgWebApp();
  if (!wa || !wa.LocationManager) return null;
  if (wa.isVersionAtLeast && !wa.isVersionAtLeast('8.0')) return null;
  return wa.LocationManager;
}

// 起動時に init しておく（init は非同期。フォームを開いたタップの中で
// getLocation を同期的に呼べるようにしないと許可ダイアログが出ないことがある）
(function initLocationManagerEarly() {
  var lm = locationManager();
  if (!lm) return;
  try { if (!lm.isInited) lm.init(); } catch (e) {}

  var wa = tgWebApp();
  if (wa && wa.onEvent && !lmEventBound) {
    lmEventBound = true;
    // 設定画面で許可された直後に自動で取り直す（フォーム表示中・未取得のときだけ）
    wa.onEvent('locationManagerUpdated', function() {
      var lm2 = locationManager();
      if (!lm2 || !lm2.isAccessGranted || currentGps) return;
      if (document.getElementById('viewForm').className.indexOf('hidden') >= 0) return;
      acquireGps();
    });
  }
})();

function setGpsBox(cls, text, diag) {
  var box = document.getElementById('gpsBox');
  box.className = 'gps-box' + (cls ? ' ' + cls : '');
  box.innerHTML = esc(text) + (diag ? '<div class="gps-diag">' + esc(diag) + '</div>' : '');
}

function showGpsSettingsBtn(show) {
  document.getElementById('btnGpsSettings').className = 'gps-retry' + (show ? '' : ' hidden');
}

// 不具合報告を受けたときに原因が分かるよう、失敗時だけ状態を小さく併記する
function gpsDiag() {
  var lm = locationManager();
  if (!lm) return 'LM: n/a';
  return 'LM avail=' + (lm.isLocationAvailable ? 1 : 0) +
         ' req='      + (lm.isAccessRequested  ? 1 : 0) +
         ' grant='    + (lm.isAccessGranted    ? 1 : 0);
}

function gpsOk(lat, lng, accuracy, viaBrowser, seq) {
  if (seq !== gpsSeq) return;
  currentGps = { lat: Number(lat.toFixed(6)), lng: Number(lng.toFixed(6)) };
  var acc = Math.round(accuracy || 0);
  showGpsSettingsBtn(false);
  setGpsBox('ok', '📡 ' + STR.gpsOk + ' (' + currentGps.lat + ', ' + currentGps.lng +
                  (acc ? ' ±' + acc + 'm' : '') + ')' + (viaBrowser ? ' 🌐' : ''));
  updateSuggest(); // GPS 近接サジェストを更新
}

// 失敗表示は即座に出す（保険の端末GPSは裏で走らせ、取れたら OK 表示で上書きする）
function gpsFailUi(seq, msg, cls, offerSettings) {
  if (seq !== gpsSeq) return;
  setGpsBox(cls, '📡 ' + msg, gpsDiag());
  showGpsSettingsBtn(!!offerSettings);
}

function browserGpsFallback(seq) {
  if (!navigator.geolocation || seq !== gpsSeq) return;
  navigator.geolocation.getCurrentPosition(
    function(pos) { gpsOk(pos.coords.latitude, pos.coords.longitude, pos.coords.accuracy, true, seq); },
    function() { /* 失敗時は LocationManager 側のメッセージをそのまま残す */ },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

function acquireGps() {
  var seq = ++gpsSeq;   // 進行中の取得を無効化してから開始
  currentGps = null;
  showGpsSettingsBtn(false);
  setGpsBox('', '📡 ' + STR.gpsGetting);

  var lm = locationManager();
  if (!lm) {                       // 古い Telegram / デスクトップ等
    gpsFailUi(seq, STR.gpsOld, 'err', false);
    browserGpsFallback(seq);
    return;
  }
  if (!lm.isInited) {
    // init が返ってこないまま「取得中…」で固まらないように保険をかける
    var initTimer = setTimeout(function() {
      if (seq !== gpsSeq) return;
      gpsSeq++;                          // 遅れて来る init コールバックを無効化
      gpsFailUi(gpsSeq, STR.gpsTimeout, 'warn', false);
      browserGpsFallback(gpsSeq);
    }, 8000);
    lm.init(function() { clearTimeout(initTimer); lmGetLocation(seq); });
    return;
  }
  lmGetLocation(seq);
}

function lmGetLocation(seq) {
  if (seq !== gpsSeq) return;
  var lm = locationManager();
  if (!lm) { gpsFailUi(seq, STR.gpsOld, 'err', false); browserGpsFallback(seq); return; }

  // 端末そのものの位置情報サービスが無効（Telegram の許可では直らない）
  if (!lm.isLocationAvailable) {
    gpsFailUi(seq, STR.gpsOffDev, 'err', false);
    browserGpsFallback(seq);
    return;
  }

  // getLocation が応答を返さないまま無言で固まるのを防ぐ
  var done = false;
  var timer = setTimeout(function() {
    if (done || seq !== gpsSeq) return;
    done = true;
    gpsFailUi(seq, STR.gpsTimeout, 'warn', false);
    browserGpsFallback(seq);
  }, 12000);

  try {
    lm.getLocation(function(data) {
      if (done || seq !== gpsSeq) return;
      done = true; clearTimeout(timer);
      if (data && typeof data.latitude === 'number') {
        gpsOk(data.latitude, data.longitude, data.horizontal_accuracy, false, seq);
      } else {
        // 仕様上 null = 許可されていない。設定導線を出す（openSettings はボタン経由）
        gpsFailUi(seq, lm.isAccessGranted ? STR.gpsFail : STR.gpsDenied, 'err', !lm.isAccessGranted);
        browserGpsFallback(seq);
      }
    });
  } catch (e) {
    if (done) return;
    done = true; clearTimeout(timer);
    gpsFailUi(seq, STR.gpsFail, 'warn', false);
    browserGpsFallback(seq);
  }
}

//  訪問の保存（新規 / 追記 / 編集）
// ═══════════════════════════════════════════
function saveVisit() {
  if (!currentChatId || !GAS_URL) { toast(STR.netError, 'err'); return; }

  var payload;
  if (formMode === 'edit') {
    payload = {
      action:   'saleslog_update',
      visitId:  editingVisitId,
      reaction: selectedReaction,
      memo:     document.getElementById('fMemo').value,
      nextAction: document.getElementById('fNext').value.trim(),
      nextDue:  document.getElementById('fDue').value
    };
  } else if (formMode === 'append') {
    payload = {
      action:   'saleslog_create',
      shopId:   formShopId,
      reaction: selectedReaction,
      memo:     document.getElementById('fMemo').value,
      gps:      currentGps,
      nextAction: document.getElementById('fNext').value.trim(),
      nextDue:  document.getElementById('fDue').value,
      notes:    formNoteTexts()
    };
  } else {
    var shopName = document.getElementById('fShop').value.trim();
    if (!shopName) { toast(STR.needShop, 'err'); return; }
    payload = {
      action:    'saleslog_create',
      shopName:  shopName,
      shopTypes: typeSelections.f.slice(),
      ownerName: document.getElementById('fOwner').value.trim(),
      phone:     document.getElementById('fPhone').value.trim(),
      facebook:  document.getElementById('fFb').value.trim(),
      reaction:  selectedReaction,
      memo:      document.getElementById('fMemo').value,
      gps:       currentGps,
      nextAction: document.getElementById('fNext').value.trim(),
      nextDue:   document.getElementById('fDue').value,
      notes:     formNoteTexts()
    };
  }

  var btn = document.getElementById('btnSave');
  btn.disabled = true;
  var origLabel = btn.textContent;
  btn.textContent = STR.saving;

  sendOrQueue(payload)
    .then(function(d) {
      btn.disabled = false;
      btn.textContent = origLabel;
      if (!d.ok) { toast('⚠️ ' + (d.error || STR.netError), 'err'); return; }
      if (d.queued) {
        // 電波が無い: スマホに保存済み。新しい店はまだ一覧に無いのでホームへ、それ以外は店の画面（控え）へ
        toast('📶 ' + STR.offQueued, 'ok');
        if (formMode !== 'new' && (formShopId || currentShop)) openShop(formMode === 'append' ? formShopId : currentShop.shopId);
        else showView('home');
        return;
      }
      toast(formMode === 'edit' ? STR.updated : STR.saved, 'ok');
      var backShopId = (formMode === 'append') ? formShopId
                     : (formMode === 'edit' && currentShop) ? currentShop.shopId
                     : (d.shopId || '');
      loadShops().then(function() {
        if (formMode === 'new') {
          showView('home');
        } else if (backShopId) {
          openShop(backShopId);
        } else {
          showView('home');
        }
      });
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = origLabel;
      toast('⚠️ ' + STR.netError, 'err');
    });
}

var hIn = {
  garage: { carsDay: 5, days: 30, oneIn: 10, avg: 20 },
  dealer: { stock: 30, light: 8, heavy: 4, glass: 10, glassPrice: 0, buyers: 20, oneIn: 5, avg: 20 },
  // 施設: 件数を直接入れる（2026-10-20 Daisuke「駐車場の計算にこだわりすぎない・まずは開拓」）。
  // 初期値は小さめの施設の例。駐車場の質問は記録用（答えなくても計算できる。駐車時間を選んだ時だけ不可のサービスを外す）
  facility: { spaces: 0, occ: 50, stay: '', peak: '', visitors: 0, days: 30,
              wash: 8, glass3: 3, headlight: 3, magic: 1 }
};
// 駐車時間ごとに、その場でできるサービス（⚠️ SalesHearingManager.gs の HEARING_STAY_SERVICES と同じ）
var H_STAY_SERVICES = { '': ['WASH', 'HEADLIGHT', 'GLASS_3', 'HEADLIGHT_MAGIC'], lt1: ['WASH', 'HEADLIGHT'], '1to3': ['WASH', 'HEADLIGHT', 'GLASS_3'], gt3: ['WASH', 'HEADLIGHT', 'GLASS_3', 'HEADLIGHT_MAGIC'] };
var H_COUNT_KEYS = { WASH: 'wash', GLASS_3: 'glass3', HEADLIGHT: 'headlight', HEADLIGHT_MAGIC: 'magic' };
var H_POTENTIAL = [['S', 150], ['A', 60], ['B', 20]];                    // ⚠️ サーバーと同じしきい値
function hPotential(mine) { for (var i = 0; i < H_POTENTIAL.length; i++) if (mine >= H_POTENTIAL[i][1]) return H_POTENTIAL[i][0]; return 'C'; }
// 駐車時間を選んだら、その時間ではできないサービスの件数を 0 にする（件数の自動提案はしない）
function facilitySuggest() {
  var f = hIn.facility, allowed = H_STAY_SERVICES[f.stay] || H_STAY_SERVICES[''];
  Object.keys(H_COUNT_KEYS).forEach(function(code) { if (allowed.indexOf(code) < 0) f[H_COUNT_KEYS[code]] = 0; });
}
var H_STOCK_DISCOUNT = 30; // 在庫車は定価の30%オフ（2026-08-10 プライスリスト v2）

function priceOf(code, suv) {
  for (var i = 0; i < menuPrices.length; i++) {
    if (menuPrices[i].code === code) return suv ? menuPrices[i].suv : menuPrices[i].sedan;
  }
  return 0;
}
function hMoney(v) {
  var r = Math.round(v * 10) / 10;
  return Math.abs(r) >= 100 ? Math.round(r).toLocaleString('en-US') : (r % 1 === 0 ? String(r) : r.toFixed(1));
}
function hearingCalc_(mode, inp, rate) {
  var n = function(v, max) { var x = Number(v); return isFinite(x) && x > 0 ? Math.min(x, max) : 0; };
  var money = function(v) { return Math.round(v * 100) / 100; };
  var oneIn = Math.max(1, Math.round(n(inp.oneIn, 100)) || 1);
  var avg = n(inp.avg, 1000);
  var o = { oneIn: oneIn, avg: avg };
  if (mode === 'garage') {
    o.carsDay = n(inp.carsDay, 1000);
    o.days = Math.min(31, n(inp.days, 31));
    o.jobs = Math.round(o.carsDay * o.days / oneIn);
  } else if (mode === 'facility') {
    o.days = Math.min(31, n(inp.days, 31));
    o.spaces = Math.round(n(inp.spaces, 10000));
    o.occ = [30, 50, 80].indexOf(Number(inp.occ)) >= 0 ? Number(inp.occ) : 50;
    o.stay = H_STAY_SERVICES[inp.stay] ? inp.stay : '';
    o.parked = Math.round(o.spaces * o.occ / 100);
    var allowed = H_STAY_SERVICES[o.stay], sales = 0, jobs = 0;
    Object.keys(H_COUNT_KEYS).forEach(function(code) {
      var k = H_COUNT_KEYS[code];
      var c = allowed.indexOf(code) >= 0 ? Math.round(n(inp[k], 10000)) : 0;
      o[k] = c; jobs += c; sales += c * priceOf(code);
    });
    o.jobs = jobs;
    o.sales = money(sales);
    o.mine = money(o.sales * rate / 100);
    o.year = money(o.mine * 12);
    o.potential = hPotential(o.mine);
    return o;
  } else {
    o.buyers = n(inp.buyers, 10000);
    o.light = Math.round(n(inp.light, 5000));
    o.heavy = Math.round(n(inp.heavy, 5000));
    o.glass = Math.round(n(inp.glass, 5000));
    o.glassPrice = n(inp.glassPrice, 1000);
    o.regular = money(o.light * priceOf('HEADLIGHT') + o.heavy * priceOf('HEADLIGHT_MAGIC') + o.glass * o.glassPrice);
    o.partner = money(o.regular * (100 - H_STOCK_DISCOUNT) / 100);
    o.save = money(o.regular - o.partner);
    o.jobs = Math.round(o.buyers / oneIn);
  }
  o.sales = money(o.jobs * avg);
  o.mine = money(o.sales * rate / 100);
  o.year = money(o.mine * 12);
  o.potential = hPotential(o.mine);
  return o;
}
function hRate() { return (currentShop && Number(currentShop.commissionRate)) || 30; }

function hStep(key, val, min, max) {
  return '<div class="hstep"><button type="button" data-hs="' + key + '" data-d="-1" aria-label="−">−</button>' +
    '<input type="number" inputmode="numeric" id="h_' + key + '" data-hk="' + key + '" min="' + min + '" max="' + max + '" value="' + val + '">' +
    '<button type="button" data-hs="' + key + '" data-d="1" aria-label="+">＋</button></div>';
}
function hRow(labelKey, sub, key, val, min, max) {
  var jp = hsJp(labelKey);
  return '<div class="hrow"><label>' + esc(hsKm(labelKey)) + '<small>' + esc(jp + (jp && sub ? ' · ' : '') + (sub || '')) + '</small></label>' +
    hStep(key, val, min, max) + '</div>';
}
function hAvgChips(cur) {
  var list = [['HEADLIGHT', 'HEADLIGHT'], ['HEADLIGHT_MAGIC', 'MAGIC'], ['GLASS_3', 'GLASS 3'], ['GLASS_ALL', 'GLASS ALL']];
  var out = list.map(function(x) {
    var p = priceOf(x[0]); if (!p) return '';
    return '<button type="button" class="hchip' + (cur === p ? ' sel' : '') + '" data-avg="' + p + '">' + esc(x[1]) + ' ' + p + '$</button>';
  }).join('');
  return '<div class="hchips">' + out + '</div>';
}
