  document.getElementById('hmDealer').className = hMode === 'dealer' ? 'sel' : '';
  document.getElementById('hmFacility').className = hMode === 'facility' ? 'sel' : '';
  if (hMode === 'facility') {
    var f = hIn.facility, allowed = H_STAY_SERVICES[f.stay] || H_STAY_SERVICES[''];
    var chipSet = function(field, opts) {
      return '<div class="hchips">' + opts.map(function(o) {
        return '<button type="button" class="hchip' + (String(f[field]) === String(o[0]) ? ' sel' : '') + '" data-fac="' + field + '" data-v="' + o[0] + '">' + esc(hs(o[1])) + '</button>';
      }).join('') + '</div>';
    };
    var lbl = function(k) { var jp = hsJp(k); return '<h4>' + esc(hsKm(k)) + (jp ? ' <small style="color:var(--text-dim);font-weight:400">' + esc(jp) + '</small>' : '') + '</h4>'; };
    var svc = [['WASH', 'wash', 'SAMURAI WASH'], ['GLASS_3', 'glass3', 'SAMURAI GLASS'], ['HEADLIGHT', 'headlight', 'SAMURAI HEADLIGHT'], ['HEADLIGHT_MAGIC', 'magic', 'SAMURAI MAGIC']];
    var rows = svc.map(function(x) {
      var price = priceOf(x[0]);
      if (allowed.indexOf(x[0]) < 0) {
        return '<div class="hrow off"><label>' + esc(x[2]) + '<small>' + price + '$</small></label><span class="offnote">' + esc(hs('not_fit')) + '</span></div>';
      }
      return '<div class="hrow"><label>' + esc(x[2]) + '<small>' + price + '$ × ' + esc(hsKm('jobs_unit')) + '</small></label>' + hStep(x[1], f[x[1]], 0, 10000) + '</div>';
    }).join('');
    el.innerHTML = '<div class="hcard">' + lbl('orders_title') + rows + '</div>' +
      '<div class="hcard">' +
      hRow('spaces', HS.cars_unit[1], 'spaces', f.spaces, 0, 10000) +
      lbl('occ') + chipSet('occ', [[30, 'occ30'], [50, 'occ50'], [80, 'occ80']]) +
      lbl('stay') + chipSet('stay', [['lt1', 'stay_lt1'], ['1to3', 'stay_1to3'], ['gt3', 'stay_gt3']]) +
      lbl('peak') + chipSet('peak', [['day', 'peak_day'], ['night', 'peak_night'], ['both', 'peak_both']]) +
      hRow('visitors', '', 'visitors', f.visitors, 0, 100000) + '</div>';
    renderHearingResult();
    return;
  }
  if (hMode === 'garage') {
    el.innerHTML = '<div class="hcard">' +
      hRow('cars_day', HS.cars_unit[1], 'carsDay', g.carsDay, 0, 1000) +
      hRow('days_month', HS.days_unit[1], 'days', g.days, 1, 31) +
      hRow('take_rate', HS.one_in[1].replace('{n}', g.oneIn), 'oneIn', g.oneIn, 1, 100) +
      hRow('avg_price', '$', 'avg', g.avg, 1, 1000) + hAvgChips(g.avg) + '</div>';
  } else {
    var glassOpts = [['GLASS_3', false, 'GLASS 3 Sedan'], ['GLASS_3', true, 'GLASS 3 SUV'], ['GLASS_ALL', false, 'GLASS ALL Sedan'], ['GLASS_ALL', true, 'GLASS ALL SUV']];
    var chips = glassOpts.map(function(x) {
      var p = priceOf(x[0], x[1]); if (!p) return '';
      return '<button type="button" class="hchip' + (d.glassPrice === p ? ' sel' : '') + '" data-glass="' + p + '">' + esc(x[2]) + ' ' + p + '$</button>';
    }).join('');
    el.innerHTML = '<div class="hcard"><h4>' + esc(hs('refresh_title')) + '</h4>' +
      hRow('stock_total', HS.cars_unit[1], 'stock', d.stock, 0, 5000) +
      hRow('hl_light', 'HEADLIGHT ' + priceOf('HEADLIGHT') + '$', 'light', d.light, 0, 5000) +
      hRow('hl_heavy', 'SAMURAI MAGIC ' + priceOf('HEADLIGHT_MAGIC') + '$', 'heavy', d.heavy, 0, 5000) +
      hRow('glass_dirty', '', 'glass', d.glass, 0, 5000) +
      '<div class="hchips">' + chips + '</div><div class="hsum" id="hSum"></div></div>' +
      '<div class="hcard"><h4>' + esc(hs('referral_title')) + '</h4>' +
      hRow('buyers_month', '', 'buyers', d.buyers, 0, 10000) +
      hRow('take_rate', HS.one_in[1].replace('{n}', d.oneIn), 'oneIn', d.oneIn, 1, 100) +
      hRow('avg_price', '$', 'avg', d.avg, 1, 1000) + hAvgChips(d.avg) + '</div>';
  }
  renderHearingResult();
}
function renderHearingResult() {
  var r = hearingCalc_(hMode, hIn[hMode], hRate());
  document.getElementById('hrLab').textContent = hs('your_month');
  document.getElementById('hrBig').textContent = hMoney(r.mine);
  document.getElementById('hrUnit').textContent = HS.month_unit[0] + ' ' + HS.month_unit[1];
  var cells = hMode !== 'dealer'
    ? [['jobs_month', r.jobs + ' ' + HS.jobs_unit[0]], ['sales_month', hMoney(r.sales) + '$'], ['your_year', hMoney(r.year) + '$']]
    : [['price_partner_short', hMoney(r.partner) + '$'], ['jobs_month', r.jobs + ' ' + HS.jobs_unit[0]], ['your_year', hMoney(r.year) + '$']];
  document.getElementById('hrCells').innerHTML = cells.map(function(c) {
    return '<div><span>' + esc(HS[c[0]][0]) + '<br>' + esc(HS[c[0]][1]) + '</span><b>' + esc(c[1]) + '</b></div>';
  }).join('');
  document.getElementById('hrNote').textContent =
    HS.rate_note[0].replace('{r}', hRate()) + ' / ' + HS.rate_note[1].replace('{r}', hRate()) + ' · ' + HS.example_note[0];
  var sum = document.getElementById('hSum');
  if (sum) {
    sum.innerHTML = '<span>' + esc(hs('price_regular')) + '</span><b class="strike">' + hMoney(r.regular) + '$</b>' +
      '<span>' + esc(hs('price_partner')) + '</span><b class="hi">' + hMoney(r.partner) + '$</b>' +
      '<span>' + esc(hs('you_save')) + '</span><b>' + hMoney(r.save) + '$</b>';
  }
}
function openHearing() {
  if (!currentShop) return;
  if (!menuPrices.length) { toast('⚠️ ' + STR.priceErr, 'err'); }
  if (!hIn.dealer.glassPrice) hIn.dealer.glassPrice = priceOf('GLASS_3') || 0;
  var types = currentShop.shopTypes || [];
  var FAC_TYPES = ['レジデンス', 'ゴルフ場', 'レストラン', 'ホテル', '商業施設'];
  hMode = types.indexOf('中古車販売') >= 0 ? 'dealer'
        : types.some(function(t) { return FAC_TYPES.indexOf(t) >= 0; }) ? 'facility' : 'garage';
  document.getElementById('hearTitle').textContent = STR.hearTitle + ' — ' + currentShop.shopName;
  document.getElementById('hearNote').value = '';
  showView('hearing');
  renderHearingInputs();
}
function hSetValue(key, raw, rerender) {
  var el = document.getElementById('h_' + key);
  var v = parseFloat(raw);
  if (!isFinite(v)) return;
  v = Math.max(Number(el.min), Math.min(Number(el.max), v));
  hIn[hMode][key] = v;
  if (rerender) renderHearingInputs(); else renderHearingResult();
}
document.getElementById('hearInputs').addEventListener('click', function(e) {
  var b = e.target.closest('[data-hs]');
  if (b) {
    var key = b.getAttribute('data-hs');
    var el = document.getElementById('h_' + key);
    el.value = (parseFloat(el.value) || 0) + Number(b.getAttribute('data-d'));
    var structural = key === 'oneIn';
    hSetValue(key, el.value, structural);
    if (!structural) el.value = hIn[hMode][key];
    return;
  }
  var fc = e.target.closest('[data-fac]');
  if (fc) {
    var field = fc.getAttribute('data-fac'), val = fc.getAttribute('data-v');
    var cur = String(hIn.facility[field]);
    // 選択中のチップをもう一度押すと「未回答」に戻す（記録用の質問なので答えなくてよい）
    hIn.facility[field] = cur === val && field !== 'occ' ? '' : (field === 'occ' ? Number(val) : val);
    if (field === 'stay') facilitySuggest();
    renderHearingInputs();
    return;
  }
  var a = e.target.closest('[data-avg]');
  if (a) { hIn[hMode].avg = Number(a.getAttribute('data-avg')); renderHearingInputs(); return; }
  var gl = e.target.closest('[data-glass]');
  if (gl) { hIn.dealer.glassPrice = Number(gl.getAttribute('data-glass')); renderHearingInputs(); }
});
document.getElementById('hearInputs').addEventListener('input', function(e) {
  if (e.target.getAttribute('data-hk')) hSetValue(e.target.getAttribute('data-hk'), e.target.value, false);
});
document.getElementById('hearInputs').addEventListener('change', function(e) {
  if (e.target.getAttribute('data-hk')) hSetValue(e.target.getAttribute('data-hk'), e.target.value, true);
});

// ═══════════════════════════════════════════
//  Toast / esc
// ═══════════════════════════════════════════
var toastTimer = null;
function toast(msg, kind) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    t.className = 'toast ' + (kind || '');
  }, 3000);
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
