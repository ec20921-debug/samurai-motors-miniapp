<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>車屋提携 / ហាងដៃគូ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root {
  --bg: #0f0f0f;
  --card: #1a1a1a;
  --border: #2a2a2a;
  --gold: #c9a84c;
  --text: #e8e8e8;
  --text-dim: #888;
  --green: #2E7D32;
  --blue: #1565C0;
  --amber: #F57C00;
  --red: #c62828;
  --radius: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans Khmer','Noto Sans JP', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 20px 16px 40px;
}
.wrap { max-width: 480px; margin: 0 auto; }

.title {
  text-align:center;
  font-size: 18px; font-weight: 700;
  margin-bottom: 4px;
  background: linear-gradient(135deg, var(--gold), #e8d5a3);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle {
  text-align:center; font-size: 12px; color: var(--text-dim);
  margin-bottom: 12px;
}
.who {
  text-align:center;
  font-size:13px; color: var(--text);
  padding: 0 0 12px;
}
.who strong { color: var(--gold); }

/* ── タブ切替（一覧 / 地図） ── */
.tab-row { display:flex; gap:8px; margin-bottom:12px; }
.tab-btn {
  flex:1;
  padding: 10px;
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: 10px;
  color: var(--text-dim);
  font-size: 13px; font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
.tab-btn.active { border-color: var(--gold); color: var(--gold); }

.new-btn {
  width: 100%;
  padding: 16px;
  border: none; border-radius: var(--radius);
  font-size: 16px; font-weight: 700;
  color: #1a1a1a;
  background: linear-gradient(135deg, var(--gold), #e8d5a3);
  cursor: pointer;
  font-family: inherit;
  margin-bottom: 14px;
  transition: transform 0.15s;
}
.new-btn:active { transform: scale(0.98); }

.list-label {
  font-size:11px; font-weight:600; color:var(--text-dim);
  text-transform:uppercase; letter-spacing:1px;
  padding: 4px 0 8px;
}

/* ── 店カード ── */
.shop-card {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.15s;
}
.shop-card:active { transform: scale(0.98); border-color: var(--gold); }
.shop-head { display:flex; align-items:center; gap:8px; }
.shop-name { flex:1; font-size:15px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.shop-meta { font-size:12px; color:var(--text-dim); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.badge {
  flex-shrink:0;
  font-size:12px; font-weight:700;
  padding: 2px 10px; border-radius: 8px;
  color:#fff;
}
.badge.rA { background: var(--green); }
.badge.rB { background: var(--blue); }
.badge.rC { background: var(--amber); }
.badge.rD { background: var(--red); }
.badge.rNone { background: var(--border); color: var(--text-dim); }
.badge.partner { background: var(--gold); color: #1a1a1a; }
.empty {
  text-align:center; color:var(--text-dim); font-size:13px;
  padding: 30px 0; line-height: 1.6;
}

/* ── マップ ── */
#mapWrap { display:none; }
#map {
  width: 100%;
  height: calc(100vh - 250px);
  min-height: 320px;
  border-radius: var(--radius);
  border: 1.5px solid var(--border);
  background: var(--card);
}
.leaflet-popup-content-wrapper { background: var(--card); color: var(--text); border-radius: 10px; }
.leaflet-popup-tip { background: var(--card); }
.leaflet-popup-content { margin: 10px 14px; font-family: inherit; font-size: 13px; }
.popup-open-btn {
  display:block; width:100%;
  margin-top: 8px;
  padding: 8px;
  border:none; border-radius:8px;
  background: var(--gold); color:#1a1a1a;
  font-weight:700; font-size:13px;
  font-family: inherit;
  cursor:pointer;
}
.map-hint { font-size:11px; color:var(--text-dim); text-align:center; margin-top:8px; }

/* ── フォーム共通 ── */
.back-btn {
  background:none; border:none; color:var(--text-dim);
  font-size:14px; font-family:inherit; cursor:pointer;
  padding: 4px 0 14px;
}
.form-title { font-size:16px; font-weight:700; margin-bottom:12px; }
.form-note { font-size:12px; color:var(--text-dim); margin-bottom:12px; line-height:1.5; }
.field { margin-bottom: 14px; }
.field label {
  display:block; font-size:12px; color:var(--text-dim);
  margin-bottom:6px;
}
.field label .req { color: var(--red); font-weight:700; }
.field input, .field textarea {
  width:100%;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  font-family: inherit;
  padding: 12px;
}
.field input:focus, .field textarea:focus { outline: none; border-color: var(--gold); }
.field textarea { min-height: 90px; resize: vertical; }

.gps-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12px;
  color: var(--text-dim);
  text-align: center;
  min-height: 38px;
}
.gps-box.ok   { color: #4caf50; }
.gps-box.warn { color: #ffc107; }
.gps-box.err  { color: #ff7043; }
.gps-box a { color: inherit; }
.gps-retry {
  width:100%;
  margin-top:8px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-size: 13px; font-family: inherit;
  padding: 10px;
  cursor:pointer;
}
.gps-retry:active { border-color: var(--gold); }

/* ── 既存店サジェスト ── */
.suggest-box { margin-top:8px; }
.suggest-label { font-size:11px; color:var(--text-dim); margin-bottom:6px; }
.suggest-chip {
  display:block; width:100%;
  text-align:left;
  background: var(--card);
  border: 1.5px dashed var(--gold);
  border-radius: 10px;
  color: var(--text);
  font-size: 13px; font-family: inherit;
  padding: 10px 12px;
  margin-bottom: 6px;
  cursor: pointer;
}
.selected-shop {
  display:flex; align-items:center; gap:8px;
  background: rgba(201,168,76,0.12);
  border: 1.5px solid var(--gold);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
  margin-bottom: 6px;
}
.selected-shop .name { flex:1; font-weight:700; }
.selected-shop .unselect {
  background:none; border:none; color:var(--text-dim);
  font-size:16px; cursor:pointer; font-family:inherit;
}

/* ── 反応 A-D（クメール語＋日本語併記） ── */
.react-grid { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
.react-btn {
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  padding: 10px 8px;
  cursor: pointer;
  text-align:left;
  transition: border-color 0.15s, background 0.15s;
  display:flex; align-items:center; gap:8px;
}
.react-btn .letter {
  flex-shrink:0;
  width:22px; height:22px; line-height:22px;
  border-radius:6px; text-align:center;
  font-weight:700; font-size:13px;
  background: var(--border); color: var(--text);
}
.react-btn .rtext { display:flex; flex-direction:column; min-width:0; }
.react-btn .rkm { font-size:12px; font-weight:600; line-height:1.3; }
.react-btn .rjp { font-size:10px; color:var(--text-dim); line-height:1.3; }
.react-btn.rA.sel { border-color: var(--green); background: rgba(46,125,50,0.18); }
.react-btn.rB.sel { border-color: var(--blue);  background: rgba(21,101,192,0.18); }
.react-btn.rC.sel { border-color: var(--amber); background: rgba(245,124,0,0.18); }
.react-btn.rD.sel { border-color: var(--red);   background: rgba(198,40,40,0.18); }
.react-btn.rA.sel .letter { background: var(--green); color:#fff; }
.react-btn.rB.sel .letter { background: var(--blue);  color:#fff; }
.react-btn.rC.sel .letter { background: var(--amber); color:#fff; }
.react-btn.rD.sel .letter { background: var(--red);   color:#fff; }

/* ── ステータス 3値（店詳細） ── */
.status-grid { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; }
.status-btn {
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  padding: 10px 4px;
  cursor: pointer;
  text-align:center;
}
.status-btn .skm { display:block; font-size:12px; font-weight:600; }
.status-btn .sjp { display:block; font-size:10px; color:var(--text-dim); }
.status-btn.s0.sel { border-color: var(--blue);  background: rgba(21,101,192,0.18); }
.status-btn.s1.sel { border-color: var(--gold);  background: rgba(201,168,76,0.18); }
.status-btn.s2.sel { border-color: var(--text-dim); background: rgba(136,136,136,0.15); }

/* ── コミッション ── */
.grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
.grid3 { display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px; }
.choice-btn {
  border: 1.5px solid var(--border);
  background: var(--card);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  padding: 10px 4px;
  cursor: pointer;
  text-align:center;
}
.choice-btn .ckm { display:block; font-size:12px; font-weight:600; }
.choice-btn .cjp { display:block; font-size:10px; color:var(--text-dim); }
.choice-btn.sel       { border-color: var(--gold);  background: rgba(201,168,76,0.15); }
.choice-btn.sel-green { border-color: var(--green); background: rgba(46,125,50,0.18); }
.choice-btn.sel-red   { border-color: var(--red);   background: rgba(198,40,40,0.18); }
.amount-preview { font-size:15px; font-weight:700; color:var(--gold); padding:6px 0 0; }
.unpaid-bar {
  background: rgba(198,40,40,0.10);
  border: 1.5px solid var(--red);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 12px;
  line-height: 1.6;
  margin-bottom: 8px;
}
.cm-item {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
}
.cm-item:active { border-color: var(--gold); }
.cm-head { display:flex; align-items:center; gap:8px; }
.cm-date { flex:1; font-size:12px; color:var(--text-dim); }
.cm-calc { font-size:13px; margin-top:4px; }
.cm-calc .amt { font-weight:700; color:var(--gold); }
.badge.paid   { background: var(--green); }
.badge.unpaid { background: var(--red); }
input[type="date"] { color-scheme: dark; }

.save-btn {
  width: 100%;
  padding: 16px;
  border: none; border-radius: var(--radius);
  font-size: 16px; font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #00695C, #00897B);
  cursor: pointer;
  font-family: inherit;
  margin-top: 6px;
  transition: transform 0.15s, opacity 0.2s;
}
.save-btn:active { transform: scale(0.98); }
.save-btn:disabled { opacity: 0.35; cursor: not-allowed; }

/* ── 店詳細: 訪問タイムライン ── */
.section-head {
  display:flex; align-items:center; justify-content:space-between;
  margin: 20px 0 8px;
}
.section-head .h {
  font-size:12px; font-weight:600; color:var(--text-dim);
  text-transform:uppercase; letter-spacing:1px;
}
.add-visit-btn {
  border: 1.5px solid var(--gold);
  background: rgba(201,168,76,0.12);
  border-radius: 10px;
  color: var(--gold);
  font-size: 12px; font-weight:700;
  font-family: inherit;
  padding: 8px 12px;
  cursor: pointer;
}
.visit-item {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 8px;
  cursor: pointer;
}
.visit-item:active { border-color: var(--gold); }
.visit-item .vhead { display:flex; align-items:center; gap:8px; }
.visit-item .vdate { flex:1; font-size:12px; color:var(--text-dim); }
.visit-item .vmemo {
  font-size:13px; margin-top:6px; white-space:pre-wrap; word-break:break-word;
}

.hint {
  font-size: 11px; color: var(--text-dim);
  text-align: center; margin-top: 12px; line-height: 1.5;
}
.toast {
  position: fixed; left: 50%; bottom: 30px;
  transform: translateX(-50%) translateY(100px);
  background: var(--card); color: var(--text);
  padding: 12px 20px; border-radius: 10px;
  border: 1px solid var(--border);
  font-size: 13px; max-width: 90%;
  transition: transform 0.3s;
  z-index: 9999;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.err { border-color: var(--red); }
.toast.ok  { border-color: #00897B; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">

  <div class="title">🤝 ហាងដៃគូ</div>
  <div class="subtitle">車屋提携 営業ログ / Partner Shop Visit Log</div>

  <div class="who" id="whoLine">…</div>

  <!-- ═══════ ホーム（店一覧 ⇆ 地図） ═══════ -->
  <div id="viewHome">
    <div class="tab-row">
      <button class="tab-btn active" id="tabList">📋 បញ្ជី / 一覧</button>
      <button class="tab-btn" id="tabMap">🗺 ផែនទី / 地図</button>
    </div>

    <button class="new-btn" id="btnNew">➕ កត់ត្រាថ្មី / 新規訪問</button>

    <div id="listWrap">
      <div class="list-label" id="listLabel">បញ្ជីហាង / 店一覧</div>
      <div id="listBody">
        <div class="empty" id="listEmpty">…</div>
      </div>
    </div>

    <div id="mapWrap">
      <div id="map"></div>
      <div class="map-hint" id="mapHint">—</div>
    </div>
  </div>

  <!-- ═══════ 店詳細（情報編集＋訪問タイムライン） ═══════ -->
  <div id="viewShop" class="hidden">
    <button class="back-btn" id="btnShopBack">← ត្រឡប់ / 戻る</button>
    <div class="form-title" id="shopTitle">ព័ត៌មានហាង / 店の情報</div>

    <div class="field">
      <label>ឈ្មោះហាង / 店名 <span class="req">*</span></label>
      <input type="text" id="sShop" maxlength="100">
    </div>
    <div class="field">
      <label>ប្រភេទហាង / 業種（複数選択可）</label>
      <div class="grid2" id="sTypeGrid"></div>
    </div>
    <div class="field">
      <label>ឈ្មោះម្ចាស់ហាង / オーナー名</label>
      <input type="text" id="sOwner" maxlength="100">
    </div>
    <div class="field">
      <label>លេខទូរស័ព្ទ / 電話番号</label>
      <input type="tel" id="sPhone" maxlength="30" inputmode="tel">
    </div>
    <div class="field">
      <label>ស្ថានភាព / ステータス</label>
      <div class="status-grid" id="statusGrid">
        <button type="button" class="status-btn s0" data-s="営業中"><span class="skm">កំពុងចរចា</span><span class="sjp">営業中</span></button>
        <button type="button" class="status-btn s1" data-s="提携済"><span class="skm">ជាដៃគូ</span><span class="sjp">提携済</span></button>
        <button type="button" class="status-btn s2" data-s="見送り"><span class="skm">បោះបង់</span><span class="sjp">見送り</span></button>
      </div>
    </div>
    <div class="field">
      <label>📍 GPS</label>
      <div class="gps-box" id="shopGpsBox">—</div>
    </div>
    <div class="field">
      <label>កំណត់ចំណាំ / 店メモ</label>
      <textarea id="sMemo" maxlength="2000"></textarea>
    </div>
    <button class="save-btn" id="btnShopSave">💾 រក្សាទុក / 保存</button>

    <div class="section-head">
      <span class="h" id="historyHead">ប្រវត្តិការចុះជួប / 訪問履歴</span>
      <button class="add-visit-btn" id="btnAddVisit">➕ បន្ថែមការចុះជួប / 追記</button>
    </div>
    <div id="visitList"></div>

    <div class="section-head">
      <span class="h" id="commissionHead">💰 កម្រៃជើងសារ / コミッション</span>
      <button class="add-visit-btn" id="btnAddCommission">➕ កត់ត្រា / 記帳</button>
    </div>
    <div class="unpaid-bar hidden" id="unpaidBar"></div>
    <div id="commissionList"></div>
  </div>

  <!-- ═══════ 訪問フォーム（新規 / 追記 / 編集 共用） ═══════ -->
  <div id="viewForm" class="hidden">
    <button class="back-btn" id="btnFormBack">← ត្រឡប់ / 戻る</button>
    <div class="form-title" id="formTitle">➕ កត់ត្រាថ្មី / 新規訪問</div>
    <div class="form-note hidden" id="formNote"></div>

    <div class="field" id="gpsField">
      <label>📡 GPS</label>
      <div class="gps-box" id="gpsBox">—</div>
      <button class="gps-retry" id="btnGpsRetry" type="button">📍 យកទីតាំង / GPSを取得</button>
    </div>

    <div class="field" id="shopNameField">
      <label>ឈ្មោះហាង / 店名 <span class="req">*</span></label>
      <input type="text" id="fShop" maxlength="100" placeholder="ឧ. ABC Auto" autocomplete="off">
      <div class="suggest-box" id="suggestBox"></div>
    </div>

    <div class="field" id="typeField">
      <label>ប្រភេទហាង / 業種（複数選択可）</label>
      <div class="grid2" id="fTypeGrid"></div>
    </div>

    <div class="field" id="ownerField">
      <label>ឈ្មោះម្ចាស់ហាង / オーナー名</label>
      <input type="text" id="fOwner" maxlength="100">
    </div>

    <div class="field" id="phoneField">
      <label>លេខទូរស័ព្ទ / 電話番号</label>
      <input type="tel" id="fPhone" maxlength="30" inputmode="tel">
    </div>

    <div class="field">
      <label>ការឆ្លើយតប / 反応</label>
      <div class="react-grid">
        <button type="button" class="react-btn rA" data-r="A"><span class="letter">A</span><span class="rtext"><span class="rkm">កំណត់ការសាកល្បង</span><span class="rjp">デモ決定</span></span></button>
        <button type="button" class="react-btn rB" data-r="B"><span class="letter">B</span><span class="rtext"><span class="rkm">ចាប់អារម្មណ៍</span><span class="rjp">興味あり</span></span></button>
        <button type="button" class="react-btn rC" data-r="C"><span class="letter">C</span><span class="rtext"><span class="rkm">រង់ចាំសម្រេច</span><span class="rjp">保留</span></span></button>
        <button type="button" class="react-btn rD" data-r="D"><span class="letter">D</span><span class="rtext"><span class="rkm">បដិសេធ</span><span class="rjp">断り</span></span></button>
      </div>
    </div>

    <div class="field">
      <label>កំណត់ចំណាំ / メモ</label>

    });

}

var urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('gas'))    GAS_URL = urlParams.get('gas');

if (!GAS_URL && window.Telegram && Telegram.WebApp &&
    Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.start_param) {
  GAS_URL = decodeURIComponent(Telegram.WebApp.initDataUnsafe.start_param);
}
if (!currentChatId && window.Telegram && Telegram.WebApp &&

// v7 booking.html と同一方式: POST + text/plain。応答は text で受けて JSON.parse
// （認可切れ等の HTML 応答を切り分けるため。home-internal.html と同方式）
function api(payload) {
  payload.chatId = currentChatId;
  return fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(function(r) { return r.text(); })
    .then(function(txt) {
      try { return JSON.parse(txt); }
      catch (e) { return { ok: false, error: '非JSON応答（先頭300文字）: ' + txt.substring(0, 300) }; }
    });
}

function badgeFor(shop) {
  if (shop.status === '提携済') return '<span class="badge partner">⭐ ' + esc(shop.lastReaction || 'A') + '</span>';
  var cls = shop.lastReaction ? 'r' + shop.lastReaction : 'rNone';
  return '<span class="badge ' + cls + '">' + esc(shop.lastReaction || '—') + '</span>';
}

function renderShopList() {
  var body = document.getElementById('listBody');
  body.innerHTML = '';
  if (!shopsCache.length) {
    renderListError(STR.emptyList);
    return;
  }
  shopsCache.forEach(function(s) {
    var card = document.createElement('div');
    card.className = 'shop-card';
    var meta = [];
    meta.push('🔁 ' + s.visitCount);
    if (s.lastVisit) meta.push('📅 ' + s.lastVisit);
    if (s.phone)     meta.push('☎ ' + s.phone);
    if (s.lat === null || s.lng === null) meta.push(STR.noLocation);
    var typesLine = (s.shopTypes && s.shopTypes.length)
      ? '<div class="shop-meta">🔧 ' + esc(s.shopTypes.join(' / ')) + '</div>' : '';
    card.innerHTML =
      '<div class="shop-head">' +
        '<div class="shop-name">' + esc(s.shopName) + '</div>' +
        badgeFor(s) +
      '</div>' +
      typesLine +
      '<div class="shop-meta">' + esc(meta.join(' · ')) + '</div>';
    card.addEventListener('click', function() { openShop(s.shopId); });
    body.appendChild(card);
  });

// ═══════════════════════════════════════════
//  マップ（Leaflet + OpenStreetMap）
// ═══════════════════════════════════════════
// タイルは OSM 標準。ポリシー上の帰属表示必須・遮断時は下記 URL を
// Esri 等に 1 行差し替えで切替可能な設計
var TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
var TILE_ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
var PP_CENTER = [11.556374, 104.928207]; // プノンペン中心

var REACTION_COLORS = { A: '#2E7D32', B: '#1565C0', C: '#F57C00', D: '#c62828' };

function ensureMap() {
  if (map) return;
  if (typeof L === 'undefined') {
    document.getElementById('mapHint').textContent = '⚠️ ' + STR.netError;
    return;
  }
  map = L.map('map', { minZoom: 11, maxZoom: 19 }).setView(PP_CENTER, 13);
  L.tileLayer(TILE_URL, { attribution: TILE_ATTR, maxZoom: 19 }).addTo(map);
  refreshMapMarkers();
}

function refreshMapMarkers() {
  if (!map) return;
  mapMarkers.forEach(function(m) { map.removeLayer(m); });
  mapMarkers = [];

  var located = shopsCache.filter(function(s) { return s.lat !== null && s.lng !== null; });
  document.getElementById('mapHint').textContent =
    located.length ? ('📍 ' + located.length) : STR.mapEmpty;
  if (!located.length) return;

  var bounds = [];
  located.forEach(function(s) {
    var color = s.status === '提携済' ? '#c9a84c' : (REACTION_COLORS[s.lastReaction] || '#888');
    var marker = L.circleMarker([s.lat, s.lng], {
      radius: 10, color: color, weight: 2,
      fillColor: color, fillOpacity: 0.55
    }).addTo(map);

    var div = document.createElement('div');
    div.innerHTML =
      '<b>' + esc(s.shopName) + '</b><br>' +
      ((s.shopTypes && s.shopTypes.length) ? '🔧 ' + esc(s.shopTypes.join(' / ')) + '<br>' : '') +
      esc((s.lastReaction || '—') + ' · 🔁 ' + s.visitCount + (s.lastVisit ? ' · ' + s.lastVisit : ''));
    var btn = document.createElement('button');
    btn.className = 'popup-open-btn';
    btn.textContent = STR.open;
    btn.addEventListener('click', function() { openShop(s.shopId); });
    div.appendChild(btn);
    marker.bindPopup(div);

    mapMarkers.push(marker);
    bounds.push([s.lat, s.lng]);
  });
  if (bounds.length === 1) {
    map.setView(bounds[0], 15);
  } else {
    map.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });
  }
}

function switchTab(tab) {
  var isMap = tab === 'map';

  document.getElementById('listWrap').style.display = isMap ? 'none' : '';

    ensureMap();

}

// プノンペン時間の今日 (yyyy-MM-dd)
function ppTodayStr() {
  var now = new Date();
  var pp = new Date(now.getTime() + (7 * 60 + now.getTimezoneOffset()) * 60000);
  return pp.getFullYear() + '-' + String(pp.getMonth() + 1).padStart(2, '0') + '-' +
         String(pp.getDate()).padStart(2, '0');
}

    item.innerHTML =
      '<div class="cm-head">' +
        '<span class="cm-date">' + esc(c.serviceDate + (c.serviceDesc ? ' · ' + c.serviceDesc : '')) + '</span>' +
        '<span class="badge ' + (paid ? 'paid' : 'unpaid') + '">' + esc(paid ? '✓' : '!') + '</span>' +
      '</div>' +
      '<div class="cm-calc">' + dirIcon + ' $' + esc(c.revenue.toFixed(2)) + ' × ' + esc(String(c.rate)) + '% = ' +
        '<span class="amt">$' + esc(c.amount.toFixed(2)) + '</span>' +
        (paid && c.payMethod ? ' <span style="color:var(--text-dim)">(' + esc(c.payMethod) + ')</span>' : '') +
      '</div>' +
      (c.memo ? '<div class="vmemo">' + esc(c.memo) + '</div>' : '');
    item.addEventListener('click', function() { openCommissionForm('edit', c); });
    list.appendChild(item);
  });
}

function openCommissionForm(mode, entry) {
  cmMode = mode;
  cmEditingId = entry ? entry.commissionId : null;
  document.getElementById('cmTitle').textContent = mode === 'edit' ? STR.cmEditTitle : STR.cmNewTitle;
  document.getElementById('cmShopLine').textContent = '🏪 ' + (currentShop ? currentShop.shopName : '');
  document.getElementById('cDate').value    = entry ? entry.serviceDate : ppTodayStr();
  document.getElementById('cDesc').value    = entry ? entry.serviceDesc : '';
  document.getElementById('cRevenue').value = entry ? entry.revenue : '';
  document.getElementById('cRate').value    = entry ? entry.rate : 30;
  document.getElementById('cMemo').value    = entry ? entry.memo : '';
  document.getElementById('cPayDate').value = (entry && entry.payDate) ? entry.payDate : ppTodayStr();
  setCmDirection(entry ? entry.direction : '当社→店');
  setCmPayStatus(entry ? entry.payStatus : '未払い');
  setCmPayMethod(entry ? entry.payMethod : '');
  updateCmAmount();
  showView('commission');
}

function updateCmAmount() {
  // ⚠️ CommissionManager.gs の commissionAmountCents_ と同一ロジック（変更時は両方同期必須）
  //   先にセント整数化してから演算（0.5セント境界の浮動小数点誤差対策）
  var revenue = Number(document.getElementById('cRevenue').value);
  var rate = Number(document.getElementById('cRate').value);
  var amt = 0;
  if (isFinite(revenue) && isFinite(rate)) {
    amt = Math.round(Math.round(revenue * 100) * rate / 100) / 100;
  }
  document.getElementById('cAmount').textContent = '= $' + amt.toFixed(2);
}

function setCmDirection(dir) {
  cmDirection = dir === '店→当社' ? '店→当社' : '当社→店';
  var btns = document.querySelectorAll('.dir-btn');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    b.className = 'choice-btn dir-btn' + (b.getAttribute('data-d') === cmDirection ? ' sel' : '');
  }
}

function setCmPayStatus(st) {
  cmPayStatus = st === '支払済み' ? '支払済み' : '未払い';
  var btns = document.querySelectorAll('.pay-btn');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    var on = b.getAttribute('data-p') === cmPayStatus;
    b.className = 'choice-btn pay-btn' + (on ? (cmPayStatus === '支払済み' ? ' sel-green' : ' sel-red') : '');
  }
  document.getElementById('payFields').className = cmPayStatus === '支払済み' ? '' : 'hidden';
}

function setCmPayMethod(m) {
  cmPayMethod = ['現金', 'ABA', 'その他'].indexOf(m) >= 0 ? m : '';
  var btns = document.querySelectorAll('.pm-btn');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    b.className = 'choice-btn pm-btn' + (b.getAttribute('data-m') === cmPayMethod ? ' sel-green' : '');
  }
}

function saveCommission() {
  var revenue = Number(document.getElementById('cRevenue').value);
  if (!isFinite(revenue) || revenue <= 0) { toast(STR.needAmount, 'err'); return; }
  if (!currentShop) { toast('⚠️ ' + STR.netError, 'err'); return; }

  // rate はバックエンドの補正（範囲外→30）と同じ値を送る（プレビューと保存値のズレ防止）
  var rate = Number(document.getElementById('cRate').value);
  if (!isFinite(rate) || rate < 0 || rate > 100) rate = 30;

  var payload = {
    action:      cmMode === 'edit' ? 'commission_update' : 'commission_create',
    serviceDate: document.getElementById('cDate').value,
    serviceDesc: document.getElementById('cDesc').value.trim(),
    revenue:     revenue,
    rate:        rate,
    direction:   cmDirection,
    payStatus:   cmPayStatus,
    payMethod:   cmPayMethod,
    payDate:     document.getElementById('cPayDate').value,
    memo:        document.getElementById('cMemo').value
  };
  if (cmMode === 'edit') payload.commissionId = cmEditingId;
  else payload.shopId = currentShop.shopId;

  var btn = document.getElementById('btnCmSave');
  btn.disabled = true;
  var origLabel = btn.textContent;
  btn.textContent = STR.saving;

  api(payload)
    .then(function(d) {
      btn.disabled = false;
      btn.textContent = origLabel;
      if (!d.ok) { toast('⚠️ ' + (d.error || STR.netError), 'err'); return; }
      toast(STR.cmSaved, 'ok');
      openShop(currentShop.shopId);
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = origLabel;
      toast('⚠️ ' + STR.netError, 'err');
    });
}

(function bindCommissionButtons() {
  var i, btns;
  btns = document.querySelectorAll('.dir-btn');
  for (i = 0; i < btns.length; i++) {
    (function(b) { b.addEventListener('click', function() { setCmDirection(b.getAttribute('data-d')); }); })(btns[i]);
  }
  btns = document.querySelectorAll('.pay-btn');
  for (i = 0; i < btns.length; i++) {
    (function(b) { b.addEventListener('click', function() { setCmPayStatus(b.getAttribute('data-p')); }); })(btns[i]);
  }
  btns = document.querySelectorAll('.pm-btn');
  for (i = 0; i < btns.length; i++) {
    (function(b) { b.addEventListener('click', function() { setCmPayMethod(b.getAttribute('data-m')); }); })(btns[i]);
  }
  document.getElementById('cRevenue').addEventListener('input', updateCmAmount);
  document.getElementById('cRate').addEventListener('input', updateCmAmount);
  document.getElementById('btnAddCommission').addEventListener('click', function() {
    if (currentShop) openCommissionForm('new', null);
  });
  document.getElementById('btnCmBack').addEventListener('click', function() {
    if (currentShop) openShop(currentShop.shopId); else showView('home');
  });
  document.getElementById('btnCmSave').addEventListener('click', saveCommission);
})();

function renderShopDetail() {

      '" target="_blank" rel="noopener">🗺</a>';

// ── 業種チップ（複数選択・店詳細=sTypeGrid / 新規フォーム=fTypeGrid 共通） ──
var typeSelections = { s: [], f: [] };

function renderTypeChips(gridId, key) {
  var grid = document.getElementById(gridId);
  grid.innerHTML = '';
  // 定義済み7種 + 定義外の値（ラベル改名後の旧データ等）も可視チップとして出す
  // — 見えないまま保存で消えるのを防ぐ。タップで意図的に外すことは可能
  var items = SHOP_TYPES.slice();
  var known = SHOP_TYPES.map(function(t) { return t.v; });
  typeSelections[key].forEach(function(v) {
    if (known.indexOf(v) < 0) items.push({ v: v, km: v, jp: '旧ラベル' });
  });
  items.forEach(function(t) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'choice-btn' + (typeSelections[key].indexOf(t.v) >= 0 ? ' sel' : '');
    b.innerHTML = '<span class="ckm">' + esc(t.km) + '</span><span class="cjp">' + esc(t.jp) + '</span>';
    b.addEventListener('click', function() {
      var idx = typeSelections[key].indexOf(t.v);
      if (idx >= 0) typeSelections[key].splice(idx, 1);
      else typeSelections[key].push(t.v);
      renderTypeChips(gridId, key);
    });
    grid.appendChild(b);
  });
}

function setTypeSelection(key, gridId, values) {
  typeSelections[key] = (values || []).slice();
  renderTypeChips(gridId, key);
}

function setStatus(status) {
  selectedStatus = status;
  var btns = document.querySelectorAll('.status-btn');
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    b.className = b.className.replace(' sel', '') +
      (b.getAttribute('data-s') === status ? ' sel' : '');
  }
}
(function bindStatusButtons() {
  var btns = document.querySelectorAll('.status-btn');
  for (var i = 0; i < btns.length; i++) {
    (function(b) {
      b.addEventListener('click', function() { setStatus(b.getAttribute('data-s')); });
    })(btns[i]);
  }
})();

function saveShop() {
  if (!currentShop) return;
  var shopName = document.getElementById('sShop').value.trim();
  if (!shopName) { toast(STR.needShop, 'err'); return; }

  var btn = document.getElementById('btnShopSave');
  btn.disabled = true;
  api({
    action:    'saleslog_shop_update',
    shopId:    currentShop.shopId,
    shopName:  shopName,
    shopTypes: typeSelections.s.slice(),
    ownerName: document.getElementById('sOwner').value.trim(),
    phone:     document.getElementById('sPhone').value.trim(),
    status:    selectedStatus,
    memo:      document.getElementById('sMemo').value
  })
    .then(function(d) {
      btn.disabled = false;
      if (d.ok) {
        toast(STR.updated, 'ok');
        // 画面に留まったまま「追記」した時に古い店名が渡らないよう currentShop も即時更新
        currentShop = Object.assign({}, currentShop, {
          shopName:  shopName,
          shopTypes: typeSelections.s.slice(),
          ownerName: document.getElementById('sOwner').value.trim(),
          phone:     document.getElementById('sPhone').value.trim(),
          status:    selectedStatus,
          memo:      document.getElementById('sMemo').value
        });
        loadShops();
      } else {
        toast('⚠️ ' + (d.error || STR.netError), 'err');
      }

    .catch(function() { btn.disabled = false; toast('⚠️ ' + STR.netError, 'err'); });

function openForm(mode, opts) {
  formMode = mode;
  opts = opts || {};
  formShopId = opts.shopId || '';
  editingVisitId = opts.visitId || null;

  var titles = { 'new': STR.newTitle, 'append': STR.appendTitle, 'edit': STR.editTitle };
  document.getElementById('formTitle').textContent = titles[mode];

  var note = document.getElementById('formNote');

  } else {
    note.className = 'form-note hidden';
  }

  // フィールド表示制御: 店名/業種/オーナー/電話は新規のみ（追記・編集は店マスター側で管理）
  var showShopFields = mode === 'new';
  document.getElementById('shopNameField').className = 'field' + (showShopFields ? '' : ' hidden');
  document.getElementById('typeField').className     = 'field' + (showShopFields ? '' : ' hidden');
  document.getElementById('ownerField').className    = 'field' + (showShopFields ? '' : ' hidden');
  document.getElementById('phoneField').className    = 'field' + (showShopFields ? '' : ' hidden');

}

// ── 既存店サジェスト（店名部分一致 + GPS 近接 200m） ──
function clearSuggest() {
  document.getElementById('suggestBox').innerHTML = '';
}

function distMeters(lat1, lng1, lat2, lng2) {
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  var a = Math.sin(dLat/2) * Math.sin(dLat/2) +
          Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLng/2) * Math.sin(dLng/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function updateSuggest() {
  if (formMode !== 'new') return;
  var q = document.getElementById('fShop').value.trim().toLowerCase();
  var box = document.getElementById('suggestBox');
  box.innerHTML = '';

  var hits = [];
  shopsCache.forEach(function(s) {
    var nameHit = q.length >= 2 && s.shopName.toLowerCase().indexOf(q) >= 0;
    var gpsHit = currentGps && s.lat !== null && s.lng !== null &&
                 distMeters(currentGps.lat, currentGps.lng, s.lat, s.lng) <= 200;
    if (nameHit || gpsHit) hits.push({ shop: s, gpsHit: gpsHit && !nameHit });
  });
  if (!hits.length) return;

  var label = document.createElement('div');
  label.className = 'suggest-label';
  label.textContent = STR.suggestHead;
  box.appendChild(label);

  hits.slice(0, 4).forEach(function(h) {
    var chip = document.createElement('button');
    chip.type = 'button';
    chip.className = 'suggest-chip';
    chip.textContent = (h.gpsHit ? '📍 ' : '🏪 ') + h.shop.shopName +
      '（🔁' + h.shop.visitCount + (h.shop.lastVisit ? ' · ' + h.shop.lastVisit : '') + '）';
    chip.addEventListener('click', function() {
      openForm('append', { shopId: h.shop.shopId, shopName: h.shop.shopName });
    });
    box.appendChild(chip);
  });
}
document.getElementById('fShop').addEventListener('input', updateSuggest);

// ═══════════════════════════════════════════
//  GPS（Telegram LocationManager API のみ使用）
//  ※ navigator.geolocation は Telegram WebView 内で不安定なため使用禁止（要件 v1）
// ═══════════════════════════════════════════
function acquireGps() {
  var box = document.getElementById('gpsBox');
  currentGps = null;

  var wa = window.Telegram && Telegram.WebApp;
  if (!wa || !wa.LocationManager || !(wa.isVersionAtLeast && wa.isVersionAtLeast('8.0'))) {
    box.className = 'gps-box err';
    box.textContent = '📡 ' + STR.gpsOld;
    return;
  }

  box.className = 'gps-box';
  box.textContent = '📡 ' + STR.gpsGetting;

  var lm = wa.LocationManager;
  var run = function() {
    if (!lm.isLocationAvailable) {
      box.className = 'gps-box warn';
      box.textContent = '📡 ' + STR.gpsFail;
      return;
    }
    lm.getLocation(function(data) {
      if (data && typeof data.latitude === 'number') {
        currentGps = {
          lat: Number(data.latitude.toFixed(6)),
          lng: Number(data.longitude.toFixed(6))
        };
        var acc = Math.round(data.horizontal_accuracy || 0);
        box.className = 'gps-box ok';
        box.textContent = '📡 ' + STR.gpsOk + ' (' + currentGps.lat + ', ' + currentGps.lng +
                          (acc ? ' ±' + acc + 'm' : '') + ')';
        updateSuggest(); // GPS 近接サジェストを更新
      } else {
        currentGps = null;
        box.className = 'gps-box warn';
        box.textContent = '📡 ' + STR.gpsFail;
      }
    });
  };
  if (lm.isInited) run(); else lm.init(run);
}

// ═══════════════════════════════════════════
//  訪問の保存（新規 / 追記 / 編集）
// ═══════════════════════════════════════════
function saveVisit() {
  if (!currentChatId || !GAS_URL) { toast(STR.netError, 'err'); return; }

  var payload;
  if (formMode === 'edit') {
    payload = {
      action:   'saleslog_update',
      visitId:  editingVisitId,
      reaction: selectedReaction,
      memo:     document.getElementById('fMemo').value
    };
  } else if (formMode === 'append') {
    payload = {
      action:   'saleslog_create',
      shopId:   formShopId,
      reaction: selectedReaction,
      memo:     document.getElementById('fMemo').value,
      gps:      currentGps
    };
  } else {
    var shopName = document.getElementById('fShop').value.trim();
    if (!shopName) { toast(STR.needShop, 'err'); return; }
    payload = {
      action:    'saleslog_create',
      shopName:  shopName,
      shopTypes: typeSelections.f.slice(),
      ownerName: document.getElementById('fOwner').value.trim(),
      phone:     document.getElementById('fPhone').value.trim(),
      reaction:  selectedReaction,
      memo:      document.getElementById('fMemo').value,
      gps:       currentGps
    };
  }

  var btn = document.getElementById('btnSave');
  btn.disabled = true;
  var origLabel = btn.textContent;
  btn.textContent = STR.saving;

  api(payload)
    .then(function(d) {
      btn.disabled = false;
      btn.textContent = origLabel;
      if (!d.ok) { toast('⚠️ ' + (d.error || STR.netError), 'err'); return; }
      toast(formMode === 'edit' ? STR.updated : STR.saved, 'ok');
      var backShopId = (formMode === 'append') ? formShopId
                     : (formMode === 'edit' && currentShop) ? currentShop.shopId
                     : (d.shopId || '');
      loadShops().then(function() {
        if (formMode === 'new') {
          showView('home');
        } else if (backShopId) {
          openShop(backShopId);
        } else {
          showView('home');
        }
      });
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = origLabel;
      toast('⚠️ ' + STR.netError, 'err');
    });
}

// ═══════════════════════════════════════════
//  Toast / esc
// ═══════════════════════════════════════════
var toastTimer = null;
function toast(msg, kind) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (kind || '');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    t.className = 'toast ' + (kind || '');
  }, 3000);
}

function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}
