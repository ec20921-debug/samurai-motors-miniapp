<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Samurai Motors 現場</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Samurai">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://script.google.com/" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com/" crossorigin>
<!-- Telegram から開いたときだけ initData が入る。ホーム画面アプリでは読み込めなくても動く -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../tg-auth.js"></script>
<script src="outbox.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════
   Samurai Motors 現場アプリ v2（本番・2026-10-08〜）
   試作 field-app-preview.html の見た目を移植。今日タブ＋施工フローのみ（営業・経費・日報は Phase C）
   設計: Vault/04_Projects/Samurai/04_Businesses/Motors/FieldApp_v2_Production_Plan_v0.2.md
   1. 画面は「次に何をするか」を1つだけ示す  2. クメール語が主・日本語は管理者の切替
   3. 主ボタンは画面下・大きく  4. 写真は1枚ずつガイド  5. 記録は作業の副産物として残る
   6. 圏外でも止まらない: 端末に保存 → 電波が戻れば送る（outbox.js）
   ═══════════════════════════════════════════════════════════════ */
:root {
  --bg:#f2f4f7; --card:#fff; --band:#e6eaf0; --line:#cfd6df;
  --text:#141922; --sub:#4d5765; --faint:#98a2b3;
  --gold:#8a6a1f; --gold-bg:#f6efdc;
  --blue:#1d4ed8; --blue-bg:#e8eefc;
  --green:#15803d; --green-bg:#e6f4ea;
  --red:#b42318; --red-bg:#fbeae7;
  --amber:#8a5a00; --amber-bg:#fdf3df;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans Khmer','Khmer OS','Khmer Sangam MN',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:17px;line-height:1.5;padding-top:env(safe-area-inset-top,0px)}
body[data-lang="ja"]{font-family:system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;font-size:16px}
button{font-family:inherit;font-size:inherit;color:inherit;border:none;background:none;cursor:pointer}
button:disabled{cursor:default}
input,select,textarea{font-family:inherit;font-size:18px;color:var(--text)}
.num,.latin{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* ── ヘッダー ── */
.head{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px;min-height:58px}
.head img{width:36px;height:36px;border-radius:9px;object-fit:contain}
.head .brand{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:.18em;font-weight:700;color:var(--gold)}
.head .ttl{font-size:17px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .sub{font-size:12px;color:var(--sub)}
.head .sp{flex:1;min-width:0}
.pill{border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;min-height:38px;display:inline-flex;align-items:center;gap:6px;background:#fff;white-space:nowrap}
.pill.q{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.pill.r{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.pill.ok{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);display:grid;place-items:center;background:#fff;font-size:22px;flex:none}
.stepdots{display:flex;gap:5px}
.stepdots i{width:10px;height:10px;border-radius:50%;background:#d3d9e2}
.stepdots i.done{background:var(--green)} .stepdots i.now{background:var(--blue);transform:scale(1.25)}

main{max-width:520px;width:100%;min-width:0;margin:0 auto;padding:12px 12px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;align-content:start}
main.flow{padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}

/* ── 帯（送信状態・お知らせ） ── */
.strip{border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px}
.strip .grow{flex:1;min-width:0}
.strip button{flex:none;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;background:#fff;border:1.5px solid currentColor}
.strip.warn{background:var(--amber-bg);color:var(--amber)}
.strip.err{background:var(--red-bg);color:var(--red)}
.strip.info{background:var(--blue-bg);color:var(--blue)}
.strip.ok{background:var(--green-bg);color:var(--green)}

/* ── 共通部品 ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.band{background:var(--band);padding:9px 14px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.band .r{margin-left:auto;font-weight:700;color:var(--sub);font-size:13px}
.body{padding:14px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.body>*,.row2>*,.row3>*,.cam>*,.svc>*,.acts>*{min-width:0}
.note{font-size:13px;color:var(--sub);line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--band);color:var(--text);white-space:nowrap;font-family:system-ui,sans-serif}
.chip.menu{background:var(--blue-bg);color:var(--blue)}
.chip.ok{background:var(--green-bg);color:var(--green)}
.chip.warn{background:var(--amber-bg);color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:5px}

.btn{width:100%;min-height:64px;border-radius:14px;padding:10px 16px;font-size:19px;font-weight:700;color:#fff;background:var(--blue);display:grid;place-items:center;gap:0;line-height:1.25;transition:transform .1s,filter .1s}
.btn small{font-size:12px;font-weight:600;opacity:.9}
.btn:active{transform:scale(.985);filter:brightness(.93)}
.btn.green{background:var(--green)} .btn.red{background:var(--red)} .btn.gold{background:var(--gold)}
.btn.ghost{background:#fff;color:var(--text);border:2px solid var(--line)}
.btn.sm{min-height:50px;font-size:16px;border-radius:12px}
.btn:disabled{background:#b9c0ca;color:#fff;border-color:#b9c0ca}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.opt{position:relative;border:2px solid var(--line);border-radius:14px;background:#fff;min-height:64px;padding:10px 12px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;font-weight:700;font-size:17px;line-height:1.25}
.opt .ic{font-size:26px;width:36px;text-align:center;flex:none}
.opt small{display:block;font-size:12px;font-weight:500;color:var(--sub)}
.opt.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}
.opt.on.g{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.opt.on.r{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.opt.on.gold{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.opt .tick{margin-left:auto;font-size:20px}
.opt.center{justify-content:center;text-align:center;flex-direction:column;gap:4px;padding:12px 8px}
.opt.center .ic{width:auto}

/* ── 下部タブ（試作と同じ） ── */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);display:grid;grid-template-columns:repeat(2,1fr)}
.tabs[hidden]{display:none}
.tabs.three{grid-template-columns:repeat(3,1fr)}
.tabs.four{grid-template-columns:repeat(4,1fr)}
.tab[hidden]{display:none}
/* SCOUT タブ: 営業アプリ（../saleslog-internal.html）を同じ画面の中で開く（2026-10-25・アイコンを1つにするため） */
.scout-wrap{position:fixed;left:0;right:0;top:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:30;background:#fff;padding-top:env(safe-area-inset-top,0px)}
.scout-wrap[hidden]{display:none}
.scout-wrap iframe{width:100%;height:100%;border:0;display:block}
.tab{height:62px;display:grid;place-items:center;align-content:center;gap:2px;color:#6b7686;position:relative;font-size:12px;font-weight:700;line-height:1.15}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--blue)}
.tab[aria-selected="true"]::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--blue)}
main.tabbed{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
/* ── 経費（試作と同じ） ── */
.receipt{position:relative;aspect-ratio:16/9;border-radius:14px;border:2px dashed #b8c2cf;background:#f7f9fb;display:grid;place-items:center;align-content:center;gap:6px;color:var(--sub);font-weight:700;overflow:hidden}
.receipt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.receipt input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.receipt .ic{font-size:40px;line-height:1}
.receipt.has{border-style:solid;border-color:var(--green)}
.big-amt{display:flex;align-items:center;gap:8px}
.big-amt input{flex:1;width:1px;min-width:0;min-height:64px;font-size:34px;font-weight:700;text-align:right;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;font-family:'Noto Sans JP',sans-serif}
.big-amt span{font-size:30px;font-weight:700}
.items{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.item{border:2px solid var(--line);border-radius:14px;background:#fff;min-height:84px;padding:8px 4px;display:grid;place-items:center;align-content:center;gap:4px;text-align:center;line-height:1.2}
.item .ic{font-size:30px;line-height:1}
.item .nm{font-size:14px;font-weight:700}
.item.on{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.item-ex{background:var(--band);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);line-height:1.5}
.memo-in{width:100%;min-height:52px;border:2px solid var(--amber);border-radius:12px;padding:10px 12px;font-size:17px;background:#fff}
.exp-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #e7ebf1;font-size:15px}
.exp-row:last-child{border-bottom:0}
.exp-row b{font-size:17px;white-space:nowrap}

/* ── 今日: 打刻ストリップ ── */
.punch{display:flex;align-items:center;gap:12px;padding:12px 14px}
.punch .clock{font-size:34px;font-weight:700;line-height:1}
.punch .st{font-size:13px;font-weight:700;margin-top:4px;display:inline-flex;gap:6px;align-items:center}
.punch .st i{width:9px;height:9px;border-radius:50%;background:#98a2b3;display:inline-block}
.punch .st.work i{background:var(--green)}
.punch button{margin-left:auto;min-height:60px;min-width:128px;border-radius:14px;color:#fff;font-weight:700;font-size:18px;padding:6px 14px;display:grid;place-items:center;line-height:1.2}
.punch button.in{background:var(--green)} .punch button.out{background:var(--red)} .punch button:disabled{background:#b9c0ca}
.fld textarea{font-size:16px;font-family:inherit}

/* ── 今日: 次の予定 ── */
.next{border:2px solid var(--blue)}
.next .body{gap:10px}
.next .when{display:flex;align-items:baseline;gap:10px}
.next .when .t{font-size:44px;font-weight:700;line-height:1}
.next .when .in{font-size:14px;color:var(--sub);font-weight:600}
.next .name{font-size:22px;font-weight:700;line-height:1.2}
.next .meta{display:grid;gap:3px;font-size:15px;color:var(--sub)}
.next .meta b{color:var(--text)}
.acts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act{border:2px solid var(--line);border-radius:12px;min-height:56px;display:grid;place-items:center;gap:1px;font-size:13px;font-weight:700;background:#fff;color:var(--text)}
.act .ic{font-size:22px;line-height:1}
.act.go{border-color:var(--blue);background:var(--blue-bg);color:var(--blue)}

/* ── 今日: タイムライン ── */
.tl{display:grid}
.tl-item{display:grid;grid-template-columns:56px 18px minmax(0,1fr);gap:0 10px;align-items:stretch;min-height:64px;text-align:left;width:100%;padding:0;background:none}
.tl-item .t{font-size:16px;font-weight:700;padding-top:12px;text-align:right}
.tl-item .ln{position:relative}
.tl-item .ln::before{content:"";position:absolute;left:8px;top:0;bottom:0;width:2px;background:#d3d9e2}
.tl-item:first-child .ln::before{top:18px} .tl-item:last-child .ln::before{bottom:calc(100% - 18px)}
.tl-item .ln i{position:absolute;left:3px;top:14px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #98a2b3}
.tl-item.now .ln i{border-color:var(--blue);background:var(--blue)}
.tl-item.working .ln i{border-color:var(--amber);background:var(--amber)}
.tl-item.done .ln i{border-color:var(--green);background:var(--green)}
.tl-item .c{border-bottom:1px solid #e7ebf1;padding:10px 4px 10px 0;display:grid;gap:3px}
.tl-item:last-child .c{border-bottom:0}
.tl-item .n{font-size:16px;font-weight:700}
.tl-item.done .n{color:var(--sub);text-decoration:line-through}
.tl-item .s{font-size:13px;color:var(--sub)}

/* ── 作業フロー ── */
.jobhead{display:grid;gap:6px;padding:12px 14px}
.jobhead .g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:14px}
.jobhead .g small{display:block;font-size:11px;color:var(--sub);font-weight:600}
.jobhead .g b{font-size:15px;word-break:break-word}
.chk{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e7ebf1}
.chk:last-child{border-bottom:0}
.chk .l{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700}
.chk .l .ic{font-size:26px;width:36px;text-align:center}
.chk .seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;min-width:140px}
.chk .seg button{min-height:48px;border:2px solid var(--line);border-radius:10px;font-weight:700;font-size:15px;background:#fff;color:var(--sub)}
.chk .seg button.ok.on{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.chk .seg button.ng.on{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.dmap{position:relative;width:100%;aspect-ratio:2/1;background:#f7f9fb;border:2px dashed #b8c2cf;border-radius:12px;overflow:hidden}
.dmap svg{position:absolute;inset:0;width:100%;height:100%}
.dmap .mk{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);font-family:system-ui,sans-serif}
.dmg-list{display:grid;gap:8px}
.dmg{display:grid;grid-template-columns:30px 72px minmax(0,1fr) 36px;gap:10px;align-items:center}
.dmg .no{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;font-weight:700;display:grid;place-items:center;font-family:system-ui,sans-serif}
.dmg .ph{position:relative;width:72px;height:54px;border-radius:8px;overflow:hidden;border:2px dashed #b8c2cf;background:#f7f9fb;display:grid;place-items:center;font-size:22px}
.dmg .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.dmg .ph input{position:absolute;inset:0;opacity:0}
.dmg input.memo{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:16px}
.dmg .x{width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);color:var(--sub);font-size:18px}
.cam{display:grid;gap:10px}
.cam .frame{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#1a1f28;display:grid;place-items:center}
.cam .frame svg{width:72%;height:auto;color:#fff;opacity:.9}
.cam .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .frame .lbl{position:absolute;left:12px;bottom:10px;color:#fff;font-weight:700;font-size:20px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.cam .frame .cnt{position:absolute;right:12px;top:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px;font-family:system-ui,sans-serif}
.cam .frame .req{position:absolute;left:12px;top:10px;border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700;background:var(--red);color:#fff}
.cam .frame .req.opt{background:rgba(255,255,255,.85);color:var(--sub)}
.cam .shoot{position:relative;min-height:72px;border-radius:14px;background:var(--blue);color:#fff;font-size:20px;font-weight:700;display:grid;place-items:center}
.cam .shoot input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.cam .retake{position:relative;overflow:hidden;width:100%}
.cam .retake input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.thumbs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.thumbs button{flex:none;width:64px;height:48px;border-radius:8px;overflow:hidden;border:2px solid var(--line);background:#f7f9fb;position:relative;display:grid;place-items:center;font-size:11px;color:var(--sub);font-weight:700}
.thumbs button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumbs button.now{border-color:var(--blue)} .thumbs button.has{border-color:var(--green)}
.thumbs button .k{position:absolute;right:2px;bottom:1px;background:var(--green);color:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;display:grid;place-items:center}
.timer{text-align:center;padding:14px}
.timer .v{font-size:50px;font-weight:700;color:var(--green);line-height:1.05}
.timer .l{font-size:13px;color:var(--sub)}
.svc{display:grid;gap:8px}
.svc .s{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:66px;text-align:left;width:100%;background:#fff}
.svc .s .n{font-weight:700;font-size:17px;line-height:1.2}
.svc .s .n small{display:block;font-size:12px;color:var(--sub);font-weight:600}
.svc .s .t{font-size:18px;font-weight:700;color:var(--sub)}
.svc .s.now{border-color:var(--green);background:var(--green-bg)} .svc .s.now .t{color:var(--green)}
.svc .s.done{border-color:var(--green)} .svc .s.done .t{color:var(--green)}
.svc .s.skip{opacity:.55}
.big-amt{display:flex;align-items:center;gap:8px}
.big-amt input{flex:1;width:1px;min-width:0;min-height:64px;font-size:34px;font-weight:700;text-align:right;border:2px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;font-family:system-ui,sans-serif}
.big-amt span{font-size:30px;font-weight:700}
.done-screen{text-align:center;padding:26px 14px;display:grid;gap:10px;justify-items:center}
.done-screen .ic{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:46px;display:grid;place-items:center}
.done-screen .h{font-size:22px;font-weight:700}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:15px;text-align:left;width:100%}
.kv b{text-align:right}
.fld{display:grid;gap:6px}
.fld label{font-size:14px;font-weight:700;color:var(--sub)}
.fld input{width:100%;min-height:54px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff}

/* 下の操作バー（作業中） */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(20,25,34,.07);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:520px;margin:0 auto;display:grid;gap:8px}
.bar .prog{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--sub);font-family:system-ui,sans-serif}
.bar .prog .b{flex:1;height:6px;border-radius:3px;background:#d9dfe7;overflow:hidden}
.bar .prog .b i{display:block;height:100%;background:var(--green);transition:width .2s}

.toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-16px);background:var(--text);color:#fff;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:200;max-width:92%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green)} .toast.warn{background:var(--amber)}
.diag{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;background:#0f172a;color:#e2e8f0;border-radius:10px;padding:10px 12px;line-height:1.5}
/* お店の仕事（2026-10-27） */
.shopbtn{width:100%;border-radius:16px;background:var(--gold);color:#fff;padding:16px 18px;text-align:left;display:grid;gap:4px}
.shopbtn b{font-size:21px;line-height:1.3}.shopbtn span{font-size:13px;opacity:.92}
.hs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.sc{flex:none;border:2px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700;background:#fff;white-space:nowrap;font-family:system-ui,sans-serif}
.sc.on{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.sc.gold{border-color:var(--gold);background:var(--gold-bg);color:var(--gold)}
.srch{width:100%;min-height:54px;border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:#fff;font-size:17px}
.slist{display:grid}
.slist button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:12px 2px;border-top:1px solid var(--band);font-size:17px;font-weight:700;width:100%;font-family:system-ui,sans-serif}
.slist button:first-child{border-top:0}
.slist small{display:block;font-size:12px;font-weight:500;color:var(--sub)}
.newshop{width:100%;border:2px dashed var(--gold);border-radius:14px;padding:12px 14px;color:var(--gold);font-weight:700;font-size:16px;background:var(--gold-bg);text-align:left}
.newshop small{display:block;font-weight:500;font-size:12px;color:var(--sub);margin-top:2px}
.seg2{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg2.three{grid-template-columns:1fr 1fr 1fr}
.seg2 button{padding:12px 6px;font-size:15px;font-weight:700;background:#fff}
.seg2 button.on{background:var(--gold-bg);color:var(--gold)}
.pstep{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pstep button{border:2px solid var(--line);border-radius:12px;min-height:48px;font-size:18px;font-weight:700;background:#fff;font-family:system-ui,sans-serif}
.phint{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.phint .d{border-radius:999px;padding:1px 9px;background:var(--band);font-weight:700;font-family:system-ui,sans-serif}
.phint .d.warn{background:var(--red-bg);color:var(--red)}
.vin{display:flex;gap:8px;align-items:center}
.vin input{flex:1;min-width:0}
.vin .cambtn{position:relative;flex:none;border:2px solid var(--blue);color:var(--blue);background:var(--blue-bg);border-radius:12px;min-height:54px;padding:0 12px;font-weight:700;display:grid;place-items:center;overflow:hidden}
.vin .cambtn input{position:absolute;inset:0;opacity:0}
.vin img{width:54px;height:54px;object-fit:cover;border-radius:10px;flex:none}
.tgp{background:#e7f3df;border-radius:12px;padding:10px;display:grid;gap:6px}
.tgp .m{background:#fff;border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.55;display:grid;gap:2px}
.tgp .bot{color:#2a8bd1;font-weight:700;font-size:13px}
.askoff{border:2px solid var(--red);background:var(--red-bg);border-radius:14px;padding:12px;display:grid;gap:10px;font-weight:700;color:var(--red)}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>

  var glass = codes.filter(function (k) { return k.indexOf('GLASS') === 0; })[0] || '';
  return {

    plan: codes.indexOf('WASH') >= 0 ? 'SAMURAI WASH (W)' : '', glassOption: glass,
    optionCodes: codes.filter(function (k) { return k !== 'WASH'; }),
    vehicleType: j.size === 'SUV' ? 'SUV' : 'セダン', bookingId: j.bookingId || '', linkToken: '', surface: SURFACE
  };
}
function queueStart(c) {

  shots.forEach(function (s) { if (c.photos[s.id]) { photos.push(c.photos[s.id]); slots.push(s.id.replace('before_', '')); } });
  c.dmg.forEach(function (d, i) { if (d.img) { photos.push(d.img); slots.push('D' + (i + 1)); } });
  if (c.mode === 'shop' && c.vinImg) { photos.push(c.vinImg); slots.push('V'); }   // 車台番号の写真（お店の仕事）
  var p = basePayload(c);
  p.client_id = c.jobCid; p.job_client_id = c.jobCid; p.request_id = c.jobCid;
  p.amount = c.job.bookingId ? (c.job.amount || '') : '';
  p.startTime = c.startAt; p.beforePhotos = photos;
  p.v2 = { checks: c.checks, no_damage: !c.dmg.length && !!c.noDamage, photo_slots: slots,
           damage: c.dmg.map(function (d, i) { return { x: d.x, y: d.y, memo: d.memo || '', photo: d.img ? 'D' + (i + 1) : '' }; }),
           shop_id: (c.shopAtStart && !c.job.bookingId) ? (c.shop || '') : '' };   // 始める前に選んだ店（2026-10-25）
  if (c.mode === 'shop') {   // お店の仕事（2026-10-27）。サーバーは知らない項目を v2記録(JSON) に残すだけ
    p.v2.mode = 'shop'; p.v2.who = c.who; p.v2.agreed_price = sjNum(c.price); p.v2.repainted = c.repaint || ''; p.v2.new_shop_name = c.newShop ? c.shopName : '';
  }

}

function applyShopAmount(c) {
  if (c.pay === 'free') return;
  if (isShopPay(c.pay) && c.shop) {
    c.list = listPriceOf(c); c.rate = shopRateOf(c.shop);
    c.amount = Math.round(c.list * (100 - c.rate)) / 100;
  } else if (c.list) {   // 店の仕事から別の区分に変えた時は定価に戻す
    c.amount = c.list; c.list = 0; c.rate = null;
  } else if (!c.amount) c.amount = listPriceOf(c);
}
function canSavePay(c) { return !!c.pay && c.pay !== 'cash' && !(isShopPay(c.pay) && !c.shop) && (c.pay === 'free' || (Number(c.amount) > 0 && Number(c.amount) <= 2000)); }   // 無料以外は金額が要る
function queueEnd(c) {
  var shots = shotsFor(c.job, 'after'), photos = [], slots = [];
  shots.forEach(function (s) { if (c.photos[s.id]) { photos.push(c.photos[s.id]); slots.push(s.id.replace('after_', '')); } });
  var p = basePayload(c), endId = c.endCid || (c.endCid = Outbox.uuid()), times = {};   // 同じ作業の終了は同じ client_id（2026-10-27）
  Object.keys(c.svc).forEach(function (k) { if (!c.svc[k].skip) times[k] = Math.round(svcSec(c.svc[k])); });
  p.client_id = endId; p.job_client_id = c.jobCid; p.request_id = endId;
  p.amount = c.pay === 'free' ? 0 : (Number(c.amount) || 0);
  p.endTime = c.endAt; p.duration = Math.round(workSec(c) / 60); p.afterPhotos = photos;
  p.v2 = { service_times: times, services_done: Object.keys(times), payment_type: c.pay, source: c.src,
           shop_id: (c.src === 'shop' || isShopPay(c.pay)) ? (c.shop || '') : '',
           list_price: isShopPay(c.pay) && c.list ? c.list : listPriceOf(c), shop_rate: isShopPay(c.pay) && c.rate != null ? c.rate : '',
           duration_sec: Math.round(workSec(c)), work_start: c.startAt, work_end: c.endAt, photo_slots: slots };
  if (c.mode === 'shop') { p.v2.mode = 'shop'; p.v2.price_mode = 'agreed'; p.v2.agreed_price = sjNum(c.price); p.v2.guide_price = sjGuide(c.job, c.who, c.rate); p.v2.new_shop_name = c.newShop ? c.shopName : ''; }
  // 先に下書きへ endCid を保存（送信待ち箱に入れた後に落ちても、同じ client_id で上書きされるだけ）
  return Outbox.kvSet('draft', c).then(function () { return Outbox.enqueue('job_end', p); });
}

function getGps() {
  return new Promise(function (resolve) {
    if (!navigator.geolocation) { resolve(null); return; }
    var done = false, fin = function (v) { if (!done) { done = true; resolve(v); } };
    setTimeout(function () { fin(null); }, 8000);
    try {
      navigator.geolocation.getCurrentPosition(function (p) {
        fin({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy: p.coords.accuracy });
      }, function () { fin(null); }, { enableHighAccuracy: true, timeout: 7000, maximumAge: 60000 });
    } catch (e) { fin(null); }
  });
}
function doPunch(type) {
  if (type === 'out' && !window.confirm(t('confirm_out'))) return;
  var at = new Date().toISOString(), tm = hhmm(ppNow());
  var btn = $('punch'); if (btn) btn.disabled = true;
  getGps().then(function (gps) {
    S.gps = gps ? 'ok' : 'ng';
    var data = { client_id: Outbox.uuid(), chatId: ME.chatId, at: at, gps: gps };
    if (ME.via === 'link') data.k = ME.key; else data._tgInitData = TG.initData;
    return Outbox.enqueue('punch_' + type, data, { url: OPS_URL, after: type === 'out' ? (S.att.inCid || '') : '' }).then(function () {
      if (type === 'in') { S.att.clockIn = tm; S.att.localIn = tm; S.att.inCid = data.client_id; } else { S.att.clockOut = tm; S.att.localOut = tm; }
      Outbox.kvSet('att:' + ppDate(0), S.att);
      toast((type === 'in' ? '🟢 ' : '🔴 ') + t('punch_saved') + ' ' + tm, 'ok');
      render();
    });
  }).catch(function () { if (btn) btn.disabled = false; toast('⚠ IndexedDB', 'warn'); });
}

      (img ? '<div class="btn sm ghost retake">↺ ' + t('btn_retake') + '<input type="file" accept="image/*" capture="environment" id="shoot"></div>'

function bindJob() {
  var c = S.cur;
  document.querySelectorAll('[data-chk]').forEach(function (b) { b.onclick = function () { c.checks[b.getAttribute('data-chk')] = b.getAttribute('data-v'); saveDraft(); renderJob(); }; });
  var dm = $('dmap'); if (dm) dm.onclick = function (e) {
    var r = dm.getBoundingClientRect(); var x = Math.round((e.clientX - r.left) / r.width * 100), y = Math.round((e.clientY - r.top) / r.height * 100);
    if (x < 8 || x > 92 || y < 8 || y > 92) return; c.dmg.push({ x: x, y: y, img: '', memo: '' }); c.noDamage = false; saveDraft(); renderJob();
  };
  document.querySelectorAll('[data-dmgph]').forEach(function (inp) { inp.onchange = function () { if (!inp.files[0]) return; readShrunk(inp.files[0], function (u) { c.dmg[+inp.getAttribute('data-dmgph')].img = u; saveDraft(); renderJob(); }); }; });
  document.querySelectorAll('[data-dmgmemo]').forEach(function (inp) { inp.oninput = function () { c.dmg[+inp.getAttribute('data-dmgmemo')].memo = inp.value; saveDraft(); }; });
  document.querySelectorAll('[data-dmgdel]').forEach(function (b) { b.onclick = function () { c.dmg.splice(+b.getAttribute('data-dmgdel'), 1); saveDraft(); renderJob(); }; });
  var dn = $('dmgNone'); if (dn) dn.onclick = function () { c.noDamage = !c.noDamage; saveDraft(); renderJob(); };

  var sh = $('shoot'); if (sh) sh.onchange = function () { if (!sh.files[0]) return; var shots = shotsFor(c.job, c.step); readShrunk(sh.files[0], function (u) {
    var id = shots[c.shotIdx].id, had = !!c.photos[id];
    c.photos[id] = u; saveDraft();
    if (had) renderJob(); else advanceShot();   // 撮り直しはその枠に残る・新しく撮ったら次の枠へ
  }); };
  var sk = $('skipShot'); if (sk) sk.onclick = function () { advanceShot(); };
  document.querySelectorAll('[data-shot]').forEach(function (b) { b.onclick = function () { c.shotIdx = +b.getAttribute('data-shot'); renderJob(); }; });

  document.querySelectorAll('[data-svc]').forEach(function (b) { b.onclick = function () {
    var k = b.getAttribute('data-svc');
    setActive(c, c.active === k ? null : k);   // もう一度押す = このサービス完了
    saveDraft(); renderJob();
  }; });
  document.querySelectorAll('[data-tog]').forEach(function (b) { b.onclick = function () { var k = b.getAttribute('data-tog'); c.svc[k].skip = !c.svc[k].skip; saveDraft(); renderJob(); }; });
  document.querySelectorAll('[data-pay]').forEach(function (b) { b.onclick = function () {
    c.pay = b.getAttribute('data-pay');
    if (c.pay === 'shopref') c.src = 'shop';   // 紹介のお客さん＝流入元もお店
    applyShopAmount(c); saveDraft(); renderJob();
  }; });
  document.querySelectorAll('[data-src]').forEach(function (b) { b.onclick = function () { c.src = b.getAttribute('data-src'); saveDraft(); renderJob(); }; });
  var ss = $('shopSel'); if (ss) ss.onchange = function () { c.shop = ss.value || ''; applyShopAmount(c); saveDraft(); renderJob(); };
  var ssStart = $('shopSelStart'); if (ssStart) ssStart.onchange = function () {
    var id = ssStart.value || '', sp = (S.shops || []).filter(function (x) { return x.id === id; })[0];
    c.shop = id; c.shopAtStart = !!id;
    if (sp && sp.rate !== undefined) c.rate = sp.rate; else delete c.rate;   // 支払い画面の自動金額と同じ c.shop / c.rate
    saveDraft(); renderJob();
  };
  var am = $('amt'); if (am) am.oninput = function () { c.amount = parseFloat(am.value) || 0; saveDraft(); renderBar(); };

  if (c.step === 'work') {
    timerId = setInterval(function () {
      var tv = $('tv'); if (tv) tv.textContent = hms(totalSvcSec(c));
      if (c.active) { var el = document.querySelector('[data-tv="' + c.active + '"]'); if (el) el.textContent = '▶ ' + hms(svcSec(c.svc[c.active])); }
    }, 1000);
  }
}

function advanceShot() {
  var c = S.cur, shots = shotsFor(c.job, c.step), next = -1;
  for (var i = c.shotIdx + 1; i < shots.length; i++) { if (!c.photos[shots[i].id]) { next = i; break; } }
  if (next < 0) for (var k = 0; k < shots.length; k++) { if (shots[k].req && !c.photos[shots[k].id]) { next = k; break; } }
  if (next < 0) next = Math.min(c.shotIdx + 1, shots.length - 1);
  c.shotIdx = next; saveDraft(); renderJob(); window.scrollTo(0, 0);
}
function goStep(s) { S.cur.step = s; S.cur.shotIdx = 0; saveDraft(); renderJob(); window.scrollTo(0, 0); }

function renderBar() {
  var bar = $('bar'), html = '';
  if (S.view === 'shopjob' || S.view === 'shopnew') { sjBar(bar); return; }
  if (S.view === 'new') {
    var okNew = S.nj.menu.length > 0;
    bar.innerHTML = '<div class="in"><button type="button" class="btn green" id="next" ' + (okNew ? '' : 'disabled') + '>▶ ' + t('btn_next') + '</button></div>';
    bar.hidden = false; $('next').onclick = startNewJob; return;
  }
  var c = S.cur, j = c.job, pg;
  if (c.step === 'check' && c.mode === 'shop') {
    html = '<button type="button" class="btn green" id="next" ' + (sjDamageReady(c) ? '' : 'disabled') + '>' + t('sj_go') + '</button>';
  } else if (c.step === 'before' && c.mode === 'shop') {
    pg = shotProg(shotsFor(j, 'before'), c.photos);
    html = '<div class="prog"><span>📷</span><span class="b"><i style="width:' + (pg.n ? Math.round(pg.got / pg.n * 100) : 0) + '%"></i></span><span class="num">' + pg.got + '/' + pg.n + '</span></div>' +
      '<button type="button" class="btn" id="next" ' + (pg.ok ? '' : 'disabled') + '>' + t('btn_next') + ' › <small>' + t('damage_title') + '</small></button>';
  } else if (c.step === 'confirm') {
    html = '<button type="button" class="btn green" id="next" ' + (sjCanSend(c) ? '' : 'disabled') + '>' + t('sj_send') + '</button>';
  } else if (c.step === 'check') {
    var n = Object.keys(c.checks).length, ready = n === 5 && (c.dmg.length > 0 || c.noDamage);
    html = '<div class="prog"><span class="num">' + n + '/5</span><span class="b"><i style="width:' + (n * 20) + '%"></i></span><span>🩹 <span class="num">' + c.dmg.length + '</span></span></div>' +
      '<button type="button" class="btn" id="next" ' + (ready ? '' : 'disabled') + '>' + t('btn_next') + ' › <small>' + t('photo_before') + '</small></button>';
  } else if (c.step === 'before') {
    pg = shotProg(shotsFor(j, 'before'), c.photos);
    html = '<div class="prog"><span>📷</span><span class="b"><i style="width:' + (pg.n ? Math.round(pg.got / pg.n * 100) : 0) + '%"></i></span><span class="num">' + pg.got + '/' + pg.n + '</span></div>' +
      '<button type="button" class="btn green" id="next" ' + (pg.ok ? '' : 'disabled') + '>▶ ' + t('btn_start') + '</button>';
  } else if (c.step === 'work') {
    var anyTime = Object.keys(c.svc).some(function (k) { return svcSec(c.svc[k]) > 0; });
    html = '<button type="button" class="btn red" id="next" ' + (anyTime ? '' : 'disabled') + '>■ ' + t('btn_finish') + '</button>';
  } else if (c.step === 'after') {
    pg = shotProg(shotsFor(j, 'after'), c.photos);
    html = '<div class="prog"><span>📷</span><span class="b"><i style="width:' + (pg.n ? Math.round(pg.got / pg.n * 100) : 0) + '%"></i></span><span class="num">' + pg.got + '/' + pg.n + '</span></div>' +
      '<button type="button" class="btn" id="next" ' + (pg.ok ? '' : 'disabled') + '>' + t('btn_next') + ' › <small>' + t('pay_title') + '</small></button>';
  } else if (c.step === 'close') {
    html = '<button type="button" class="btn green" id="next" ' + (canSavePay(c) ? '' : 'disabled') + '>💾 ' + t('btn_save') + '</button>';
  } else {
    html = '<button type="button" class="btn" id="next">‹ ' + t('tab_today') + '</button>';
  }
  bar.innerHTML = '<div class="in">' + html + '</div>';
  bar.hidden = false;
  $('next').onclick = function () {
    var btn = this; btn.disabled = true;
    if (c.mode === 'shop' && c.step === 'before') goStep('check');
    else if (c.mode === 'shop' && c.step === 'check') sjStartWork(c, btn);
    else if (c.mode === 'shop' && c.step === 'after') goStep('confirm');
    else if (c.step === 'confirm') sjSend(c, btn);
    else if (c.step === 'check') goStep('before');
    else if (c.step === 'before') {
      c.startAt = new Date().toISOString();
      setActive(c, j.menu[0]);
      queueStart(c).then(function () { c.startQueued = true; saveDraft(); toast('📥 ' + t('offline_saved'), 'ok'); goStep('work'); })
        .catch(function () { btn.disabled = false; toast('⚠ IndexedDB', 'warn'); });
    }
    else if (c.step === 'work') { setActive(c, null); c.endAt = new Date().toISOString(); goStep('after'); }
    else if (c.step === 'after') goStep('close');
    else if (c.step === 'close') {
      queueEnd(c).then(function () {
        S.done[j.id] = { pay: c.pay, amountDone: c.pay === 'free' ? 0 : (Number(c.amount) || 0), menuDone: Object.keys(c.svc).filter(function (k) { return !c.svc[k].skip; }) };
        Outbox.kvSet('done:' + ppDate(0), S.done);
        c.step = 'done'; Outbox.kvDel('draft'); renderJob(); window.scrollTo(0, 0);
      }).catch(function () { btn.disabled = false; toast('⚠ IndexedDB', 'warn'); });
    }
    else { S.view = 'home'; S.cur = null; Outbox.kvDel('draft'); render(); }
  };
}

// ═══════════════════════════════════════════════════════════════
//  お店の仕事（2026-10-27 Daisuke 裁可・LUXE Auto の作業から見直し）
//  お店を選ぶ → 車・サービス・値段（お店と決めた金額）→ 作業前の写真 → 傷・へこみ → 作業 → 作業後の写真 → 送る前の確認
//  店の車 = payment_type 'shop'、紹介のお客さん = 'shopref'、請求は ShopInvoice.gs（v7 @95 のままでも動く）
//  請求が止まらないよう v2.list_price は「定価（メニューの値段）とお店と決めた金額の大きい方」を送る
//  2026-10-28 サーバー側 v7/FieldShopMode.gs: price_mode 'agreed' の店の車は定価×率で検算せず、管理グループに「お店と決めた金額」
//    （目安の 0.5〜1.5倍の外は注意＝ sjOff と同じ）。傷の文章をお店へ（SHOP_DAMAGE_NOTE=on）。お店一覧の linked
// ═══════════════════════════════════════════════════════════════
function sjNum(v) { var n = parseFloat(v); return isFinite(n) && n > 0 ? Math.round(n * 100) / 100 : 0; }
function sjRound(n) { return Math.round(n * 100) / 100; }
// 目安: 店の車 = 業者価格（定価 ×(100−店の率)%）、紹介のお客さん = 定価。メニューに値段がない（BODY など）時は 0
function sjGuide(job, who, rate) {
  var g = priceOf({ menu: job.menu || [], size: job.size });
  if (!(g > 0)) return 0;
  return who === 'ref' ? sjRound(g) : sjRound(g * (100 - (rate == null ? 30 : rate)) / 100);
}
function sjRunning() { return S.cur && S.cur.startQueued && S.cur.step !== 'done'; }
function sjFreq(id) { return (S.shopFreq && S.shopFreq[id]) || { n: 0, last: '' }; }
function sjBumpFreq(id) {
  if (!id) return;
  var f = sjFreq(id); S.shopFreq[id] = { n: (f.n || 0) + 1, last: ppDate(0) };
  Outbox.kvSet('shop_freq', S.shopFreq);
}
// グループと連携済みのお店（2026-10-28 サーバーが linked を返す。古いサーバー＝linked なしは全部を連携済みとみなす）
function sjLinked() { return (S.shops || []).filter(function (sp) { return sp.linked !== false; }); }
function sjFavs(max) {
  return sjLinked().filter(function (sp) { return sjFreq(sp.id).n > 0; })
    .sort(function (a, b) { var fa = sjFreq(a.id), fb = sjFreq(b.id); return (fb.n - fa.n) || (fb.last > fa.last ? 1 : fb.last < fa.last ? -1 : 0); })
    .slice(0, max || 6);
}
function sjShopName(id) { var sp = (S.shops || []).filter(function (x) { return x.id === id; })[0]; return sp ? sp.name : id; }
function sjChips(list, attr) {
  return list.map(function (sp) { return '<button type="button" class="sc gold" ' + attr + '="' + esc(sp.id) + '">' + esc(sp.name) + '</button>'; }).join('');
}

// ── ホーム（作業タブ）の一番上 ──
function sjHomeHtml() {
  var h = '<button type="button" class="shopbtn" id="sjStart"><b>' + t('sj_start') + '</b><span>' + t('sj_start_s') + '</span></button>';
  var fav = sjFavs(6);
  if (fav.length) h += '<div class="card"><div class="band">' + t('sj_fav') + '</div><div class="body" style="padding:10px 14px"><div class="hs">' + sjChips(fav, 'data-sjshop') + '</div></div></div>';
  return h;
}
function bindSjHome() {
  var b = $('sjStart'); if (b) b.onclick = function () {
    if (sjRunning()) { toast(t('job_running'), 'warn'); S.view = 'job'; render(); return; }
    S.shopQ = ''; S.view = 'shoppick'; render(); window.scrollTo(0, 0);

function sjOpenShop(id, name, isNew) {

  S.view = 'shopjob'; render(); window.scrollTo(0, 0);
}

// ── お店を選ぶ ──
function sjListHtml() {
  var q = String(S.shopQ || '').trim().toLowerCase();
  var list = sjLinked().filter(function (sp) { return !q || String(sp.name).toLowerCase().indexOf(q) >= 0 || String(sp.id).toLowerCase().indexOf(q) >= 0; })
    .sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); });
  if (!list.length) return '<div class="note" style="padding:10px 0">' + (S.shops && S.shops.length ? t('sj_none') : '⏳ ' + t('loading')) + '</div>';
  return list.map(function (sp) {
    var f = sjFreq(sp.id), sub = f.n ? '🕘 ' + f.last.slice(8, 10) + '/' + f.last.slice(5, 7) + ' · ×' + f.n : '';
    return '<button type="button" data-sjpick="' + esc(sp.id) + '"><span>' + esc(sp.name) + (sub ? '<small class="num">' + sub + '</small>' : '') + '</span><span style="color:var(--blue)">›</span></button>';
  }).join('');
}
function bindSjList() {
  document.querySelectorAll('[data-sjpick]').forEach(function (x) { x.onclick = function () { var id = x.getAttribute('data-sjpick'); sjOpenShop(id, sjShopName(id), false); }; });
}
function renderShopPick() {
  var fav = sjFavs(8), html = stripsHtml();

  html += '<div class="card"><div class="band">' + t('sj_all') + '<span class="r num">' + sjLinked().length + '</span></div><div class="body" style="padding:2px 14px"><div class="slist" id="sjList">' + sjListHtml() + '</div></div></div>';
  html += '<button type="button" class="newshop" id="sjNew">' + t('sj_new') + '</button>';

}
// 新しいお店の名前が、店マスターにあるお店（グループがまだのお店も）と同じなら、そのお店を選べるように（2026-10-28）
function sjSuggest(name) {
  var q = String(name || '').trim().toLowerCase();
  if (q.length < 2) return [];
  return (S.shops || []).filter(function (sp) { return String(sp.name).toLowerCase().indexOf(q) >= 0 || String(sp.id).toLowerCase().indexOf(q) >= 0; })
    .sort(function (a, b) { return (a.linked === false) - (b.linked === false) || String(a.name).localeCompare(String(b.name)); }).slice(0, 5);
}
function sjSugHtml() {

}
function bindSjSug() {

}
function renderShopNew() {
  $('main').innerHTML = '<div class="card"><div class="body"><div class="fld"><label>' + t('sj_new_name') + '</label><input id="sjName" autocomplete="off" value="' + esc((S.sj && S.sj.shopName) || '') + '"></div></div></div><div id="sjSug">' + sjSugHtml() + '</div>';

  bindSjSug();

}

// ── 車・サービス・値段（1画面） ──
function sjPriceHtml(o, guide, who) {
  return '<div class="big-amt"><input type="number" inputmode="decimal" id="pz" min="0" max="2000" placeholder="0" value="' + (o.price === '' || o.price == null ? '' : esc(o.price)) + '"><span>$</span></div>' +
    '<div class="pstep">' + [-5, -1, 1, 5].map(function (d) { return '<button type="button" data-pd="' + d + '">' + (d > 0 ? '+' : '−') + Math.abs(d) + '</button>'; }).join('') + '</div>' +
    '<div class="phint" id="pzHint">' + sjHintInner(sjNum(o.price), guide, who) + '</div>';
}
function sjOff(p, guide) { return guide > 0 && p > 0 && (p < guide * 0.5 || p > guide * 1.5); }
function sjHintInner(p, guide, who) {
  if (!(guide > 0)) return '<span>' + t(p > 0 ? 'sj_later_ok' : 'sj_no_guide') + '</span>';
  var d = sjRound(p - guide);
  return '<span>' + t(who === 'ref' ? 'sj_guide_ref' : 'sj_guide_shop', { v: guide }) + '</span>' +
    (p > 0 ? '<span class="d' + (sjOff(p, guide) ? ' warn' : '') + '">' + (d === 0 ? t('sj_diff_eq') : t('sj_diff', { s: d > 0 ? '+' : '−', v: Math.abs(d) })) + '</span>' : '');
}
function bindSjPrice(o, guide, who, onChange) {
  var inp = $('pz'); if (!inp) return;
  var upd = function () { $('pzHint').innerHTML = sjHintInner(sjNum(o.price), guide, who); if (onChange) onChange(); };
  inp.oninput = function () { o.price = inp.value; upd(); };
  document.querySelectorAll('[data-pd]').forEach(function (b) { b.onclick = function () {
    var v = Math.max(0, Math.min(2000, sjNum(o.price) + Number(b.getAttribute('data-pd'))));
    o.price = v ? String(sjRound(v)) : ''; inp.value = o.price; upd();
  }; });
}
function renderShopJob() {
  var sj = S.sj, rate = shopRateOf(sj.shop), guide = sjGuide(sj, sj.who, rate), html = '';
  // 金額を自分で直すまでは、サービス・車の大きさ・店の車/紹介を変えるたびに目安を入れておく（2026-10-28 Daisuke）
  if (sj.priceAuto !== false) sj.price = guide > 0 ? String(guide) : '';
  html += '<div class="seg2"><button type="button" data-sjwho="shop" class="' + (sj.who === 'shop' ? 'on' : '') + '">' + t('sj_who_shop') + '</button><button type="button" data-sjwho="ref" class="' + (sj.who === 'ref' ? 'on' : '') + '">' + t('sj_who_ref') + '</button></div>';
  html += '<div class="card"><div class="body">' +
    '<div class="fld"><label>' + t('car') + '</label><input id="sjCar" autocomplete="off" value="' + esc(sj.car) + '"></div>' +
    '<div class="fld"><label>' + t('sj_plate') + '</label><div class="vin"><input id="sjPlate" autocomplete="off" value="' + esc(sj.plate) + '">' +
      (sj.vinImg ? '<img src="' + sj.vinImg + '" alt="">' : '') +
      '<span class="cambtn">' + t('sj_shoot') + '<input type="file" accept="image/*" capture="environment" id="sjVin"></span></div></div>' +
    '<div class="seg2"><button type="button" data-sjsize="SEDAN" class="' + (sj.size === 'SEDAN' ? 'on' : '') + '">🚗 ' + t('size_sedan') + '</button><button type="button" data-sjsize="SUV" class="' + (sj.size === 'SUV' ? 'on' : '') + '">🚙 ' + t('size_suv') + '</button></div>' +
    '</div></div>';
  html += '<div class="card"><div class="band">' + t('sj_svc') + '</div><div class="body"><div class="hs" style="flex-wrap:wrap">' +
    Object.keys(MENU).map(function (k) { return '<button type="button" class="sc' + (sj.menu.indexOf(k) >= 0 ? ' on' : '') + '" data-sjsvc="' + k + '">' + (sj.menu.indexOf(k) >= 0 ? '✓ ' : '') + menuLabelH(k) + '</button>'; }).join('') +
    '</div></div></div>';
  html += '<div class="card"><div class="band">' + t(sj.who === 'ref' ? 'sj_pay_ref' : 'sj_pay_shop') + '<span class="r" style="font-weight:500">' + t('sj_later_ok') + '</span></div><div class="body">' + sjPriceHtml(sj, guide, sj.who) + '</div></div>';
  if (sj.menu.indexOf('BODY') >= 0) {
    html += '<div class="card"><div class="band">' + t('sj_rp') + '<span class="r" style="font-weight:500">' + t('sj_rp_s') + '</span></div><div class="body">' +
      '<div class="seg2 three">' + [['1', 'sj_yes'], ['0', 'sj_no'], ['2', 'sj_unk']].map(function (o) { return '<button type="button" data-sjrp="' + o[0] + '" class="' + (sj.repaint === o[0] ? 'on' : '') + '">' + t(o[1]) + '</button>'; }).join('') + '</div>' +
      (sj.repaint === '1' || sj.repaint === '2' ? '<div class="strip warn"><div class="grow">' + t('sj_rp_note') + '</div></div>' : '') + '</div></div>';
  }
  $('main').innerHTML = html;
  $('sjCar').oninput = function () { sj.car = this.value; renderBar(); };
  $('sjPlate').oninput = function () { sj.plate = this.value; renderBar(); };
  $('sjVin').onchange = function () { var f = this.files[0]; if (!f) return; readShrunk(f, function (u) { sj.vinImg = u; renderShopJob(); }); };
  document.querySelectorAll('[data-sjwho]').forEach(function (b) { b.onclick = function () { sj.who = b.getAttribute('data-sjwho'); renderShopJob(); }; });
  document.querySelectorAll('[data-sjsize]').forEach(function (b) { b.onclick = function () { sj.size = b.getAttribute('data-sjsize'); renderShopJob(); }; });
  document.querySelectorAll('[data-sjrp]').forEach(function (b) { b.onclick = function () { sj.repaint = b.getAttribute('data-sjrp'); renderShopJob(); }; });
  document.querySelectorAll('[data-sjsvc]').forEach(function (b) { b.onclick = function () {
    var k = b.getAttribute('data-sjsvc'), i = sj.menu.indexOf(k);
    if (i >= 0) sj.menu.splice(i, 1);
    else { EXCL.forEach(function (g) { if (g.indexOf(k) >= 0) sj.menu = sj.menu.filter(function (x) { return g.indexOf(x) < 0; }); }); sj.menu.push(k); }
    renderShopJob();
  }; });
  bindSjPrice(sj, guide, sj.who, function () { sj.priceAuto = !sjNum(sj.price); });   // 空にしたら目安に戻す
  renderBar();
}
function sjBar(bar) {
  var ok, label;
  if (S.view === 'shopnew') { ok = !!(S.sj && String(S.sj.shopName || '').trim()); label = '▶ ' + t('btn_next'); }
  else { ok = !!(S.sj && S.sj.menu.length && (String(S.sj.car || '').trim() || String(S.sj.plate || '').trim() || S.sj.vinImg)); label = t('sj_next_photos'); }
  bar.innerHTML = '<div class="in"><button type="button" class="btn green" id="next" ' + (ok ? '' : 'disabled') + '>' + label + '</button></div>';
  bar.hidden = false;
  $('next').onclick = function () {
    if (S.view === 'shopnew') { sjOpenShop('', String(S.sj.shopName).trim(), true); return; }
    sjStartJob();
  };
}
// 予約なしの作業と同じ「今日の一覧」に入れて、作業の流れ（S.cur）を始める
function sjStartJob() {
  var sj = S.sj; if (!sj || !sj.menu.length) return;
  if (sjRunning()) { toast(t('job_running'), 'warn'); S.view = 'job'; render(); return; }
  var item = { id: 'L-' + Outbox.uuid().slice(0, 8), bookingId: '', date: ppDate(0), time: hhmm(ppNow()),
               name: (sj.newShop ? '🆕 ' : '') + sj.shopName, place: sj.shopName, store: false, car: String(sj.car || '').trim(), plate: String(sj.plate || '').trim(),
               size: sj.size, menu: sj.menu.slice(), chatId: '', amount: 0, status: 'wait',
               mode: 'shop', shop: sj.shop || '', newShop: !!sj.newShop, who: sj.who, price: sj.price, repaint: sj.repaint || '' };
  S.local.push(item); Outbox.kvSet('local', S.local);
  var vin = sj.vinImg || null;
  S.sj = null;
  openItem(item.id);
  if (S.cur && S.cur.job.id === item.id) { S.cur.vinImg = vin; saveDraft(); }
}
// openItem から呼ぶ: 一覧の項目（お店の仕事）から作業の状態を作る
function sjInitCur(c, job) {
  c.mode = 'shop'; c.shop = job.shop || ''; c.shopName = job.place || job.name || ''; c.newShop = !!job.newShop;
  c.shopAtStart = !!c.shop; c.who = job.who === 'ref' ? 'ref' : 'shop'; c.price = job.price == null ? '' : String(job.price);
  c.repaint = job.repaint || ''; c.rate = shopRateOf(c.shop); c.src = 'shop'; c.step = 'before'; c.amount = 0; c.free = false;
}

// ── 傷・へこみ（作業前の写真のあと）。1か所ずつ写真＋ひとこと、無ければ「傷なし」 ──
function sjDamageReady(c) { return c.dmg.length ? c.dmg.every(function (d) { return !!d.img; }) : !!c.noDamage; }
function sjDamageHtml(c) {
  var miss = c.dmg.some(function (d) { return !d.img; });
  return '<div class="card"><div class="band">' + t('sj_dmg') + '<span class="r num">' + c.dmg.length + '</span></div><div class="body">' +
    '<div class="note">👆 ' + t('damage_tap') + '</div><div class="dmap" id="dmap">' + CAR_TOP +
    c.dmg.map(function (d, i) { return '<span class="mk" style="left:' + d.x + '%;top:' + d.y + '%">' + (i + 1) + '</span>'; }).join('') + '</div>' +
    (c.dmg.length ? '<div class="dmg-list">' + c.dmg.map(function (d, i) {
      return '<div class="dmg"><span class="no">' + (i + 1) + '</span><span class="ph">' + (d.img ? '<img src="' + d.img + '" alt="">' : '📷') + '<input type="file" accept="image/*" capture="environment" data-dmgph="' + i + '"></span><input class="memo" data-dmgmemo="' + i + '" value="' + esc(d.memo) + '" placeholder="' + esc(t('note')) + '"><button type="button" class="x" data-dmgdel="' + i + '">✕</button></div>';
    }).join('') + '</div>' : '') +
    (miss ? '<div class="strip err"><div class="grow">📷 ' + t('sj_dmg_need_photo') + '</div></div>' : '') +
    (c.dmg.length ? '' : '<button type="button" class="btn sm ' + (c.noDamage ? 'green' : 'ghost') + '" id="dmgNone">✓ ' + t('damage_none') + '</button>') +
    '<div class="note">' + t('sj_dmg_note') + '</div></div></div>';
}
function sjStartWork(c, btn) {
  if (!sjDamageReady(c)) { btn.disabled = false; return; }
  c.startAt = new Date().toISOString();
  setActive(c, c.job.menu[0]);
  queueStart(c).then(function () { c.startQueued = true; sjBumpFreq(c.shop); saveDraft(); toast('📥 ' + t('offline_saved'), 'ok'); goStep('work'); })
    .catch(function () { btn.disabled = false; toast('⚠ IndexedDB', 'warn'); });
}

// ── 作業中: 値段をすぐ直せる ──
function sjWorkPriceHtml(c) {
  if (c.editPrice) return '<div class="card"><div class="band">' + t('amount') + '</div><div class="body">' + sjPriceHtml(c, sjGuide(c.job, c.who, c.rate), c.who) + '</div></div>';
  return '<button type="button" class="btn sm ghost" id="sjEdit">' + t('sj_edit') + '<span class="num">' + (sjNum(c.price) || 0) + '$</span>)</button><div class="note" style="text-align:center">' + t('sj_edit_note') + '</div>';
}

// ── 送る前の確認（今の支払い画面の代わり）。払い方は選ばせない。無料のデモだけ切りかえ ──
function sjVals(c) {
  var rate = c.rate == null ? shopRateOf(c.shop) : c.rate, p = sjNum(c.price), g = sjRound(priceOf(c.job));
  if (c.free) return { pay: 'free', amount: 0, list: 0, rate: null };
  if (c.who === 'ref') return { pay: 'shopref', amount: sjRound(p * (100 - rate) / 100), list: p, rate: rate };
  return { pay: 'shop', amount: p, list: g >= p ? g : p, rate: rate };   // list ≧ 金額 にして請求を止めない（目安との差は管理グループに出る）
}
function sjCanSend(c) { if (c.free) return true; var v = sjVals(c); return v.amount > 0 && sjNum(c.price) <= 2000; }
function sjConfirmHtml(c) {
  var v = sjVals(c), guide = sjGuide(c.job, c.who, c.rate), svc = c.job.menu.filter(function (k) { return !(c.svc[k] && c.svc[k].skip); }).map(menuLabel).join(' + ');
  var car = [c.job.car, c.job.plate].filter(Boolean).join(' / ');
  var h = '<div class="card"><div class="band">' + t('sj_preview') + '</div><div class="body"><div class="tgp">' +
    '<div class="m"><span class="bot">SAMURAI MOTORS Booking</span><span>' + t('sj_tg_end') + '</span>' + (car || svc ? '<span>🚗 ' + esc(car) + (car && svc ? ' · ' : '') + esc(svc) + '</span>' : '') + '<span>' + t('sj_tg_after') + '</span></div>' +
    (c.free ? '' : '<div class="m"><span>' + t('sj_tg_req') + '</span><span>' + t('sj_tg_due') + ' <b class="num" id="sjDue">' + v.amount + '$</b></span><span>' + t('sj_tg_scan') + '</span></div>') +
    '</div></div></div>';
  if (c.free) {
    h += '<div class="strip ok"><div class="grow">🎁 ' + t('pay_free') + '</div><button type="button" id="sjFree">' + t('sj_free_btn') + '</button></div>';
  } else {
    h += '<div class="card"><div class="band">' + t(c.who === 'ref' ? 'sj_pay_ref' : 'sj_pay_shop') + '<span class="r" style="font-weight:500">' + t('sj_amt_s') + '</span></div><div class="body">' + sjPriceHtml(c, guide, c.who) +
      (c.who === 'ref' ? '<div class="note" id="sjSplit">' + (v.list > 0 ? esc(t('amt_split', { list: v.list, amt: v.amount, rate: v.rate })) : '') + '</div>' : '') + '</div></div>';
    if (!(sjNum(c.price) > 0)) h += '<div class="note">' + t('sj_price_need') + '</div>';
    if (c.askOff) h += '<div class="askoff"><div>' + (guide > 0 ? t('sj_off_q', { v: sjNum(c.price), g: guide }) : t('sj_off_q0', { v: sjNum(c.price) })) + '</div><div class="row2"><button type="button" class="btn sm green" id="sjOffYes">' + t('sj_off_yes') + '</button><button type="button" class="btn sm ghost" id="sjOffNo">' + t('sj_fix') + '</button></div></div>';
    h += '<div class="row2" style="align-items:center"><div class="note">' + t('sj_free_q') + '</div><button type="button" class="btn sm ghost" id="sjFree">' + t('sj_free_btn') + '</button></div>';
  }
  return h;
}
function sjSend(c, btn) {
  if (!sjCanSend(c)) { btn.disabled = false; return; }
  var guide = sjGuide(c.job, c.who, c.rate);
  if (c.sending) return;
  // 打ち間違い防止: 目安が無い（BODY など）時は毎回、目安がある時は外れた時だけ、送る前に1回聞く
  if (!c.free && (sjOff(sjNum(c.price), guide) || !(guide > 0)) && !c.offOk) { c.askOff = true; saveDraft(); renderJob(); return; }
  c.sending = true;
  var v = sjVals(c);
  c.pay = v.pay; c.amount = v.amount; c.list = v.list; c.rate = v.rate; c.src = 'shop';
  queueEnd(c).then(function () {
    S.done[c.job.id] = { pay: c.pay, amountDone: c.amount, menuDone: Object.keys(c.svc).filter(function (k) { return !c.svc[k].skip; }) };
    Outbox.kvSet('done:' + ppDate(0), S.done);
    c.step = 'done'; Outbox.kvDel('draft'); renderJob(); window.scrollTo(0, 0);
  }).catch(function () { c.sending = false; btn.disabled = false; toast('⚠ IndexedDB', 'warn'); });
}

// ── 完了: 同じお店でもう1台 ──
function sjDoneHtml(c) {
  return '<div class="card"><div class="body"><div style="font-weight:700;text-align:center">' + esc(t('sj_sent', { shop: c.shopName })) + '</div>' +
    '<button type="button" class="btn gold" id="sjAgain">' + t('sj_again', { shop: esc(c.shopName) }) + '</button>' +
    '<button type="button" class="btn sm ghost" id="sjHome">' + t('sj_home') + '</button></div></div>';
}
function bindSjJob(c) {
  var guide = sjGuide(c.job, c.who, c.rate);
  if (c.step === 'confirm' || (c.step === 'work' && c.editPrice)) {
    bindSjPrice(c, guide, c.who, function () {
      c.askOff = false; c.offOk = false; saveDraft();
      var v = sjVals(c), due = $('sjDue'); if (due) due.textContent = v.amount + '$';
      var sp = $('sjSplit'); if (sp) sp.textContent = v.list > 0 ? t('amt_split', { list: v.list, amt: v.amount, rate: v.rate }) : '';
      renderBar();
    });
  }
  var ed = $('sjEdit'); if (ed) ed.onclick = function () { c.editPrice = true; saveDraft(); renderJob(); };
  var fr = $('sjFree'); if (fr) fr.onclick = function () { c.free = !c.free; c.askOff = false; saveDraft(); renderJob(); };
  var oy = $('sjOffYes'); if (oy) oy.onclick = function () { oy.disabled = true; c.offOk = true; c.askOff = false; var nb = $('next'); if (nb) { nb.disabled = true; sjSend(c, nb); } };
  var on = $('sjOffNo'); if (on) on.onclick = function () { c.askOff = false; renderJob(); var pz = $('pz'); if (pz) pz.focus(); };
  var ag = $('sjAgain'); if (ag) ag.onclick = function () {
    S.sj = { shop: c.shop, shopName: c.shopName, newShop: c.newShop, who: c.who, car: '', plate: '', size: c.job.size, menu: c.job.menu.slice(), price: c.price, priceAuto: sjNum(c.price) === sjGuide(c.job, c.who, c.rate), repaint: '', vinImg: null, again: true };
    S.cur = null; Outbox.kvDel('draft'); S.view = 'shopjob'; render(); window.scrollTo(0, 0);
  };
  var hm = $('sjHome'); if (hm) hm.onclick = function () { S.cur = null; Outbox.kvDel('draft'); S.view = 'home'; S.tab = 'today'; render(); };
}

// ═══════════════════════════════════════════════════════════════
//  描画の入口
// ═══════════════════════════════════════════════════════════════
function render() {
  if (S.view === 'job' && !S.cur) S.view = 'home';   // 念のため（2026-10-27）
  document.body.setAttribute('data-lang', LANG);
  if (timerId && S.view !== 'job') { clearInterval(timerId); timerId = null; }
  var inFlow = S.view === 'job' || S.view === 'new' || S.view === 'shoppick' || S.view === 'shopnew' || S.view === 'shopjob';
  $('bar').hidden = !inFlow; $('main').className = inFlow ? 'flow' : 'tabbed';
  $('tabs').hidden = inFlow;
  $('tabTodayL').textContent = t('tab_work'); $('tabAttL').textContent = t('tab_att'); $('tabExpL').textContent = t('tab_expense'); $('tabScoutL').textContent = t('tab_scout');
  var scoutOk = scoutAvailable();
  $('tabScout').hidden = !scoutOk; $('tabs').className = scoutOk ? 'tabs four' : 'tabs three';
  if (S.tab === 'scout' && !scoutOk) S.tab = 'today';
  document.querySelectorAll('.tab').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-tab') === S.tab)); });
  var inScout = !inFlow && S.tab === 'scout';
  $('scoutWrap').hidden = !inScout; $('head').hidden = inScout; $('main').hidden = inScout;
  if (inScout) { ensureScoutFrame(); return; }
  renderHead();
  if (S.view === 'job' && S.cur) renderJob();
  else if (S.view === 'new') renderNew();
  else if (S.view === 'shoppick') renderShopPick();
  else if (S.view === 'shopnew') renderShopNew();
  else if (S.view === 'shopjob' && S.sj) renderShopJob();
  else { S.view = 'home'; if (S.tab === 'expense') renderExpense(); else if (S.tab === 'att') renderAtt(); else renderHome(); }
}

// ═══════════════════════════════════════════════════════════════
//  起動: 端末の保存分ですぐ描画 → 裏で最新を取得
// ═══════════════════════════════════════════════════════════════
function boot() {
  var today = ppDate(0);
  Promise.all([Outbox.kvGet('menu'), Outbox.kvGet('today'), Outbox.kvGet('done:' + today), Outbox.kvGet('draft'), Outbox.kvGet('local'),
               Outbox.kvGet('att:' + today), Outbox.kvGet('me'), Outbox.kvGet('exp_hist'), Outbox.kvGet('shops'), Outbox.kvGet('shop_freq')])
    .then(function (r) {
      if (Array.isArray(r[8]) && r[8].length) S.shops = r[8];
      if (r[9] && typeof r[9] === 'object') S.shopFreq = r[9];
      if (r[7]) S.expHist = r[7];
      if (r[5]) S.att = r[5];
      if (r[6] && r[6].chatId === ME.chatId) { ME.staff = r[6].staff; ME.keyOk = r[6].keyOk; ME.state = r[6].state || ME.state; }
      if (r[0]) applyMenu(r[0]);
      if (r[1] && r[1].res) { applyToday(r[1].res); S.load = 'cached'; }
      S.done = r[2] || {};
      S.local = (r[4] || []).filter(function (l) { return l.date >= ppDate(-1); });
      if (r[3] && r[3].job) {
        S.cur = r[3];
        if (S.cur.pay === 'cash') S.cur.pay = '';   // 旧い下書きの現金（2026-10-25 で廃止）は選び直してもらう
        if (S.cur.step !== 'done') { S.view = 'job'; setTimeout(function () { toast('↺ ' + t('draft_restored'), 'ok'); }, 300); }
        else S.cur = null;
      }
    })
    .catch(function () {})
    .then(function () {
      render();
      Outbox.start({ url: GAS_URL, appVersion: APP_VERSION, onChange: function (cnt, list) {
        S.ob = cnt;
        S.expSent = {}; (list || []).forEach(function (r) { if (r.kind === 'expense_submit' && r.status === 'sent') S.expSent[r.client_id] = true; });
        var histChanged = false;
        S.expHist.forEach(function (h) { if (!h.sent && S.expSent[h.cid]) { h.sent = true; histChanged = true; } });
        if (histChanged) Outbox.kvSet('exp_hist', S.expHist);
        // 入力中は描き直さない（文字入力が途切れるため）
        var typing = document.activeElement && /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);
        if (S.view === 'home' && !typing && S.tab !== 'scout') { if (S.tab === 'expense') renderExpense(); else if (S.tab === 'att') renderAtt(); else renderHome(); }
        renderHead();
      } });
      loadData(false);
    });
}

// 画面の端末保存（Service Worker）と新しい版の案内
if ('serviceWorker' in navigator) {
  var reloading = false;
  var hadController = !!navigator.serviceWorker.controller;   // 初回の有効化では再読み込みしない
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (reloading || !hadController) { hadController = true; return; }
    reloading = true; location.reload();
  });
  navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' }).then(function (reg) {
    function watch(w) {
      if (!w) return;
      w.addEventListener('statechange', function () {
        if (w.state === 'installed' && navigator.serviceWorker.controller) { S.waitingSW = w; render(); }
      });
    }
    if (reg.waiting && navigator.serviceWorker.controller) { S.waitingSW = reg.waiting; }
    reg.addEventListener('updatefound', function () { watch(reg.installing); });
    reg.update().catch(function () {});
  }).catch(function () {});
}

document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { S.tab = b.getAttribute('data-tab'); S.view = 'home'; render(); window.scrollTo(0, 0); }; });
setInterval(function () { var c = $('clock'); if (c) c.textContent = hhmm(ppNow()); }, 15000);
boot();
</script>
</body>
</html>
